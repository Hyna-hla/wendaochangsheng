<style>

<body>
<div id="app"></div>
<script>
/* ===================== 存储保险丝 ===================== */
let MEM={};
function sGet(k){try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;}}
function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
function sDel(k){try{localStorage.removeItem(k);}catch(e){delete MEM[k];}}

/* ===================== 工具 ===================== */
const $=s=>document.querySelector(s);
const RI=n=>Math.floor(Math.random()*n);
const D100=()=>1+RI(100);
const CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
function tag(t,c){return '<span class="tag b-'+c+'">'+t+'</span>';}
function pb(v,max,c){const p=CL(v/max*100,0,100);return '<span class="pbj"><i style="width:'+p+'%;background:'+c+'"></i></span>';}
function panel(theme,title,body,warn){
 return '<div class="panel t-'+theme+(warn?' warnbg':'')+'"><span class="bar-title">'+title+'</span><div class="hr"></div>'+body+'</div>';
}

/* ===================== 数据 ===================== */
const EL={金:'#C9A45C',木:'#6BA38E',水:'#5E8FAE',火:'#C05F55',土:'#B08A4E'};
const VAR={雷:'#8B6FA8',风:'#7F9C9C',冰:'#7FA8C9'};
const RL=[
 {n:'炼气',life:100,base:10,need:100},{n:'筑基',life:200,base:9,need:140},
 {n:'结晶',life:300,base:8,need:190},{n:'金丹',life:500,base:8,need:260},
 {n:'具灵',life:800,base:7,need:340},{n:'元婴',life:1200,base:7,need:470},
 {n:'化神',life:2000,base:6,need:640},{n:'悟道',life:5000,base:5,need:950},
 {n:'羽化',life:10000,base:4,need:1450},{n:'登仙',life:50000,base:3,need:2300}];
const STG=['初期','中期','后期','圆满'];

 {n:'天灵根',c:2.0,d:'单系 · 万中无一 · 修炼极快'},

 {n:'真灵根',c:1.3,d:'三系均衡'},
 {n:'伪灵根',c:1.0,d:'四五系杂而不精 · 可修多系'},
 {n:'变异灵根',c:1.8,d:'雷风冰之一 · 特殊功法适配 · 需机缘判定',varOnly:1}];

 {n:'农家子',d:'道心+2 · 无依无靠',f:p=>p.att[4]+=2},

const CONS=[
 {n:'先天道体',d:'修炼效率×1.5'},{n:'剑灵体',d:'剑系威力+30%'},{n:'九阳圣体',d:'火系威力+30% 气血上限+40'},
 {n:'冰魄灵体',d:'冰系威力+30%'},{n:'纯阳体/玄阴体',d:'双修增益 · 情缘线'},{n:'混沌体',d:'传说 · 五行皆通（需机缘）'},{n:'凡体',d:'无特殊'}];
const TALENTS=[
 {n:'天资聪颖',d:'资质+3',c:1,f:p=>p.att[0]+=3},{n:'过目不忘',d:'悟性+3',c:1,f:p=>p.att[1]+=3},
 {n:'身轻如燕',d:'遁速+3',c:1,f:p=>p.att[3]+=3},{n:'天生道心',d:'道心+3',c:1,f:p=>p.att[4]+=3},
 {n:'气运加身',d:'仙缘+3',c:1,f:p=>p.att[5]+=3},{n:'神识过人',d:'神识+3',c:1,f:p=>p.att[2]+=3},
 {n:'百脉俱通',d:'灵力上限+60',c:1,f:p=>p.mpM+=60},{n:'钢筋铁骨',d:'气血上限+90',c:1,f:p=>p.hpM+=90},
 {n:'桃花运',d:'好感收益+20%',c:1,f:p=>p.charmBonus=1.2},{n:'药理通神',d:'历练所得灵草加倍',c:1,f:p=>p.herbLuck=1},
 {n:'体弱多病',d:'气血上限-50 · 返还2天赋点',c:-2,f:p=>p.hpM-=50}];

const REGIONS=[
 {n:'东洲 · 青岳',rec:1,d:'散修与凡人混居，青云宗与天机坊市所在',e:0},
 {n:'南疆 · 赤炎',rec:2,d:'火脉妖兽横行，深处有化形妖王',e:1},
 {n:'西漠 · 流沙',rec:3,d:'上古遗迹与佛门净土，魔渊深不可测',e:2},
 {n:'北原 · 寒渊',rec:4,d:'雪族领地，幽冥殿鬼修出没',e:3},
 {n:'中州 · 天阙',rec:3,d:'诸道统林立，卧虎藏龙，弱者寸步难行',e:4}];
const REGNAME=['炼气/筑基','炼气/筑基','筑基~金丹','金丹~元婴','元婴~化神'];
const NPCS=[
 {id:'gqx',n:'顾清玄',sx:'男',ag:22,loc:0,d:'青云宗真传 · 温润剑修',like:['剑','清茶','山水']},
 {id:'yq',n:'云栖',sx:'女',ag:25,loc:0,d:'天机坊市老板娘 · 聪慧狡黠',like:['灵石','奇闻','算计']},
 {id:'swj',n:'谢无咎',sx:'男',ag:24,loc:1,d:'血魔宗少主 · 亦正亦邪',like:['烈酒','真心']},
 {id:'bns',n:'白凝霜',sx:'女',ag:21,loc:3,d:'北原雪族圣女 · 清冷孤高',like:['雪','冰系灵植']},
 {id:'mc',n:'墨尘',sx:'男',ag:'不祥',loc:1,d:'古妖山少主 · 化形妖族傲娇少年',like:['灵果','肉食','自由']},
 {id:'lqq',n:'洛浅浅',sx:'女',ag:20,loc:1,d:'合欢宗弟子 · 多情却怕寂寞',like:['甜食','新鲜事']}];
const MK=[
 {n:'聚气丹',p:20,d:'修为+18',ty:'pill',fx:g=>addCult(g,18)},
 {n:'回春丹',p:30,d:'气血+50',ty:'pill',fx:g=>heal(g,'hp',50)},
 {n:'凝神丹',p:45,d:'灵力+50',ty:'pill',fx:g=>heal(g,'mp',50)},
 {n:'破障丹',p:120,d:'修为+60（辅助冲关）',ty:'pill',fx:g=>addCult(g,60)},
 {n:'火鳞符',p:25,d:'战斗 · 朱砂火符伤敌',ty:'fu'},
 {n:'玄龟符',p:35,d:'战斗 · 大幅减免一次攻击',ty:'fu'},
 {n:'遁地符',p:60,d:'战斗 · 瞬遁脱离',ty:'fu'},
 {n:'人道破境丹',p:400,d:'大突破 · 人道引桥之媒',ty:'bao'},
 {n:'天材地宝',p:900,d:'地道突破所需（两枚）',ty:'bao'},
 {n:'五行灵珠',p:2600,d:'天道突破所需 · 须雷劫印证',ty:'zhu'},
 {n:'玄阶功法残卷',p:850,d:'功法升为玄阶（修炼×1.3）',ty:'gf',to:{n:'长春功',g:'玄'}},
 {n:'地阶功法孤本',p:3600,d:'功法升为地阶（×1.7）· 需结晶境',ty:'gf',req:2,to:{n:'太虚剑典',g:'地'}}];
const GF={黄:{c:1.0},玄:{c:1.3},地:{c:1.7},天:{c:2.2}};
const AWAKEN=['剑心通明（杀伤+20%）','丹药精通（丹效+30%）','气运如虹（仙缘+2）','肉身成圣（气血上限+25%）',
 '天眼通（神识+3）','双修悟道（双修收益+50%）','聚灵体（修炼+15%）','心如磐石（道心+3，挡一次心魔）',
 '万里神行（遁速+3）','灵兽亲和（历练更安全）','大道之体（六维+1）'];
const WU_TREES=[{n:'剑道',d:'杀伤+6%/级'},{n:'丹道',d:'丹药效果+15%/级'},{n:'体道',d:'气血上限+8%/级'},
 {n:'遁法',d:'遁走成功率+8%/级'},{n:'有情道',d:'好感收益+20%/级'}];

/* ===================== 全局状态 ===================== */
let G=null,C=null,DEAD=false;
const LEGACY=()=>parseInt(sGet('wdcs_legacy')||'0');
function newChar(){return{name:'',dao:'',sex:'男',customSex:'',age:24,look:'',
 origin:-1,path:-1,root:-1,eles:[],con:6,talents:[],alloc:[6,6,6,6,6,6],_step:1};}
function rd(){return G.c;}

/* ===================== 建号 ===================== */
function buildPlayer(){
 const p=C,lg=Math.min(LEGACY(),3);
 const P={name:p.name||'',sex:p.sex==='自'?(p.customSex||'不可名状'):p.sex,
  age:p.age,att:p.alloc.slice(),look:p.look,path:PATHS[p.path],
  origin:p.origin>=0?ORIGINS[p.origin].n:'无',rootType:ROOTS[p.root].n,rootC:ROOTS[p.root].c,
  eles:p.eles.slice(),con:CONS[p.con].n,rIdx:0,stg:0,cult:0,hp:100,mp:100,
  hpM:100,mpM:100,stones:100+lg*80,rep:0,karma:0,merit:0,
  y:387,m:1,startAge:p.age,bag:[{n:'聚气丹',k:2},{n:'回春丹',k:1}],
  gongfa:{n:'聚气诀',g:'黄'},herbs:[],wu:0,wuT:[0,0,0,0,0],awaken:[],rel:{},dao:null,
  sect:null,rank:0,contrib:0,region:0,cave:{lv:0,jingShi:false,zhen:false},
  abn:[],kills:0,charmBonus:1,herbLuck:0,view:'main'};
 if(p.con==='九阳圣体')P.hpM+=40;
 if(p.origin>=0)ORIGINS[p.origin].f(P);
 P.att=P.att.map(v=>CL(v,1,20));
 P.att[5]=CL(P.att[5]+lg,1,20);
 if(p.root===4&&!p.eles.length)p.eles=[Object.keys(VAR)[RI(3)]];
 for(const t of p.talents){const td=TALENTS.find(x=>x.n===t);if(td)td.f(P);}
 P.hpM=Math.max(60,P.hpM);P.mpM=Math.max(80,P.mpM);P.hp=P.hpM;P.mp=P.mpM;
 const s=p.look||'';
 P.zi=/倾国|倾城|仙/.test(s)?'超凡':(/帅|俊|美|丽|清|妍|皎/.test(s)?(/绝世/.test(s)?'超凡':'出众'):['凡姿','清秀','清秀','出众'][RI(4)]);
 if(!P.name)P.name=['陈默','洛云舟','苏挽星'][RI(3)];
 P.dao=('青芜清微玄裳听雪抱朴').match(/.{2}/g)[RI(4)];
 return P;
}

/* ===================== 数值公式 ===================== */
function mindCoef(p){const req=4+p.rIdx*2;return p.att[4]>=req+4?1.2:(p.att[4]>=req?1.0:0.55);}
function qiCoef(p){return [1,1.35,1.6,1.9][p.cave.lv];}
function cultGain(p,closed){
 let v=RL[p.rIdx].base*(1+p.att[0]*0.05)*p.rootC*p.rootC*GF[p.gongfa.g].c*qiCoef(p)*mindCoef(p);
 if(p.con==='先天道体')v*=1.5;
 if(p.awaken.some(a=>a.startsWith('聚灵')))v*=1.15;
 if(closed)v*=2*(p.cave.jingShi?1.1:1);
 if(p.abn.includes('心魔缠身'))v*=0.5;
 if(p.abn.includes('内伤'))v*=0.5;
 return v;}
function needOf(p){return RL[p.rIdx].need;}
function addCult(p,v){if(p)p.cult=CL(p.cult+v,0,9999);}
function heal(p,k,v){const mul=danMul(p);if(k==='hp')p.hp=CL(p.hp+v*mul,0,p.hpM);else p.mp=CL(p.mp+v*mul,0,p.mpM);}
function danMul(p){return 1+p.wuT[1]*0.15+(p.awaken.some(a=>a.startsWith('丹药'))?0.3:0);}
function power(p){return [26,54,96,168,290,470,760,1200,1900,3100][p.rIdx]*(0.92+p.stg*0.09)*(1+p.wuT[0]*0.06)*(p.awaken.some(a=>a.startsWith('剑心'))?1.2:1);}
function guardVal(p){return p.rIdx*8+p.stg*3;}

}

/* ---------- 创角 ---------- */
function renderCreate(step){

 const ag=$('#agr');if(ag){ag.addEventListener('input',()=>{C.age=+ag.value;const s=$('#agv');if(s)s.textContent=ag.value;});}
}
function createHTML(step){
 const p=C;

function mkEnemy(base,scale,boss){
 const nm=boss?('凶名赫赫的'+['血煞门客','妖狼头领','蚀骨老鬼','截道修士'][RI(4)]):
  ['游方的血魔宗徒','山中妖兽','邪修散人','护宝傀儡','抢道的野修'][RI(5)];
 const np=[26,54,96,168,290,470,760,1200,1900,3100];
 const rr=CL(base+RI(3)-1,0,9);
 const pw=np[rr]*(0.9+RI(2)*0.1)*scale*(1+REGIONS[G.c.region].e*0.06);
 return{n:nm,r:rr,stg:RI(4),hp:pw*6,hpM:pw*6,pw:pw};
}
function oppAssess(e){const d=e.r-G.c.rIdx;

function cbl(s){G.cb.log.push(s);}
function hostileKill(name){return /血魔|邪修|妖兽|傀儡|野修|头领|老鬼|门客|截道/.test(name);}
function enemyStrike(){
 const c=G.cb,p=G.c,e=c.e;
 let ed=e.pw*0.30*(0.85+Math.random()*0.3)-guardVal(p)*1.2;
 if(c.calm){ed*=0.7;c.calm=false;}
 if(c.guard)ed*=0.5;
 if(c.shield){ed*=0.25;c.shield=false;}
 c.guard=false;
 ed=Math.max(1,Math.floor(ed));
 p.hp-=ed;
 cbl('<span style="color:#B23F33">'+e.n+' 还以颜色，你受创 '+ed+'。</span>');
 return p.hp<=0;
}
function cbFight(opt){
 const c=G.cb,p=G.c,e=c.e;if(!c)return;
 const sup=e.r-p.rIdx>=2?0.08:e.r-p.rIdx===1?0.4:1;
 const esup=p.rIdx-e.r>=1?0.55:1;
 if(opt==='atk'){
  const big=c.charge>=2;c.charge=0;
  let d=power(p)*0.32*(big?2.3:1)*(0.85+Math.random()*0.3)*sup-(2+e.r*3);
  d=Math.max(1,Math.floor(d));
  if(big)cbl('<span style="color:#8B6FA8">【绝技】光影暴涨！对 '+e.n+' 造成 <b>'+d+'</b> 重创！'+(sup<1?'——奈何境界鸿沟深似海。':'')+'</span>');
  else cbl('<span style="color:#C4675C">交锋一合，造成 '+d+' 伤害。</span>');
  e.hp-=d;
 }else if(opt==='chg'){c.charge++;cbl('<span style="color:#7a5fa8">锋芒尽敛，气机内蕴。（蓄势 '+c.charge+'/2）</span>');}
 else if(opt==='def'){c.guard=true;cbl('<span style="color:#7FA8C9">凝神守御，减伤一半。</span>');}
 else if(opt==='flee'){
  const ch=CL(30+p.att[3]*3+p.wuT[3]*8-(e.r-p.rIdx)*15+(e.hp<e.hpM*0.3?15:0),5,92);
  if(D100()<=ch){G.cb=null;say('<b class="lg-g">足下遁光乍起——走脱了！</b>','g');afterAction();return;}
  cbl('<span style="color:#C05F55">遁法被一眼看破，衣角被罡风削去一片！</span>');
 }
 else if(opt==='talk'){
  if(D100()<(40+p.att[4]*2)){c.calm=true;cbl('<span style="color:#8C8578">「且慢。」你朗声道出一番道理，对方攻势一滞。</span>');}
  else cbl('<span style="color:#8C8578">言辞无用，杀气不减。</span>');
 }
 if(e.hp<=0){winCombat();return;}
 if(enemyStrike()){cbl('<span class="lg-r">眼前发黑，意识坠入深渊……</span>');endCombatLost();return;}
 c.turn++;render();
}

 else say('<b class="lg-g">尘埃落定，「'+e.n+'」倒在了你的面前。</b>神魂震荡，修为精进。','g');

 if(p.path==='快意恩仇'&&D100()<10)say('恍惚间，你觉得那个纠缠多年的影子又近了一步……','p');
 afterAction();

function finishBig(path,rate,hits){

 let ok=D100()<=rate;if(hits<=1)ok=true;
 if(ok){
  p.rIdx++;p.stg=0;p.cult=0;
  const mul=path==='H'?1.2:path==='D'?1.35:1.55;
  p.hpM=Math.floor(p.hpM*mul);p.mpM=Math.floor(p.mpM*mul);p.hp=p.hpM;p.mp=p.mpM;
  if(path!=='H')for(let i=0;i<6;i++)p.att[i]=CL(p.att[i]+(path==='T'?2:1),1,20);
  say('<b class="lg-g">沧海一声笑——破境功成！而今正是：'+RL[p.rIdx].n+' 初期。寿元上限升至 '+RL[p.rIdx].life+' 载。</b>','g');
  if(p.abn.includes('心魔缠身')){p.abn.splice(p.abn.indexOf('心魔缠身'),1);say('破境的狂喜涤荡识海，心魔一时蛰伏。','g');}
  if(p.rIdx===9){afterAction();ascend();return;}
  afterAction();grantAwaken();return;
 }
 if(p.rIdx>=3){
  p.cult=Math.floor(needOf(p)*0.6);p.stg=2;p.hp=Math.max(5,p.hp-40);

 }else{

 heartDemonCheck();

function removeItem(n,k){const it=rd().bag.find(b=>b.n===n);if(!it)return false;it.k-=k;if(it.k<=0)rd().bag.splice(rd().bag.indexOf(it),1);return true;}

   const x=D100();

   else if(x<=72){const h=pickHerb(d);addHerb(h);say('洞天深处，采得【'+h.n+'】。','g');}
   else{say('深处有守护残魂苏醒——','');startCombat(mkEnemy(p.rIdx+(d>1?1:0),1,true));fought=true;}
  }
  if(!fought){
   if(p.awaken.length<9&&D100()<10){grantAwaken();}
   afterAction();return;
  }
  return;
 }else if(r<=80){
  const g=['聚气丹','回春丹'][RI(2)];addItem(g,1);p.merit++;
  say('一名邋遢老者讨酒喝，你把葫芦递上。他大笑而去，袖中滚出一枚【'+g+'】。（功德+1）','g');
 }else if(r<=(86+boost)&&boost>0){
  say('<span class="danger">此地本不该你来——杀机已至！</span>');
  startCombat(mkEnemy(p.rIdx+1,1.15,true));return;
 }else if(r<=93){
  p.wu++;say('空山新雨，溪畔枯坐一日，隐隐有所明悟。（悟道点+1）','g');
 }else say('一无所获，倒遇见几户烧炭人家，灯火可亲。','s');
 afterAction();
}

function btSmall(){
 const p=G.c;if(p.cult<needOf(p))return;
 const rate=CL(62+p.att[4]*2.4,50,95);
 if(!monthAct())return;
 if(D100()<=rate){
  p.stg++;p.cult=0;p.hpM+=6;p.mpM+=6;p.hp=p.hpM;p.mp=p.mpM;
  say('<b class="lg-g">瓶颈应声而碎！晋升 '+RL[p.rIdx].n+' · '+STG[p.stg]+'，气血灵力上限各增。</b>','g');
  if(D100()<=30){p.wu++;say('破境之际灵台清明，悟道点+1。','g');}
 }else{
  p.cult=Math.floor(needOf(p)*0.7);p.hp=Math.max(5,p.hp-15);
  say('气机一滞，逆转反噬，喉头一甜。<b>冲击失败</b>，修为跌回七成。','r');
 }
 checkAuto();
}
function btBig(path){
 const p=G.c;if(p.cult<needOf(p)||p.stg<3)return;
 if(path==='H'){
  if(cntBag('人道破境丹')<1){
   if(confirm('手中无人间破境丹。以 '+RDprice()+' 灵石向坊市急购一枚？')){
    if(p.stones<RDprice()){say('灵石不够，掌柜摇头。','r');render();return;}
    p.stones-=RDprice();addItem('人道破境丹',1);
   }else return;
  }
  removeItem('人道破境丹',1);
 }else if(path==='D'){
  if(cntBag('天材地宝')<2){say('需天材地宝两枚，尚缺 '+(2-cntBag('天材地宝'))+' 枚。','r');render();return;}
  removeItem('天材地宝',2);
 }else{
  if(cntBag('天材地宝')<1||cntBag('五行灵珠')<1){say('天道之路：须天材地宝 + 五行灵珠齐备。','r');render();return;}
  removeItem('天材地宝',1);removeItem('五行灵珠',1);
 }
 if(!monthAct())return;
 let base=path==='H'?88:path==='D'?72:52;
 base-=p.rIdx*4;base+=Math.floor((p.att[4]-10)*1.5);
 if(p.abn.includes('心魔缠身'))base-=25;
 base=CL(base,15,95);
 say('你择【'+({H:'人道 · 丹力引桥',D:'地道 · 万宝铺路',T:'天道 · 紫霄印证'})[path]+'】，危坐不动，轰开大门——','p');
 if(path==='T'||(path==='D'&&D100()<50)){
  let hits=2+Math.min(2,Math.floor(p.rIdx/3));
  if(p.karma>=10){hits++;say('<span class="lg-r">业力沸腾，苍穹色变——这一劫比寻常更狠。</span>');}
  if(p.merit>=10){hits--;say('<span class="lg-g">微光垂落，功德护你一线（减一道雷）。</span>');}
  G.tb={bonus:path,base:base,hitsLeft:Math.max(1,hits),round:0};
  triRender();return;
 }
 finishBig(path,base,2);
}

/* ===================== 自由行动 ===================== */
function freeInput(txt){
 txt=(txt||'').trim();if(!txt)return;
 if(!G)return;
 if(G.cb){toast('战斗之中，容不得旁骛');return;}
 const p=G.c;
 const npcHit=NPCS.find(n=>txt.includes(n.n));
 if(/闭关/.test(txt)){closedDoors();return;}
 if(/修炼|打坐|运功|吐纳/.test(txt)){doCult();return;}
 if(/历练|游历|探险|闯荡|下山|出门|秘境/.test(txt)){
  if(isDangerHere()&&!confirm('警告：此地危险等级高于你的修为。\n\n修仙界没有主角光环，真的会死。\n\n确认仍要去？'))return;
  explore();return;
 }
 if(/抢劫|杀人夺宝|灭口|偷袭|黑吃黑/.test(txt)){
  if(confirm('此为恶行：业力+10；失手反遭缠斗。当真要做？')){
   p.karma+=10;
   if(D100()>50+p.att[3]){moneyGet(p,50+p.rIdx*40);say('月黑风高，一桩无头的买卖成了。你告诫自己：仅此一次。<b class="lg-r">（业力+10）</b>');}
   else{say('失手了！对方咬住不放——');startCombat(mkEnemy(p.rIdx+1,1.1,false));return;}
   afterAction();return;
  }
  render();return;
 }
 const reg={'南疆':1,'西漠':2,'北原':3,'中州':4,'东洲':0,'青岳':0,'赤炎':1,'流沙':2,'寒渊':3,'天阙':4};
 for(const k in reg){if(txt.includes(k)){doTravel(reg[k]);return;}}
 if(/坊市|买|购物|淘货/.test(txt)){p.view='mkt';say('你去天机坊市转了一圈。','s');render();return;}
 if(/地图/.test(txt)){p.view='map';render();return;}
 if(/背包|物品|丹药/.test(txt)){p.view='bag';render();return;}
 if(npcHit){p.view='soc';say('你想起了'+npcHit.n+'。','p');render();return;}
 if(/拜师|入门|宗门/.test(txt)){p.view='sect';render();return;}
 if(/悟道|参悟/.test(txt)){p.view='wu';render();return;}
 if(/隐居|种菜|躺平|摆烂/.test(txt)){say('你说到做到，就地支起茶棚晒了半月太阳。日子很好，只是修行搁下。','s');afterAction();return;}
 const r=D100();
 if(r<=40){addCult(p,needOf(p)*0.03);say('依你所想行事：「'+esc(txt)+'」。虽是小事，心中一畅，境界微有所得。');}
 else if(r<=70){p.wu++;say('你做了件不寻常的事——「'+esc(txt)+'」——事后回味，竟有所悟。（悟道点+1）','g');}
 else{moneyGet(p,8);say('按你说的做了，糊里糊涂还有几块灵石进账。','y');}
 afterAction();
}

 if(p.rIdx+1<REGIONS[to].rec&&!confirm('警告：【'+REGIONS[to].n+'】推荐 '+REGNAME[REGIONS[to].rec]+'。\n你身为 '+RL[p.rIdx].n+' 修士贸然而往，遭欺压乃至身死都是常态。\n\n仍要启程？'))return;
 p.region=to;say('动身前往【'+REGIONS[to].n+'】……一路风尘，抵达时正是'+season()+'。');

document.addEventListener('click',function(e){
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 /* 标题/死亡页：只允许新局与读档 */
 if(!G&&!C){if(a==='newgame'){C=newChar();DEAD=false;renderCreate(1);}else if(a==='load'){if(!load())alert('没有找到有效存档');}return;}
 /* 创角阶段（C 存在且尚未开局） */
 if(C&&!G){
  switch(a){
   case 'sex':C.sex=v;if(v!=='自')C.customSex='';renderCreate(C._step);return;
   case 'po':C.origin=+v;renderCreate(1);return;
   case 'pp':C.path=+v;renderCreate(1);return;
   case 'pr':

    C.root=+v;C.eles=[];renderCreate(2);return;
   case 'pc':
    if(CONS[+v].n==='混沌体'&&D100()>85){alert('传说品质岂是人人可得（需骰出大于85的机缘）——混沌之气悄然退散。');return;}
    C.con=+v;renderCreate(2);return;
   case 'pe':{
    const k=v,maxN=C.root===0?1:C.root===1?2:C.root===2?3:5;
    if(C.eles.includes(k))C.eles=C.eles.filter(x=>x!==k);
    else if(C.eles.length<maxN)C.eles.push(k);else C.eles[maxN-1]=k;
    renderCreate(2);return;}
   case 'pt':{
    const td=TALENTS.find(x=>x.n===v);
    let spent=C.talents.reduce((s,x)=>{const t=TALENTS.find(y=>y.n===x);return s+t.c;},0);
    if(C.talents.includes(v))C.talents=C.talents.filter(x=>x!==v);
    else{if(td.c>0&&spent+td.c>5){toast('天赋点不足');return;}C.talents.push(v);}
    renderCreate(2);return;}
   case 'incA':{const i=+v,used=C.alloc.reduce((x,y)=>x+y,0);if(C.alloc[i]<15&&used<60)C.alloc[i]++;renderCreate(2);return;}
   case 'decA':{const i=+v;if(C.alloc[i]>1)C.alloc[i]--;renderCreate(2);return;}
   case 'crnext1':{
    const cn=$('#cn');if(cn&&cn.value.trim())C.name=cn.value.trim();

    if(C.origin<0||C.path<0)return;
    renderCreate(2);return;}
   case 'crback':renderCreate(1);return;
   case 'crdone':finishCreate();return;
  }
  return;
 }
 if(!G)return;
 const p=G.c;
 switch(a){

  case 'vmap':p.view='map';render();break;
  case 'vmkt':p.view='mkt';render();break;

  case 'rest':heal(p,'hp',Math.floor(p.hpM*0.25));heal(p,'mp',Math.floor(p.mpM*0.3));

   say('焚香沐浴，静养一月，气血归盈。','g');afterAction();break;
  case 'travel':doTravel(+v);break;

   if(aw.startsWith('天眼通'))p.att[2]=CL(p.att[2]+3,1,20);
   if(aw.startsWith('心如磐'))p.att[4]=CL(p.att[4]+3,1,20);
   if(aw.startsWith('万里神行'))p.att[3]=CL(p.att[3]+3,1,20);
   if(aw.startsWith('肉身成圣')){p.hpM=Math.floor(p.hpM*1.25);p.hp=p.hpM;}
   if(aw.startsWith('大道之体'))for(let i=0;i<6;i++)p.att[i]=CL(p.att[i]+1,1,20);
   say('<b style="color:#7a5fa8">【逆天改命 · '+aw.split('（')[0]+'】烙入神魂！</b>');
   G.pick=null;checkAuto();break;}
  case 'cbA':cbFight('atk');break;
  case 'cbQ':cbFight('chg');break;
  case 'cbD':cbFight('def');break;
  case 'cbR':cbFight('flee');break;
  case 'cbT':cbFight('talk');break;
  case 'cbU':cbUse(+v);break;
  case 'cbS':cbSurrender();break;
 }
});
/* 自由输入框：回车提交（无表单，绝不触发页面导航） */
document.addEventListener('keydown',function(e){
 const t=e.target;
 if(t&&t.id==='fcmd'&&e.key==='Enter'){
  e.preventDefault();
  const val=t.value;t.value='';
  freeInput(val);
 }
});
function toast(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#3F3A34;color:#FBF8F1;padding:6px 16px;border-radius:6px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}
function finishCreate(){
 const left=60-C.alloc.reduce((x,y)=>x+y,0);
 if(left!==0){alert('还有 '+left+' 点属性未分配');return;}
 const p=buildPlayer();
 DEAD=false;G={c:p};G.log=[];
 G.log.push(
  '<span class="lg-n">灵气潮汐前的第三十九个春天，青岳山道上人来人往。</span>',
  '<span class="lg-n"><b>你叫'+p.name+'，'+p.sex+'，'+p.age+'岁——如今更是「'+p.dao+'」。</b></span>',
  '<span class="lg-n">仙姿'+p.zi+'，'+p.rootType+'（'+(p.eles.join('')||'未显')+'），携《'+p.gongfa.n+'》入道，怀揣'+p.stones+'块灵石。</span>',
  '<span class="lg-n">'+(p.path==='守护所爱'?'你心底压着一个名字和一句没说出口的承诺。':'灵气复苏的前夜，人人都在赌一个未来。')+'</span>');
 save();render();
}
render();
</script>

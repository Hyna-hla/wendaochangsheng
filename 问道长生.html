.opt.sel{border-color:var(--gold);background:#fdf6e3;box-shadow:0 0 0 1px var(--gold) inset}

.steer{position:sticky;top:8px}

input[type=range]{width:100%}
.step{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--jade);background:#fff;font-weight:bold;cursor:pointer;color:var(--jade)}

.footer-cmd{color:var(--sub);font-size:12px;text-align:center;margin-top:8px}

.deed::before{content:'';position:absolute;left:-4.5px;top:10px;width:7px;height:7px;border-radius:50%;background:#fffdf7;border:1.5px solid #9a917e}
.deed-y{color:var(--sub);display:inline-block;min-width:88px}

/* ===================== 数值公式 ===================== */
function mindCoef(p){const req=4+p.rIdx*2;return p.att[4]>=req+4?1.2:(p.att[4]>=req?1.0:0.55);}
function qiCoef(p){return [1,1.35,1.6,1.9][p.cave.lv];}
function cultGain(p,closed){
 let v=RL[p.rIdx].base*(1+p.att[0]*0.05)*p.rootC*p.rootC*GF[p.gongfa.g].c*qiCoef(p)*mindCoef(p);
 if(p.con==='先天道体')v*=1.5;
 if(p.awaken.some(a=>a.startsWith('聚灵')))v*=1.15;
 if(closed)v*=2*(p.cave.jingShi?1.1:1);
 if(p.abn.includes('心魔缠身'))v*=0.5;
 if(p.abn.includes('内伤'))v*=0.5;
 if(p.tideOn)v*=1.25;
 if(p.m===1)v*=1.25;
 if(p.m===12)v*=1.15;
 return v;}
function needOf(p){return RL[p.rIdx].need;}
function addCult(p,v){if(p)p.cult=CL(p.cult+v,0,9999);}
function heal(p,k,v){const mul=danMul(p);if(k==='hp')p.hp=CL(p.hp+v*mul,0,p.hpM);else p.mp=CL(p.mp+v*mul,0,p.mpM);}
function danMul(p){return 1+p.wuT[1]*0.15+(p.awaken.some(a=>a.startsWith('丹药'))?0.3:0);}
function sprB(it){const s=it&&it.spr;return s?(SPR_B[s.lv]+(s.pact?0.15:0)):0;}
function equipB(p,slot){const it=p.equip&&p.equip[slot];if(!it||it.dur<=0)return 0;return it.b*(1+(p.wuT[5]||0)*0.08)*(1+sprB(it));}
function power(p){return [26,54,96,168,290,470,760,1200,1900,3100][p.rIdx]*(0.92+p.stg*0.09)*(1+p.wuT[0]*0.06)*(p.awaken.some(a=>a.startsWith('剑心'))?1.2:1)*(1+equipB(p,'w'));}
function guardVal(p){return p.rIdx*8+p.stg*3+equipB(p,'a');}
function applyAwakenEffect(p,aw){
 if(aw.startsWith('气运如虹'))p.att[5]=CL(p.att[5]+2,1,20);
 if(aw.startsWith('天眼通'))p.att[2]=CL(p.att[2]+3,1,20);
 if(aw.startsWith('心如磐'))p.att[4]=CL(p.att[4]+3,1,20);
 if(aw.startsWith('万里神行'))p.att[3]=CL(p.att[3]+3,1,20);
 if(aw.startsWith('肉身成圣')){p.hpM=Math.floor(p.hpM*1.25);p.hp=p.hpM;}
 if(aw.startsWith('大道之体'))for(let i=0;i<6;i++)p.att[i]=CL(p.att[i]+1,1,20);
}

function craftPill(i){
 const p=G.c,r=ALCH[i];if(!r)return;
 if(!Object.keys(r.need).every(k=>cntHerb(k)>=r.need[k])){toast('药材不足');render();return;}
 Object.keys(r.need).forEach(k=>useHerb(k,r.need[k]));
 if(!monthAct())return;
 if(D100()<=alchRate(p)){
  const yn=1+(D100()<8?1:0);
  addItem(r.n,yn);
  say('<b class="lg-g">丹成！炉盖掀开，异香扑鼻——得【'+r.n+'】×'+yn+(yn>1?'（天成双丹！）':'')+'。</b>','g');
 }else{
  const dmg=Math.max(3,Math.floor(p.hpM*0.08));
  p.hp=Math.max(1,p.hp-dmg);
  say('<b class="lg-r">炸炉！</b>火光冲天，草药化作飞灰，你被气浪掀翻在地（气血-'+dmg+'）。','r');
 }
 checkAuto();
}

/* ===================== 炼器 ===================== */
function pickOre(d){
 const arr=[[{n:'玄铁',v:16},{n:'赤铜',v:12}],
            [{n:'精铁',v:35},{n:'火云砂',v:42}],
            [{n:'寒玉髓',v:95},{n:'星辰砂',v:110}],
            [{n:'天蚕丝',v:210},{n:'雷罡铁',v:240}],
            [{n:'太阴精',v:480},{n:'天外陨金',v:520}]][CL(d,0,4)];
 return Object.assign({},arr[RI(arr.length)]);
}
function addOre(o){rd().ores.push(Object.assign({},o));}
function cntOre(n){return rd().ores.filter(o=>o.n===n).length;}
function useOre(n,k){const p=rd();for(let i=0;i<k;i++){const idx=p.ores.findIndex(o=>o.n===n);if(idx<0)return false;p.ores.splice(idx,1);}return true;}
function forgeRate(p){return Math.round(CL(50+p.wuT[5]*8,25,95));}
function eqTradeIn(it){return Math.floor(it.durM*(EQ_UNIT[it.g]||3)/2);}
function forgeHTML(){
 const p=G.c;
 let rows=FORGE.map((r,i)=>{
  const ing=Object.keys(r.need).map(k=>'<span class="echip" style="background:#8C8578">'+k+'</span>×'+r.need[k]+'（有'+cntOre(k)+'）').join(' ');
  const ok=Object.keys(r.need).every(k=>cntOre(k)>=r.need[k]);
  const slotN=r.slot==='w'?'法剑':'护镜';
  return '<div class="row" style="justify-content:space-between"><span><b>'+r.n+'</b> <small>'+r.g+'阶'+slotN+' · '+r.d+' · 耐久'+r.dur+'</small><br><small>'+ing+'</small></span>'+
  btn('forgeIt','开炉锻器','gold','',!ok,i)+'</div>';}).join('');
 let eq='';
 ['w','a'].forEach(s=>{
  const it=p.equip[s];if(!it)return;
  const miss=it.durM-it.dur;
  const cost=Math.ceil(miss*(EQ_UNIT[it.g]||3));
  eq+='<div class="row" style="justify-content:space-between"><span><b>'+it.n+'</b> <small>'+it.g+'阶 · 耐久 '+it.dur+'/'+it.durM+'</small></span>'+
   (miss>0?btn('repair','回炉修复（'+cost+'石）','bam','',p.stones<cost,s):'<span style="color:var(--sub);font-size:12px">完好</span>')+'</div>';
  if(it.spr){
   const sp=it.spr,full=sp.lv>=3;
   const ncost=80*(sp.lv+1);
   let feed='';
   const seen={};
   (p.ores||[]).forEach((o,oi)=>{if(seen[o.n]===undefined){seen[o.n]=oi;
    feed+='<span style="cursor:pointer;font-size:12px;border:1px solid #C9BFA8;border-radius:8px;padding:1px 7px;margin:0 2px" data-a="feedSpr" data-v="'+s+'_'+oi+'">'+o.n+'×'+cntOre(o.n)+'</span>';}});
   eq+='<div style="margin:1px 0 6px 12px;font-size:13px;line-height:1.9">'+
    '<span style="color:#7a89b8">◈ 器灵「'+sp.n+'」'+(sp.lv>=3?'（'+(sp.pact?'结契':'纵其天涯')+'）':'')+'</span> '+SPR_LV[sp.lv]+' Lv.'+(sp.lv+1)+' · 器效+'+Math.round(sprB(it)*100)+'%'+
    (full?'':' · 历练 '+sp.exp+'/'+SPR_NEED[sp.lv])+
    (sp.lv>=2?' · 自养（耐久损耗减半）':'')+
    (sp.lv>=1&&s==='w'?' · 协战':'')+(sp.lv>=1&&s==='a'?' · 护主':'')+'<br>'+
    (full?'<span style="color:var(--sub)">化形圆满，此灵已至器道尽头。</span>':
     btn('nurture','温养（'+ncost+'石 · 历练+6）','jade','',p.stones<ncost,s)+(feed?'<span style="color:var(--sub)"> 喂矿：</span>'+feed+'<span style="color:var(--sub);font-size:12px">（矿愈珍，灵愈进）</span>':'<span style="color:var(--sub);font-size:12px"> 无矿可喂</span>'))+
    '</div>';
  }else{
   eq+='<div style="margin:1px 0 6px 12px;font-size:12px;color:var(--sub)">◇ 灵蕴 '+(it.sw||0)+'/30 —— 久历战斗，器将生灵</div>';
  }});
 return panel('gold','器炉 · 以矿入炉',
  '<div style="font-size:13px;color:var(--sub)">丹房隔壁，你另起了一座器炉。成功率 <b>'+forgeRate(p)+'%</b>（器道 Lv.'+p.wuT[5]+'）；炉毁则矿料尽失、烈焰灼身。法剑增战力，护镜增守御；逢战斗皆有磨损，耐久尽则器效全失，须回炉修复。</div><div class="hr"></div>'+
  (eq?'<div style="font-weight:bold;margin-bottom:4px">随身之器</div>'+eq+'<div class="hr"></div>':'')+
  '<div style="font-weight:bold;margin-bottom:4px">可锻之器</div>'+rows+
  '<div class="footer-cmd">锻器/修复/温养各耗一月 · 矿料采于历练、秘境，胜敌亦有所获 · 旧器换代可折价回炉 · 器历战阵生灵，灵可温养、可喂矿、可化形</div>');
}
function craftEq(i){
 const p=G.c,r=FORGE[i];if(!r)return;
 if(!Object.keys(r.need).every(k=>cntOre(k)>=r.need[k])){toast('矿料不足');render();return;}
 Object.keys(r.need).forEach(k=>useOre(k,r.need[k]));
 if(!monthAct())return;
 if(D100()<=forgeRate(p)){
  const fine=D100()<10;
  const it={n:r.n+(fine?'·上品':''),slot:r.slot,g:r.g,b:Math.round(r.b*(fine?1.35:1)*100)/100,dur:Math.floor(r.dur*(fine?1.3:1)),durM:Math.floor(r.dur*(fine?1.3:1))};
  dexRec('eq',r.n);
  if(fine&&D100()<30){it.spr=genSpirit(r.slot);it.sw=0;}
  const old=p.equip[r.slot];
  p.equip[r.slot]=it;
  say('<b class="lg-g">雷音滚滚，器成！</b>得'+r.g+'阶'+(r.slot==='w'?'法剑':'护镜')+'【'+it.n+'】'+(fine?'——出炉便有异象，竟是<b>上品</b>！':'')+'。','g');
  if(it.spr)say('<b class="lg-y">器身清鸣不止——器胚有灵，「'+it.spr.n+'」已随新器苏醒！</b>','y');
  if(old){
   const back=eqTradeIn(old);moneyGet(p,back);say('旧器【'+old.n+'】回炉折价。','s');
   if(old.spr){
    const os=old.spr;
    G.ev={theme:'bam',title:'旧器之灵 · '+os.n,
     body:'新器已成，旧器【'+old.n+'】灵光渐黯。器灵「'+os.n+'」浮出器身，静静望着你与新器——'+(os.lv>=3?'已化人形的'+(r.slot==='w'?'她':'他')+'眉目沉静':'那缕灵光微微颤动，似在等候')+'。何去何从？',
     opts:[
      {t:'引灵入新',d:'「'+os.n+'」迁入【'+it.n+'】 · 道行保留',fx:()=>{it.spr=os;os.pact=os.pact||0;
       say('你以本命真火引灵——「'+os.n+'」绕新器三匝，光华敛入其身。旧友重逢新器，此器自此有灵。','g');checkAuto();}},
      {t:'送别归山',d:'功德+3 · 器灵化光而去',fx:()=>{p.merit+=3;
       say('你朝旧器深深一揖：「同修多年，就此别过。」「'+os.n+'」化作一道流光，没入山岚深处——善缘一场，不虚此行（功德+3）。','g');checkAuto();}}]};
    render();return;
   }
  }
 }else{
  const dmg=Math.max(3,Math.floor(p.hpM*0.08));
  p.hp=Math.max(1,p.hp-dmg);
  say('<b class="lg-r">锻炉炸裂！</b>器胚在最后一淬时崩碎，矿料尽毁，烈焰燎伤了你的眉发（气血-'+dmg+'）。','r');
 }
 checkAuto();
}
function repairEq(slot){
 const p=G.c,it=p.equip&&p.equip[slot];if(!it)return;
 const miss=it.durM-it.dur;if(miss<=0){toast('完好无损');render();return;}
 const cost=Math.ceil(miss*(EQ_UNIT[it.g]||3));
 if(p.stones<cost){toast('灵石不足');render();return;}
 p.stones-=cost;it.dur=it.durM;
 if(!monthAct())return;
 say('匠火重燃，你以真火细细回淬——【'+it.n+'】灵光复盈（-'+cost+'石）。','g');
 checkAuto();
}
function sellOre(i){
 const p=G.c,o=p.ores[i];if(!o)return;
 p.ores.splice(i,1);moneyGet(p,o.v);
 render();
}
function wearEq(p,slot,n){
 const it=p.equip&&p.equip[slot];if(!it||it.dur<=0)return;
 if(it.spr){
  addSprExp(p,it,n);
  if(it.spr.lv>=2&&Math.random()<0.5)return;
 }else{
  it.sw=(it.sw||0)+n;
  if(it.sw>=30){
   it.sw=0;it.spr=genSpirit(it.slot);
   say('<b class="lg-y">器身嗡鸣，一缕灵光自纹路间浮起——【'+it.n+'】竟孕出了器灵「'+it.spr.n+'」！</b>自此人器相修，百炼成灵（器效+15%）。','y');
  }
 }
 it.dur-=n;if(it.dur<0)it.dur=0;
 if(it.dur===0)say('<b class="lg-r">【'+it.n+'】灵光溃散，迸作齑粉——需回炉修复方能再用。</b>','r');
}
/* ---------- 器灵 ---------- */
function genSpirit(slot,lv){
 const s={n:(slot==='w'?SPR_W[RI(SPR_W.length)]:SPR_A[RI(SPR_A.length)]),lv:lv||0,exp:0};
 return s;
}
function addSprExp(p,it,v){
 const s=it.spr;if(!s||s.lv>=3)return;
 s.exp+=v;
 while(s.lv<3&&s.exp>=SPR_NEED[s.lv]){
  s.exp-=SPR_NEED[s.lv];s.lv++;
  say('<b class="lg-g">器灵「'+s.n+'」道行精进——'+SPR_LV[s.lv]+'（Lv.'+(s.lv+1)+'）！</b>器效加成升至 +'+Math.round(SPR_B[s.lv]*100)+'%'+(s.lv===2?'，且能自养其身（耐久损耗减半）':s.lv===3?'，隐有化形之兆':'')+'。','g');
 }
}
function sprAwakeCheck(){
 const p=G.c;if(!p||G.ev||G.cb)return;
 ['w','a'].forEach(sl=>{
  const it=p.equip&&p.equip[sl];if(!it||!it.spr)return;
  const s=it.spr;
  if(s.lv>=3&&!s.awake){
   s.awake=1;
   G.ev={theme:'bam',title:'器灵化形 · '+s.n,
    body:'是夜子时，你正打坐入定，腰间忽起清鸣——【'+it.n+'】悬空而起，灵光大盛！一道身影自器身步出：眉目清绝，衣袂如烟，正是器灵「'+s.n+'」。'+(sl==='w'?'她':'他')+'敛衽一礼：「承主人温养，今夜得化人形。从此何往，唯主人一言。」',
    opts:[
     {t:'结契同修',d:'器效再+15% · 生死不弃',fx:()=>{s.pact=1;p.merit+=2;markDeed('与器灵「'+s.n+'」结契');
      say('你以指血在器身画下一道契印：「你我同修，生死不弃。」「'+s.n+'」眼中有光流转，躬身应诺——自此人器一契，器效再+15%（功德+2）。','g');afterAction();}},
     {t:'纵其天涯',d:'功德+3 · 协战愈勇',fx:()=>{s.free=1;p.merit+=3;
      say('你收起契印，只道：「天地广阔，你自去罢。」「'+s.n+'」怔了怔，忽而一笑，化光归器——此后协战，'+(sl==='w'?'剑光更烈':'镜华更盛')+'（功德+3）。','g');afterAction();}}]};
   render();
  }
 });
}
function nurtureSpirit(slot){
 const p=G.c,it=p.equip&&p.equip[slot];
 if(!it||!it.spr){toast('此器尚无器灵');render();return;}
 const s=it.spr;if(s.lv>=3){toast('器灵已臻化形圆满');render();return;}
 const cost=80*(s.lv+1);
 if(p.stones<cost){toast('灵石不足');render();return;}
 p.stones-=cost;
 if(!monthAct())return;
 addSprExp(p,it,6);
 say('你捧【'+it.n+'】于掌心，以灵力细细温养——器灵「'+s.n+'」在灵光中舒展身形，惬意非常（-'+cost+'石）。','s');
 checkAuto();
}
function feedSpirit(v){
 const pr=(v||'').split('_'),slot=pr[0],oi=+pr[1];
 const p=G.c,it=p.equip&&p.equip[slot],o=p.ores&&p.ores[oi];
 if(!it||!it.spr||!o){toast('无法喂养');render();return;}
 const s=it.spr;if(s.lv>=3){toast('器灵已臻化形圆满');render();return;}
 p.ores.splice(oi,1);
 if(!monthAct())return;
 let ex=Math.max(2,Math.floor(o.v/10));
 if(o.v>=200){ex+=10;say('器灵「'+s.n+'」嗅到【'+o.n+'】的气息，眼睛都直了——一口吞下，周身灵光大放！','y');}
 addSprExp(p,it,ex);
 say('你将【'+o.n+'】投入器身，器灵「'+s.n+'」如获至宝，缓缓炼化（器灵历练+'+ex+'）。','s');
 checkAuto();
}

}
function mrAct(kind){
 const p=G.c,m=G.mr;if(!m)return;
 if(kind==='leave'){
  const n=m.n;G.mr=null;
  say('你收拢所得，循来路退出秘境——【'+n+'】在身后缓缓闭合。','g');
  checkAuto();render();return;
 }
 if(kind==='search')mrLoot(m.lv,m.lvM);
 if(!monthAct())return;
 if(m.guard||D100()<(kind==='search'?30:15)){
  const e=mkEnemy(p.rIdx+(fin(m)?1:(m.lv>=3?1:0)),fin(m)?1.3:1.0,true);
  e.n=fin(m)?('秘境之主·'+['青璧真人','坠星魔君','万妖王','幽冥鬼帝','浮空殿主','沉沙王'][RI(6)]):('守层'+['石傀','妖将','剑灵','阴将'][RI(4)]);
  e.tag='mr';e.mrFin=fin(m)?1:0;
  say(fin(m)?'<span class="danger">大地震颤——秘境之主睁开了眼睛！</span>':'<span class="danger">守层之主自暗处扑出，拦住去路！</span>');
  startCombat(e);return;
 }
 mrAdvance();
}
function fin(m){return m&&m.lv===m.lvM;}
function mrAdvance(){
 const m=G.mr;if(!m)return;
 if(m.lv>=m.lvM){mrFinish();return;}
 m.lv++;m.guard=D100()<30;
 say('你穿廊而过，深入第'+m.lv+'层……','s');
 render();
}
function mrFinish(){
 const p=G.c,m=G.mr;G.mr=null;
 moneyGet(p,Math.floor((80+m.d*60)*(1+p.rIdx*0.9)*(p.tideOn?1.5:1)));
 p.rep+=6;
 say('<b class="lg-g">你竟安然走完了【'+m.n+'】全程——最深处的灵脉精华尽入你手！</b>（声望+6）','g');
 checkAuto();render();
}
function mrLoot(lv,lvM){
 const p=G.c,d=G.mr?G.mr.d:REGIONS[p.region].e;
 const depth=CL(d+Math.floor((lv-1)/2),0,4);
 const x=D100();
 if(x<=32){const v=Math.floor((30+d*50)*(1+p.rIdx*0.5)*(0.7+Math.random()*0.6)*(p.tideOn?1.5:1)*(1+lv*0.25));moneyGet(p,v);}
 else if(x<=60){const o=pickOre(depth);addOre(o);say('石龛之中封着一块【'+o.n+'】。','g');}
 else if(x<=80){const h=pickHerb(Math.min(4,depth+(p.tideOn?1:0)));addHerb(h);say('残存灵田之上，采得【'+h.n+'】。','g');}
 else if(x<=88){addItem(['火鳞符','玄龟符','遁地符'][RI(3)],1);say('供桌上遗有符箓一张，灵光未散。','g');}
 else if(x<=94){p.wu++;say('壁上残刻道纹，你驻足参悟（悟道点+1）。','g');}
 else say('翻遍此层，只余断壁残垣与前任探索者的枯骨。','s');
}

function enemyStrike(){
 const c=G.cb,p=G.c,e=c.e;
 let ed=e.pw*0.30*(0.85+Math.random()*0.3)-guardVal(p)*1.2;
 if(c.calm){ed*=0.7;c.calm=false;}
 if(c.guard)ed*=0.5;
 if(c.shield){ed*=0.25;c.shield=false;}
 c.guard=false;
 const sa=p.equip.a;
 if(sa&&sa.spr&&sa.dur>0&&sa.spr.lv>=1&&D100()<5+sa.spr.lv*8){
  ed=Math.max(1,Math.floor(ed*0.4));
  cbl('<span style="color:#7a89b8">器灵「'+sa.spr.n+'」镜光一闪，替你挡下大半攻势！</span>');
 }
 ed=Math.max(1,Math.floor(ed));
 p.hp-=ed;
 wearEq(p,'a',1);
 cbl('<span style="color:#B23F33">'+e.n+' 还以颜色，你受创 '+ed+'。</span>');
 return p.hp<=0;
}

 p.m++;if(p.m>12){p.m=1;p.y++;p.age++;
  if(p.sect){const pay=p.rank*40+40;p.stones+=pay;say('年俸发放，+'+pay+' 石。','y');}
  if(p.guoshi){p.stones+=150;say('国师岁俸发放，+150 石。','y');}
  if(!p.tideOn&&p.y>=p.tideY){p.tideOn=1;
   say('<b class="lg-r">【灵气潮汐】天穹深处闷雷般的轰鸣连响九日——九州灵脉尽数沸腾！</b>秘境洞开、妖物暴动、域外天魔循隙而至。此后修炼事半功倍，而天地，也凶险了十倍。','r');}
  else if(p.tideOn&&p.y===p.tideY+12)say('<span class="lg-s">潮头渐平，域外天魔退散。灵气仍丰于旧日——修士们称此后为「新纪元」。</span>','s');
  if(p.nextGala&&p.y>=p.nextGala){p.nextGala=p.y+24+RI(13);p.galaDue=1;}
 }
 const yl=YL[p.m-1];
 if(yl.fx)say('<span class="lg-s">【月令·'+yl.n+'】'+yl.d+'。</span>');
 p.hp=CL(p.hp+3,0,p.hpM);p.mp=CL(p.mp+4,0,p.mpM);
 const rem=RL[p.rIdx].life+(p.lifeBonus||0)-p.age;
 if(rem<=0){
  if(tryShouhu())return false;
  say('炉火渐熄，你在蒲团上含笑阖眼。');die('坐化');return false;
 }
 if(rem===3)say('<span class="lg-r">【岁影】鬓边忽现一根白发——距大限只剩三年。</span>');
 if(rem===1)say('<span class="lg-r">【岁影】烛火摇曳，你听见岁月在骨头里赶路的声音。</span>');

 try{sSet('wdcs_dex',JSON.stringify(d));}catch(e){}

function closedDoors(){
 const inp=prompt('闭关多少个月？（1~240 · 双倍速率 · 大事会惊醒你）','12');
 if(inp===null)return;
 const mo=CL(parseInt(inp)||0,1,240);if(!mo)return;
 const p=G.c,startY=p.y,startM=p.m,sc=p.cult;
 for(let i=0;i<mo;i++){
  addCult(p,cultGain(p,true)*(p.m===6?1.25:1));
  p.hp=CL(p.hp+4,0,p.hpM);p.mp=CL(p.mp+5,0,p.mpM);
  if(!monthTick(p))return;
  if((p.y*12+p.m)%12===0)p.wu=Math.min(99,p.wu+1);
  if(D100()<=4){p.att[4]=Math.max(1,p.att[4]-1);say('心魔忽至：旧日懊悔立于识海。你咬牙镇压，一夜无眠。（道心-1）','p');break;}
  if(p.cult>=needOf(p)){say('水到渠成——关中自查，气息已圆满。适时破关而出！','y');break;}
 }
 say('<span class="lg-s">闭关 '+((p.y-startY)*12+(p.m-startM))+' 月 · 修为 '+Math.floor(sc)+' → '+Math.floor(p.cult)+'</span>','s');
 checkAuto();
}

function explore(){
 const p=G.c,r=D100(),d=REGIONS[p.region].e,myR=p.rIdx+1;
 const boost=myR<d?(d-myR)*15:0;
 if(tryOriginEvent(false))return;

 pastEcho();
 if(p.tideOn&&p.y<p.tideY+12&&D100()<=13){
  say('<span class="danger">天穹裂开一线暗紫——域外天魔嗅到了血肉气息！</span>');
  const e=mkEnemy(p.rIdx+1,1.25,true);e.n='噬灵天魔';e.tag='demon';

 }
 if(!p.beast&&p.rIdx>=1&&D100()<=(p.awaken.some(a=>a.startsWith('灵兽'))?16:8)){beastEvent();return;}

  else{const o=pickOre(d);addOre(o);

  say(myR<d?'<span class="danger">层层威压自四面八方碾下——此地妖邪视你如蝼蚁！</span>':'半路杀出一个不讲武德的！');
  startCombat(e);return;

 }else if(r<=74){

 }else if(r<=80){
  const g=['聚气丹','回春丹'][RI(2)];addItem(g,1);p.merit++;

 }else if(r<=(86+boost)&&boost>0){
  say('<span class="danger">此地本不该你来——杀机已至！</span>');
  startCombat(mkEnemy(p.rIdx+1,1.15,true));return;
 }else if(r<=93){

 }else say('一无所获，倒遇见几户烧炭人家，灯火可亲。','s');
 afterAction();
}

function tryNpcEvent(){
 const p=G.c;if(!G||G.cb||G.ev||G.tb||G.pick)return false;
 for(const id in NPC_CHAINS){
  const af=p.rel[id]||0;
  for(const ch of NPC_CHAINS[id]){
   if(af>=ch.th&&!p.flags[ch.flag]){
    p.flags[ch.flag]=1;
    const n=NPCS.find(x=>x.id===id);
    G.ev={theme:ch.theme,title:ch.title+' · '+n.n,
     body:ch.body,opts:ch.opts.map(o=>({t:o.t,d:o.d,fx:()=>{o.fx(p);}}))};
    render();return true;
   }
  }
 }
 return false;
}
function evHTML(){
 const ev=G.ev;
 return panel(ev.theme||'vio',ev.title,
  '<div style="line-height:1.9">'+ev.body+'</div><div class="hr"></div>'+
  ev.opts.map((o,i)=>'<div class="opt" data-a="evk" data-v="'+i+'"><b>'+o.t+'</b>'+(o.d?' <small>'+o.d+'</small>':'')+'</div>').join(''));
}

function btSmall(){
 const p=G.c;if(p.cult<needOf(p))return;
 const rate=CL(62+p.att[4]*2.4+(p.m===10?8:0),50,95);
 if(!monthAct())return;
 if(D100()<=rate){
  p.stg++;p.cult=0;p.hpM+=6;p.mpM+=6;p.hp=p.hpM;p.mp=p.mpM;
  say('<b class="lg-g">瓶颈应声而碎！晋升 '+RL[p.rIdx].n+' · '+STG[p.stg]+'，气血灵力上限各增。</b>','g');

function btBig(path){
 const p=G.c;if(p.cult<needOf(p)||p.stg<3)return;
 if(path==='H'){
  if(cntBag('人道破境丹')<1){
   if(confirm('手中无人间破境丹。以 '+RDprice()+' 灵石向坊市急购一枚？')){

    p.stones-=RDprice();addItem('人道破境丹',1);
   }else return;
  }
  removeItem('人道破境丹',1);
 }else if(path==='D'){
  if(cntBag('天材地宝')<2){say('需天材地宝两枚，尚缺 '+(2-cntBag('天材地宝'))+' 枚。','r');render();return;}
  removeItem('天材地宝',2);
 }else{

  removeItem('天材地宝',1);removeItem('五行灵珠',1);
 }
 if(!monthAct())return;
 let base=path==='H'?88:path==='D'?72:52;
 base-=p.rIdx*4;base+=Math.floor((p.att[4]-10)*1.5);
 if(p.abn.includes('心魔缠身'))base-=25;
 base=CL(base,15,95);
 say('你择【'+({H:'人道 · 丹力引桥',D:'地道 · 万宝铺路',T:'天道 · 紫霄印证'})[path]+'】，危坐不动，轰开大门——','p');
 if(path==='T'||(path==='D'&&D100()<50)){
  let hits=2+Math.min(2,Math.floor(p.rIdx/3));
  if(p.karma>=10){hits++;say('<span class="lg-r">业力沸腾，苍穹色变——这一劫比寻常更狠。</span>');}
  if(p.merit>=10){hits--;say('<span class="lg-g">微光垂落，功德护你一线（减一道雷）。</span>');}
  hits=Math.max(1,hits);
  if(path==='T'&&!p.flags.hdDone&&(p.abn.includes('心魔缠身')||D100()<45)){
   p.flags.hdDone=1;
   G.hdPend={bonus:path,base:base,hits:hits};
   heartDemonTrial();
   return;
  }
  G.tb={bonus:path,base:base,hitsLeft:hits,round:0};
  triRender();return;
 }
 finishBig(path,base,2);
}

function freeInput(txt){
 txt=(txt||'').trim();if(!txt)return;
 if(!G)return;
 if(G.cb){toast('战斗之中，容不得旁骛');return;}
 const p=G.c;
 const npcHit=NPCS.find(n=>txt.includes(n.n));
 if(/闭关/.test(txt)){closedDoors();return;}
 if(/修炼|打坐|运功|吐纳/.test(txt)){doCult();return;}
 if(/历练|游历|探险|闯荡|下山|出门|秘境/.test(txt)){
  if(isDangerHere()&&!confirm('警告：此地危险等级高于你的修为。\n\n修仙界没有主角光环，真的会死。\n\n确认仍要去？'))return;
  explore();return;
 }
 if(/抢劫|杀人夺宝|灭口|偷袭|黑吃黑/.test(txt)){
  if(confirm('此为恶行：业力+10；失手反遭缠斗。当真要做？')){
   p.karma+=10;
   if(D100()>50+p.att[3]){moneyGet(p,50+p.rIdx*40);say('月黑风高，一桩无头的买卖成了。你告诫自己：仅此一次。<b class="lg-r">（业力+10）</b>');}
   else{say('失手了！对方咬住不放——');startCombat(mkEnemy(p.rIdx+1,1.1,false));return;}
   afterAction();return;
  }
  render();return;
 }
 const reg={'南疆':1,'西漠':2,'北原':3,'中州':4,'东洲':0,'青岳':0,'赤炎':1,'流沙':2,'寒渊':3,'天阙':4};
 for(const k in reg){if(txt.includes(k)){doTravel(reg[k]);return;}}
 if(/坊市|买|购物|淘货/.test(txt)){p.view='mkt';say('你去天机坊市转了一圈。','s');render();return;}
 if(/地图/.test(txt)){p.view='map';render();return;}
 if(/炼丹|炼药|开炉|丹炉/.test(txt)){p.view='alch';say('你走向丹房，捡点灵草药性。','s');render();return;}
 if(/炼器|锻器|锻造|器炉|修剑|修复法器|器灵|温养/.test(txt)){p.view='forge';say('你走向器炉，拨旺了炉火。','s');render();return;}
 if(/国师|朝廷|圣旨|入朝|妖王|血脉/.test(txt)){if(tryOriginEvent(true))return;toast('此刻无缘于此（出身或机缘未至）');return;}
 if(/灵兽|幼兽|喂养|兽栏/.test(txt)){p.view='cave';say('你去看了一眼兽栏。','s');render();return;}
 if(/背包|物品|丹药/.test(txt)){p.view='bag';render();return;}
 if(npcHit){p.view='soc';say('你想起了'+npcHit.n+'。','p');render();return;}
 if(/拜师|入门|宗门/.test(txt)){p.view='sect';render();return;}
 if(/悟道|参悟/.test(txt)){p.view='wu';render();return;}
 if(/隐居|种菜|躺平|摆烂/.test(txt)){say('你说到做到，就地支起茶棚晒了半月太阳。日子很好，只是修行搁下。','s');afterAction();return;}
 const r=D100();
 if(r<=40){addCult(p,needOf(p)*0.03);say('依你所想行事：「'+esc(txt)+'」。虽是小事，心中一畅，境界微有所得。');}
 else if(r<=70){p.wu++;say('你做了件不寻常的事——「'+esc(txt)+'」——事后回味，竟有所悟。（悟道点+1）','g');}
 else{moneyGet(p,8);say('按你说的做了，糊里糊涂还有几块灵石进账。','y');}
 afterAction();
}

function save(){try{if(G&&G.c)sSet('wdcs_save',JSON.stringify({c:G.c}));}catch(e){}}
function loadData(d){
  if(!d||!d.c)return false;
  if(d.c.spouse===undefined){d.c.spouse=NPCS.some(n=>n.id===d.c.dao)?d.c.dao:null;if(d.c.spouse)d.c.dao=('青芜清微玄裳听雪抱朴').match(/.{2}/g)[RI(4)];}
  if(d.c.tideY===undefined)d.c.tideY=387+25+RI(11);
  if(d.c.tideOn===undefined)d.c.tideOn=d.c.y>=d.c.tideY?1:0;
  if(d.c.flags===undefined)d.c.flags={};
  if(d.c.beast===undefined)d.c.beast=null;
  if(d.c.herbs===undefined)d.c.herbs=[];
  if(d.c.ores===undefined)d.c.ores=[];
  if(!d.c.equip)d.c.equip={w:null,a:null};
  if(d.c.nextGala===undefined){d.c.nextGala=d.c.y+6+RI(7);d.c.galaIdx=0;}
  if(d.c.galaDue===undefined)d.c.galaDue=0;
  if(!Array.isArray(d.c.wuT)||d.c.wuT.length<6){const w=Array.isArray(d.c.wuT)?d.c.wuT:[];d.c.wuT=[w[0]||0,w[1]||0,w[2]||0,w[3]||0,w[4]||0,0];}
  if(d.c.guoshi===undefined)d.c.guoshi=0;
  if(d.c.lifeBonus===undefined)d.c.lifeBonus=0;
  DEAD=false;C=null;G={c:d.c};G.log=['<span class="lg-s">（前尘往事涌上心头，接续旧梦。）</span>'];G.c.view='main';
  render();return true;
}
function load(){
 try{return loadData(JSON.parse(sGet('wdcs_save')));}catch(e){return false;}
}

/* ---------- 多存档槽位（至多10个） ---------- */
const SLOT_MAX=10;
function slotKey(i){return 'wdcs_slot_'+i;}
function metaOf(c){return {name:c.name||'',dao:c.dao||'无名',rIdx:c.rIdx||0,stg:c.stg||0,y:c.y||387,age:c.age||0,path:c.path||'',savedAt:Date.now()};}
function slotInfo(i){
 try{const d=JSON.parse(sGet(slotKey(i)));if(!d||!d.c)return null;return d.meta||metaOf(d.c);}catch(e){return null;}
}
function slotSave(i){
 if(!G||!G.c)return false;
 try{sSet(slotKey(i),JSON.stringify({v:1,meta:metaOf(G.c),c:G.c}));return true;}catch(e){return false;}
}
function slotLoad(i){
 try{return loadData(JSON.parse(sGet(slotKey(i))));}catch(e){return false;}
}
function slotDel(i){sDel(slotKey(i));}
function anyArchive(){
 if(sGet('wdcs_save'))return true;
 for(let i=0;i<SLOT_MAX;i++)if(slotInfo(i))return true;
 return false;
}
function metaLine(m){return esc(m.name)+' · '+RL[m.rIdx].n+' '+STG[m.stg]+' · '+m.age+'岁 · 天玄历'+m.y+'年';}
function metaTime(m){
 const t=new Date(m.savedAt);
 const z=n=>(n<10?'0':'')+n;
 return t.getFullYear()+'-'+z(t.getMonth()+1)+'-'+z(t.getDate())+' '+z(t.getHours())+':'+z(t.getMinutes());
}

   '<div class="row" style="margin-top:4px">'+btn('bakGo','进入游戏','blue','','')+' '+btn('bakDel','清除','gray','','')+'</div></div>';
 }
 if(!rows)rows='<div class="center" style="color:var(--sub);padding:12px">卷帙空空——尚无可读之档。</div>';
 return '<h1 class="title">问道长生</h1><div class="sub">档卷 · 择一续缘</div>'+
  panel('gold','档卷',rows)+
  panel('vio','跨设备转移','<div class="center" style="padding:8px"><div class="row" style="justify-content:center">'+
  btn('expSave','导出存档 JSON','blue','','')+' '+btn('impSave','导入存档 JSON','vio','','')+
  '</div><div class="footer-cmd" style="margin-top:4px">导出会打包全部进度、图鉴与史册为 JSON 文件——传到新设备后导入，无缝续玩</div></div>')+
  '<div class="center" style="padding:8px"><button class="btn" data-a="back">'+tag('返　回','gray')+' 回到卷首</button></div>';
}

/* ---------- 导出 / 导入（跨设备转移） ---------- */
function exportSave(){
 try{
  const keys=['wdcs_save','wdcs_backup','wdcs_dex','wdcs_chronicle','wdcs_legacy','wdcs_lastlife'];
  for(let i=0;i<SLOT_MAX;i++)keys.push(slotKey(i));
  const data={};let n=0;
  keys.forEach(k=>{const v=sGet(k);if(v!==null&&v!==undefined){data[k]=v;n++;}});
  if(!n){alert('尚无任何可导出的进度。');return;}
  const txt=JSON.stringify({game:'问道长生',ver:1,exportedAt:new Date().toISOString(),data:data},null,2);
  const blob=new Blob([txt],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='问道长生存档_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},3000);
  toast('存档已导出（'+n+' 条数据）');
 }catch(e){alert('导出失败：'+e.message);}
}
function importSave(file){
 if(!file)return;
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.game!=='问道长生'||!d.data)throw new Error('这不是有效的问道长生存档文件');
   let n=0;
   Object.keys(d.data).forEach(k=>{if(/^wdcs_/.test(k)){sSet(k,d.data[k]);n++;}});
   if(!n)throw new Error('文件中没有存档数据');
   alert('导入成功（'+n+' 条数据）——'+(G?'当前游玩进度不受影响，可随时在「档卷」读取新档':'回到卷首即可续缘'));
   if(!G)render();
  }catch(e){alert('导入失败：'+e.message);}
 };
 fr.readAsText(file,'utf-8');
}
function pickImport(){
 const inp=document.createElement('input');
 inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>{if(inp.files&&inp.files[0])importSave(inp.files[0]);};
 inp.click();
}

/* ===================== 总控：点击（事件委托） ===================== */
document.addEventListener('click',function(e){
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 /* 标题/死亡页：新局·读档·史册 */
 if(!G&&!C){
  if(a==='newgame'){C=newChar();DEAD=false;renderCreate(1);}
  else if(a==='load'){if(!load())alert('没有找到有效存档');}
  else if(a==='vfiles'){$('#app').innerHTML=filesHTML();}
  else if(a==='slotGo'){if(!slotLoad(+v))alert('此档位为空或已损坏');}
  else if(a==='bakGo'){let ok=false;try{ok=loadData(JSON.parse(sGet('wdcs_backup')));}catch(e){}if(!ok)alert('备份已失效');}
  else if(a==='bakDel'){sDel('wdcs_backup');$('#app').innerHTML=filesHTML();}
  else if(a==='expSave'){exportSave();}
  else if(a==='impSave'){pickImport();}
  else if(a==='vchr'){$('#app').innerHTML='<h1 class="title">问道长生</h1><div class="sub">轮回史册</div>'+chronicleHTML()+'<div class="center" style="padding:8px"><button class="btn" data-a="back">'+tag('返　回','gray')+' 回到卷首</button></div>';}
  else if(a==='back')render();
  return;}
 /* 创角阶段（C 存在且尚未开局） */
 if(C&&!G){
  switch(a){
   case 'sex':C.sex=v;if(v!=='自')C.customSex='';renderCreate(C._step);return;
   case 'po':C.origin=+v;renderCreate(1);return;
   case 'pp':C.path=+v;renderCreate(1);return;
   case 'pr':
    if(ROOTS[+v].varOnly){const roll=D100();if(roll<=60){alert('机缘不足（骰出 '+roll+'，需大于60方能觉醒变异灵根）——血脉沉寂，另择良根吧。');return;}}
    C.root=+v;C.eles=[];renderCreate(2);return;
   case 'pc':
    if(CONS[+v].n==='混沌体'&&D100()>85){alert('传说品质岂是人人可得（需骰出大于85的机缘）——混沌之气悄然退散。');return;}
    C.con=+v;renderCreate(2);return;
   case 'pe':{
    const k=v,maxN=C.root===0?1:C.root===1?2:C.root===2?3:5;
    if(C.eles.includes(k))C.eles=C.eles.filter(x=>x!==k);
    else if(C.eles.length<maxN)C.eles.push(k);else C.eles[maxN-1]=k;
    renderCreate(2);return;}
   case 'pt':{
    const td=TALENTS.find(x=>x.n===v);
    let spent=C.talents.reduce((s,x)=>{const t=TALENTS.find(y=>y.n===x);return s+t.c;},0);
    if(C.talents.includes(v))C.talents=C.talents.filter(x=>x!==v);
    else{if(td.c>0&&spent+td.c>5){toast('天赋点不足');return;}C.talents.push(v);}
    renderCreate(2);return;}
   case 'incA':{const i=+v,used=C.alloc.reduce((x,y)=>x+y,0);if(C.alloc[i]<15&&used<60)C.alloc[i]++;renderCreate(2);return;}
   case 'decA':{const i=+v;if(C.alloc[i]>1)C.alloc[i]--;renderCreate(2);return;}
   case 'crnext1':{
    const cn=$('#cn');if(cn&&cn.value.trim())C.name=cn.value.trim();
    const cs=$('#cs');if(cs&&cs.value.trim())C.customSex=cs.value.trim();
    const ck=$('#clk');if(ck&&ck.value.trim())C.look=ck.value.trim();
    if(C.origin<0||C.path<0)return;
    renderCreate(2);return;}
   case 'crback':renderCreate(1);return;
   case 'crdone':finishCreate();return;
  }
  return;
 }
 if(!G)return;
 const p=G.c;
 const ARCH_OK=(a==='slotS'||a==='slotL'||a==='slotD'||a==='expSave'||a==='impSave');
 if(G.ev&&a!=='evk'&&a!=='doSave'&&a!=='restart'&&a[0]!=='v'&&!ARCH_OK){toast('此事未了，先做个决断');return;}
 if(G.mr&&a!=='mrSearch'&&a!=='mrGo'&&a!=='mrLeave'&&a!=='doSave'&&a!=='restart'&&!ARCH_OK){toast('身在秘境，心无旁骛');return;}
 switch(a){
  case 'vmain':p.view='main';render();break;
  case 'vmap':p.view='map';render();break;
  case 'vmkt':p.view='mkt';render();break;
  case 'vbag':p.view='bag';render();break;
  case 'vsect':p.view='sect';render();break;
  case 'vcave':p.view='cave';render();break;
  case 'valch':p.view='alch';render();break;
  case 'vforge':p.view='forge';render();break;
  case 'vsoc':p.view='soc';render();break;
  case 'vwu':p.view='wu';render();break;
  case 'vdex':p.view='dex';render();break;
  case 'dexT':DEX_TAB=v;render();break;
  case 'cardTgl':p.cardOpen=!p.cardOpen;render();break;
  case 'vslots':p.view='slots';render();break;
  case 'slotS':{
   const i=+v;
   if(slotSave(i)){say('<b class="lg-g">进度已存入档位 '+(i+1)+'。</b>','g');render();}
   else toast('存档失败');
   break;}
  case 'slotL':{
   const cur=sGet('wdcs_save');
   if(!slotLoad(+v))toast('读取失败：此档位为空或已损坏');
   else if(cur){try{sSet('wdcs_backup',cur);}catch(e){}}
   break;}
  case 'slotD':{
   const i=+v;
   if(confirm('确定删除档位 '+(i+1)+'？此档进度将不可找回。')){slotDel(i);render();}
   break;}
  case 'expSave':exportSave();break;
  case 'impSave':pickImport();break;
  case 'vhelp':p.view='help';render();break;
  case 'evk':{const ev=G.ev;if(!ev)return;const o=ev.opts[+v];if(!o)return;G.ev=null;o.fx();break;}
  case 'fcgo':{const ip=$('#fcmd');const val=ip?ip.value:'';if(ip)ip.value='';freeInput(val);break;}
  case 'cult':doCult();break;
  case 'closed':closedDoors();break;
  case 'explore':if(isDangerHere()&&!confirm('警告：此地危险等级高于你的修为，贸然历练极可能重伤乃至身死。\n\n确认仍要去？'))return;explore();break;
  case 'rest':{const rm=p.m===11?1.5:1;
   heal(p,'hp',Math.floor(p.hpM*0.25*rm));heal(p,'mp',Math.floor(p.mpM*0.3*rm));
   if(p.abn.includes('重伤')&&D100()>50){p.abn.splice(p.abn.indexOf('重伤'),1);say('卧榻静养月余，重伤渐愈。','g');}
   say('焚香沐浴，静养一月，气血归盈。','g');afterAction();break;}
  case 'travel':doTravel(+v);break;
  case 'useIt':useItem(+v);break;
  case 'sellH':sellHerb(+v);break;
  case 'sellO':sellOre(+v);break;
  case 'buy':buyItem(v);break;
  case 'joinSect':joinSect();break;
  case 'job':doJob(+v);break;
  case 'leaveSect':leaveSect();break;
  case 'upCave':caveUp('lv');break;
  case 'setRoom':caveUp('room');break;
  case 'setZhen':caveUp('zhen');break;
  case 'craft':craftPill(+v);break;
  case 'forgeIt':craftEq(+v);break;
  case 'repair':repairEq(v);break;
  case 'nurture':nurtureSpirit(v);break;
  case 'feedSpr':feedSpirit(v);break;
  case 'mrSearch':mrAct('search');break;
  case 'mrGo':mrAct('go');break;
  case 'mrLeave':mrAct('leave');break;
  case 'feedBeast':feedBeast();break;
  case 'talk':socTalk(v);break;
  case 'gift':socGift(v);break;
  case 'lunDao':lunDao(v);break;
  case 'dual':dual(v);break;
  case 'marry':marry(v);break;
  case 'learnWu':learnWu(+v);break;
  case 'doSave':save();toast('已存档（本机）');break;
  case 'restart':if(confirm('丢弃当前进度？直接重开不计入轮回。')){sDel('wdcs_save');G=null;DEAD=false;C=null;render();}break;
  case 'btS':btSmall();break;
  case 'btBH':btBig('H');break;
  case 'btBD':btBig('D');break;
  case 'btBT':btBig('T');break;
  case 'tbTake':resolveStrike('take');break;
  case 'tbFu':resolveStrike('fu');break;
  case 'tbMerit':resolveStrike('merit');break;
  case 'pkAw':{
   const aw=G.pick.list[+v];p.awaken.push(aw.split('（')[0]);
   applyAwakenEffect(p,aw);markDeed('觉醒「'+aw.split('（')[0]+'」');
   say('<b style="color:#7a5fa8">【逆天改命 · '+aw.split('（')[0]+'】烙入神魂！</b>');
   G.pick=null;checkAuto();break;}
  case 'cbA':cbFight('atk');break;
  case 'cbQ':cbFight('chg');break;
  case 'cbD':cbFight('def');break;
  case 'cbR':cbFight('flee');break;
  case 'cbT':cbFight('talk');break;
  case 'cbU':cbUse(+v);break;
  case 'cbS':cbSurrender();break;
 }
});
/* 自由输入框：回车提交（无表单，绝不触发页面导航） */
document.addEventListener('keydown',function(e){
 const t=e.target;
 if(t&&t.id==='fcmd'&&e.key==='Enter'){
  e.preventDefault();
  const val=t.value;t.value='';
  freeInput(val);
 }
});
function toast(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#3F3A34;color:#FBF8F1;padding:6px 16px;border-radius:6px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}
function finishCreate(){
 const left=60-C.alloc.reduce((x,y)=>x+y,0);
 if(left!==0){alert('还有 '+left+' 点属性未分配');return;}
 const p=buildPlayer();
 DEAD=false;G={c:p};G.log=[];
 G.log.push(
  '<span class="lg-n">灵气潮汐前的第三十九个春天，青岳山道上人来人往。</span>',
  '<span class="lg-n"><b>你叫'+esc(p.name)+'，'+esc(p.sex)+'，'+p.age+'岁——如今更是「'+esc(p.dao)+'」。</b></span>',
  '<span class="lg-n">仙姿'+p.zi+'，'+p.rootType+'（'+(p.eles.join('')||'未显')+'），携《'+p.gongfa.n+'》入道，怀揣'+p.stones+'块灵石。</span>',
  '<span class="lg-n">'+(p.path==='守护所爱'?'你心底压着一个名字和一句没说出口的承诺。':'灵气复苏的前夜，人人都在赌一个未来。')+'</span>');
  if(p.inheritNote)G.log.push('<span class="lg-y">【宿慧】'+p.inheritNote+'</span>');
 markDeed('踏上修行路·'+RL[p.rIdx].n);
 save();render();
}
render();

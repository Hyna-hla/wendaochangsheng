<style>
:root{
 --bg:#efece3;--paper:#FBF8F1;--ink:#3F3A34;--sub:#8C8578;--gold:#C9A45C;
 --jade:#6FA698;--purp:#8B6FA8;--red:#C4675C;--pink:#D88FA5;--vio:#A98FD9;

 --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--safe-left:env(safe-area-inset-left);--safe-right:env(safe-area-inset-right);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:linear-gradient(#e8e4d8,#efece3 240px);font-family:"KaiTi","STKaiti","Noto Serif SC",serif;color:var(--ink);min-height:100vh;padding-bottom:calc(40px + var(--safe-bottom))}

.panel{background:var(--paper);border:2px solid var(--jade);border-radius:10px;padding:clamp(10px,2.5vw,14px) clamp(12px,3vw,16px);margin:8px 0;box-shadow:0 3px 10px rgba(60,50,30,.12)}
.panel.t-purp{border-color:var(--purp)}.panel.t-red{border-color:var(--red)}
.panel.t-pink{border-color:var(--pink)}.panel.t-vio{border-color:var(--vio)}
.panel.t-gold{border-color:var(--gold)}.panel.t-blue{border-color:var(--blue)}
.panel.t-bam{border-color:var(--bam)}.panel.warnbg{background:var(--warn)}
.bar-title{display:inline-block;background:var(--jade);color:#fff;font-weight:bold;padding:2px 12px;border-radius:4px;font-size:clamp(14px,3vw,17px);margin:-22px 0 4px -2px}
.t-purp>.bar-title{background:var(--purp)}.t-red>.bar-title{background:var(--red)}

.t-gold>.bar-title{background:var(--gold)}.t-blue>.bar-title{background:var(--blue)}
.t-bam>.bar-title{background:var(--bam)}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(160px,40vw,210px),1fr));gap:4px 12px;font-size:clamp(12px,2.8vw,14px)}
.statgrid > div{text-align:left;justify-self:start}
.btn{cursor:pointer;border:1.5px solid;border-color:#cfc7b4;border-radius:8px;background:#fff;padding:clamp(8px,2vw,12px) clamp(10px,2.5vw,14px);font-family:inherit;font-size:clamp(13px,3vw,15px);color:var(--ink);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;touch-action:manipulation}
.btn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.tag{color:#fff;font-weight:bold;border-radius:4px;padding:1px 6px;font-size:clamp(10px,2.2vw,12px);display:inline-block}
.b-jade{background:var(--jade)}.b-purp{background:var(--purp)}.b-red{background:var(--red)}
.b-pink{background:var(--pink)}.b-vio{background:var(--vio)}.b-gold{background:var(--gold)}
.b-blue{background:var(--blue)}.b-bam{background:var(--bam)}.b-gray{background:#B7AFA2}
.pbj{height:10px;background:#E8E4DC;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle;width:clamp(80px,20vw,110px)}
.pbj>i{display:block;height:100%;border-radius:5px}
.opt{display:block;border:1.5px solid #ddd6c8;border-radius:8px;padding:clamp(10px,2.5vw,12px);margin:6px 0;background:#fffdf7;cursor:pointer;font-size:clamp(13px,3vw,15px);min-height:44px;touch-action:manipulation}

.log p{margin:2px 0}.lg-n{color:var(--ink)}.lg-g{color:#6a9c72}.lg-r{color:#B23F33}.lg-y{color:#9a7420}.lg-p{color:#b25984}.lg-s{color:var(--sub);font-size:clamp(10px,2.2vw,12px)}
.flexwrap{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.col-l{flex:1 1 100%;min-width:100%}.col-r{flex:0 0 100%;max-width:100%}

  .flexwrap{flex-wrap:nowrap}

input[type=text],select{font-family:inherit;padding:clamp(10px,2.5vw,12px) clamp(10px,2.5vw,12px);border:1.5px solid #cfc7b4;border-radius:8px;background:#fffdf7;font-size:clamp(14px,3.5vw,16px);width:100%;min-height:44px}

.step{width:clamp(36px,8vw,44px);height:clamp(36px,8vw,44px);border-radius:8px;border:1.5px solid var(--jade);background:#fff;font-weight:bold;cursor:pointer;color:var(--jade);font-size:clamp(14px,3vw,18px);touch-action:manipulation}

.deeds-box{max-height:clamp(150px,25vh,300px);overflow-y:auto;padding-right:4px}
.deed{position:relative;font-size:clamp(11px,2.5vw,13px);line-height:1.8;padding-left:12px;border-left:1.5px solid #d9d2c0;margin-left:4px;opacity:0;animation:deedIn .5s ease forwards}
.deed::before{content:'';position:absolute;left:-4px;top:8px;width:6px;height:6px;border-radius:50%;background:#fffdf7;border:1.5px solid #9a917e}
.deed-y{color:var(--sub);display:inline-block;min-width:clamp(70px,18vw,88px)}
@keyframes deedIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.cardtgl{cursor:pointer;font-weight:normal;font-size:clamp(10px,2.2vw,12px);margin-left:8px;opacity:.9;min-height:44px;display:inline-flex;align-items:center;touch-action:manipulation}
.dextabs{display:flex;flex-wrap:wrap;gap:4px}
.dextab{cursor:pointer;border:1.5px solid #C9BFA8;border-radius:14px;padding:4px 10px;font-size:clamp(11px,2.5vw,13px);background:#fffdf7;color:var(--ink);min-height:36px;touch-action:manipulation}
.dextab:hover{border-color:var(--vio)}

.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,45vw,165px),1fr));gap:6px}
.dexcell{border:1.5px solid #C9BFA8;border-radius:8px;padding:clamp(6px,1.5vw,8px);font-size:clamp(11px,2.5vw,13px);line-height:1.6;background:#fffdf7}
.dexcell small{color:var(--sub)}
.dexcell.off{border-style:dashed;text-align:center;color:#b7afa0}
.dexcell.off b{color:#b7afa0;letter-spacing:2px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:98;opacity:0;transition:opacity 2.8s ease;background:radial-gradient(ellipse at 50% 28%,transparent 52%,rgba(112,36,46,.17) 100%)}
body.tide{background:linear-gradient(#4a424b,#37323a 240px);--paper:#F3ECE9;--ink:#413639;--sub:#8b7e85;--gold:#ab7d86}
body.tide::before{opacity:1}
body.tide h1.title{color:#EDE5DF}
body.tide .sub{color:#b3a4ac}
body.tide .panel{box-shadow:0 3px 12px rgba(45,15,22,.4)}
.big{font-size:clamp(16px,3.5vw,18px);font-weight:bold;color:#2B2620}
.danger{color:#B23F33;font-weight:bold}
.center{text-align:center}
@media(max-width:480px){
  .flexwrap{gap:6px}
  .panel{padding:clamp(8px,2vw,12px)}

  .opt{padding:clamp(12px,3vw,14px);font-size:clamp(14px,3.5vw,16px)}
  input[type=text],select{font-size:clamp(16px,4vw,18px);padding:clamp(12px,3vw,14px)}
  .statgrid{grid-template-columns:1fr}
  .dexgrid{grid-template-columns:1fr}
  .dextabs{justify-content:center}

  .log{max-height:60vh}
  .deeds-box{max-height:40vh}
  h1.title{font-size:clamp(18px,4vw,24px);margin:8px 0}
  .sub{margin-bottom:8px}

/* ===================== 仙乐坊 · 背景乐 ===================== */
#bgmBtn{position:fixed;top:calc(10px + var(--safe-top));right:calc(10px + var(--safe-right));z-index:200;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--jade);background:var(--paper);color:var(--jade);font-size:17px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,50,30,.18);transition:.15s;touch-action:manipulation}
#bgmBtn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(60,50,30,.25)}
#bgmBtn.on{border-color:var(--gold);color:var(--gold);animation:bgmPulse 2.6s ease-in-out infinite}
@keyframes bgmPulse{0%,100%{box-shadow:0 2px 8px rgba(201,164,92,.15)}50%{box-shadow:0 2px 12px rgba(201,164,92,.6)}}
#bgmPanel{position:fixed;top:calc(54px + var(--safe-top));right:calc(10px + var(--safe-right));z-index:200;width:min(300px,calc(100vw - 24px));max-height:min(430px,72vh);background:var(--paper);border:2px solid var(--jade);border-radius:10px;box-shadow:0 6px 22px rgba(60,50,30,.28);padding:10px 12px;display:none;flex-direction:column;font-size:13px}
#bgmPanel.open{display:flex}
.bgm-now{color:var(--sub);font-size:12px;margin:5px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgm-ctl{display:flex;align-items:center;gap:6px;margin:4px 0 6px}
.bgm-mini{width:32px;height:32px;border-radius:7px;border:1.5px solid #cfc7b4;background:#fff;cursor:pointer;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.15s;touch-action:manipulation;flex:0 0 auto}
.bgm-mini:hover{border-color:var(--jade);color:var(--jade)}
.bgm-list{overflow-y:auto;border-top:1px solid #e5dfcf;padding-top:4px;margin-top:2px;overscroll-behavior:contain}
.bgm-row{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.4;touch-action:manipulation}
.bgm-row:hover{background:#f3eee1}
.bgm-row.cur{color:var(--jade);font-weight:bold;background:#eef4f0}
.bgm-row .no{color:var(--sub);font-size:11px;min-width:22px;text-align:right;flex:0 0 auto}
.bgm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=range].bgm-vol{flex:1;height:24px;min-width:60px}
</style>
</head>

<script>
/* ===================== 存储保险丝 ===================== */
let MEM={};
function sGet(k){try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;}}
function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
function sDel(k){try{localStorage.removeItem(k);}catch(e){delete MEM[k];}}

/* ===================== 工具 ===================== */

const RI=n=>Math.floor(Math.random()*n);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function panel(theme,title,body,warn){
 return '<div class="panel t-'+theme+(warn?' warnbg':'')+'"><span class="bar-title">'+title+'</span><div class="hr"></div>'+body+'</div>';

 {n:'地仙',life:1000000,base:1368000,need:174000000000},{n:'天仙',life:5000000,base:3009000,need:487000000000},

const PW=[26,65,165,412,1035,2600,6530,16400,41200,103500,260000,653000,1640000,4120000,10350000,26000000,65300000,164000000,412000000,1035000000];

function tierOf(i){return Math.min(3,Math.floor(i/5));}
/* 大数格式化：万 / 亿 / 万亿 */
function fmtN(v){
 if(!isFinite(v))return '∞';
 v=Math.round(v);
 if(v<0)return '-'+fmtN(-v);
 if(v<1e4)return ''+v;
 if(v<1e8)return (v/1e4).toFixed(1)+'万';
 if(v<1e12)return (v/1e8).toFixed(2)+'亿';
 if(v<1e16)return (v/1e12).toFixed(2)+'万亿';
 return v.toExponential(2);
}

function npcTier(p,skillId){
 if(!p)return 0;
 for(let i=0;i<NPC_TEACH_KEYS.length;i++){
  const nid=NPC_TEACH_KEYS[i];
  if(NPC_TEACH[nid]===skillId){
   const r=p.rel[nid]||0;
   if(r>=90&&p.spouse===nid)return 3;
   if(r>=90)return 2;
   if(r>=80)return 1;
   return 0;
  }
 }
 return 0;
}
function effSkill(sk,skillId,p){
 if(!sk.npcTier)return sk;
 const t=npcTier(p,skillId);
 if(!t)return sk;
 const s=Object.assign({},sk);
 s.tier=t;
 if(t>=2){
  if(sk.t2mul)s.mul=sk.t2mul;
  if(sk.t2dodge)s.dodgeBase=sk.t2dodge;
  if(sk.t2healPct)s.healPct=sk.t2healPct;
  if(sk.t2mpPct)s.mpPct=sk.t2mpPct;
  if(sk.t2lifeSteal)s.lifeSteal=sk.t2lifeSteal;
  if(sk.t2stun)s.stun=sk.t2stun;
  if(sk.t2hits)s.hits=sk.t2hits;
 }
 if(t>=3){
  if(sk.t3mul)s.mul=sk.t3mul;
  if(sk.t3dodge)s.dodgeBase=sk.t3dodge;
  if(sk.t3healPct)s.healPct=sk.t3healPct;
  if(sk.t3mpPct)s.mpPct=sk.t3mpPct;
  if(sk.t3lifeSteal)s.lifeSteal=sk.t3lifeSteal;
  if(sk.t3stun)s.stun=sk.t3stun;
  if(sk.t3hits)s.hits=sk.t3hits;
  if(sk.t3ignoreDef)s.ignoreDef=true;
 }
 const sy=SKILL_SYNERGY[skillId];
 s.sy=null;s.syOn=false;
 if(sy&&t>=1){
  const wn=(p.equip&&p.equip.w&&p.equip.w.dur>0)?p.equip.w.n:'';
  const an=(p.equip&&p.equip.a&&p.equip.a.dur>0)?p.equip.a.n:'';
  if(wn===sy.eq||an===sy.eq){
   s.sy=sy;s.syOn=true;
   if(sy.mulAdd)s.mul+=sy.mulAdd;
   if(sy.lifeSteal)s.lifeSteal=Math.max(s.lifeSteal||0,sy.lifeSteal);
   if(sy.stun)s.stun=Math.max(s.stun||0,sy.stun);
   if(sy.hits)s.hits=sy.hits;
   if(sy.healPctAdd)s.healPct=(s.healPct||0)+sy.healPctAdd;
   if(sy.mpPct)s.mpPct=Math.max(s.mpPct||0,sy.mpPct);
   if(sy.dodge)s.dodgeBase=Math.max(s.dodgeBase||0.6,sy.dodge);
  }
 }
 return s;
}

 if(bodyLv(p)>=7){
  p.hp=p.hpM;p.mp=p.mpM;
  say('<b style="color:#D4A017">【不灭金身·涅槃】金身寸寸碎裂，又在金光中重聚——你自毁灭中走了回来，气血灵力尽数归盈！（每战一次）</b>','g');
  markDeed('不灭金身·涅槃重生');
  return true;
 }
 return false;
}
function bodyLv(p){return p.bodyLv||0;}
function bodyNext(p){return BODY_REALMS[bodyLv(p)+1];}
function bodyGain(p){
 let v=25*(1+p.att[0]*0.02)*(1+(p.wuT[2]||0)*0.05)*(1+zwStat(p,'cult')/100)*(1+p.rIdx*0.5);
 if(p.eles.includes('土'))v*=1.15;
 if(p.eles.includes('金'))v*=1.10;
 if(p.con==='九阳圣体')v*=1.30;
 if(p.con==='混沌体')v*=1.15;
 if((p.awaken||[]).indexOf('肉身成圣（气血上限+25%）')>=0)v*=1.25;
 if(p.abn.indexOf('重伤')>=0||p.abn.indexOf('内伤')>=0)v*=0.5;
 if(p.m===6)v*=1.25;
 if(p.y>=410)v*=1+(p.y-410)*0.01;
 return v;
}
function quiti(){
 const p=G.c;const g=Math.floor(bodyGain(p));p.flags.qt1=1;
 p.bodyExp=(p.bodyExp||0)+g;
 const nx=bodyNext(p);
 let txt='你于瀑布与雷池之间引灵淬体，皮肉筋骨承受千锤百炼——体魄修为 +'+g+'。';
 if(nx&&p.bodyExp>=nx.need){
  p.bodyExp-=nx.need;p.bodyLv++;
  const R=BODY_REALMS[p.bodyLv];
  p.hpM=Math.round(p.hpM*BODY_HP_MUL[p.bodyLv]);p.hp=p.hpM;
  if(p.bodyLv===2){p.hpM=Math.round(p.hpM*1.05);p.hp=p.hpM;}
  txt+='<br><b class="lg-g">【炼体突破】皮开肉绽中血肉新生，你踏入「'+R.n+'」！气血上限×'+BODY_HP_MUL[p.bodyLv]+' · 战力×'+R.pw.toFixed(2)+(BODY_PASSIVE[p.bodyLv]?' · <b>'+BODY_PASSIVE[p.bodyLv]+'</b>':'')+'（'+R.d+'）</b>';
  markDeed('炼体突破·'+R.n);
  p.merit+=1;
 }
 say(txt,'g');
 afterAction();
}
/* ===================== 试炼塔（参考《一念逍遥》通天塔 · 《疯狂水世界》闯关） ===================== */
function towerFloorHp(f){return (f%10===0)?1.02:1.006;} /* 气血上限乘数 */
function realmOfPower(pw){
 let r=0;for(let i=0;i<PW.length;i++){if(pw>=PW[i]*0.92)r=i;}
 let stg=0;const base=PW[r]*0.92,span=PW[r]*0.25;
 if(pw>=base+span*3)stg=3;else if(pw>=base+span*2)stg=2;else if(pw>=base+span)stg=1;
 return {r,stg};
}
const TOWER_BOSS_AFF=['魔侵','厚血','坚壁','蚀灵','禁疗','煞暴'];
const TOWER_TIER=[['镇塔妖犬','塔主·古妖真形'],['剑冢剑傀','塔主·万剑剑灵'],['古修残魂','塔主·前世登临者'],['塔灵化身','塔主·天道投影']];
function towerEnemy(f){
 let pw=PW[0]*Math.pow(1.2,f-1); /* 每层难度×1.2 —— 九十九层恰好横跨二十境 */
 if(f%10===0)pw*=1.5; /* 逢十塔主，再涨50% */
 pw=Math.floor(pw);
 const realm=realmOfPower(pw);
 const tn=TOWER_TIER[Math.min(3,Math.floor((f-1)/25))];
 const t={n:'试炼塔·'+tn[f%10===0?1:0]+'（第'+f+'层）',r:realm.r,stg:realm.stg,hp:pw*3.2,hpM:pw*3.2,pw:pw,tag:'tower',floor:f,eles:['土'],aff:[]};
 if(f%10===0&&f>=30)t.sk=ENEMY_SK[RI(ENEMY_SK.length)];
 if(f%10===0&&f>=40)t.canAwk=true;
 if(f%10===0){t.boss=1;t.phase=1;} /* R16 塔主走多阶段 */
 /* 二十层起，逢十塔主携「塔中异变」——每一重塔规则不同，不再只是数值放大 */
 if(f%10===0&&f>=20){
  const aff=TOWER_BOSS_AFF[RI(TOWER_BOSS_AFF.length)];
  t.aff=[aff];
  if(aff==='魔侵'){pw=Math.floor(pw*1.3);t.pw=pw;t.hp=pw*3.2;t.hpM=pw*3.2;}
  if(aff==='厚血'){t.hp=Math.floor(t.hp*1.5);t.hpM=Math.floor(t.hpM*1.5);}
  if(aff==='坚壁')t.wall=1.6;
  if(aff==='煞暴')t.critCh=25;
 }
 return t;
}
function towerFight(){
 const p=G.c;const f=(p.towerBest||0)+1;
 if(f>99){say('九十九层已尽破——你已是此界登塔第一人。','s');render();return;}
 const en=towerEnemy(f);
 startCombat(en);
 G.cb.mpX2=(en.aff||[]).indexOf('蚀灵')>=0;
 G.cb.healCut=(en.aff||[]).indexOf('禁疗')>=0;
}

 const hpMul=towerFloorHp(f);

 }
 const zw=dropZhenwen(Math.min(9,Math.floor(f/10)),0.18);
 if(zw)txt+='<br><span class="lg-g">【上古真文】塔中残刻崩落，凝出一枚「'+zw.n+'」真文！</span>';
 say(txt,'g');
 markDeed('试炼塔·登至第'+f+'层');

/* ===================== 上古真文（参考《龙族卡塞尔之门》龙文） ===================== */
const ZW_PARTS=[
 {id:'灵',n:'灵文',stat:'atk',d:'战力'},
 {id:'魄',n:'魄文',stat:'hp',d:'气血'},
 {id:'骨',n:'骨文',stat:'def',d:'守御'},
 {id:'罡',n:'罡文',stat:'cult',d:'修炼'},
 {id:'遁',n:'遁文',stat:'flee',d:'遁速'},
 {id:'神',n:'神文',stat:'mind',d:'道心'}];
const ZW_QN=['凡','玄','地','天','仙'];
/* 魄文气血改为百分比加成（随品质/等级），避免固定值在指数曲线上失效 */
const ZW_HP_PCT=[3,6,10,15,20];
const ZW_BASE={
 atk:[2,5,10,18,30],   // 战力+%
 hp:[12,35,80,160,300],// 气血上限
 def:[3,7,14,26,45],   // 守御
 cult:[3,8,15,28,45],  // 修炼+%
 flee:[2,5,9,16,25],   // 遁走成功率+%
 mind:[2,4,8,15,25]};  // 道心→每月悟道概率
const ZW_NAMES={
 '灵':['天罡剑文','诛仙雷文','太乙金文','北辰剑文'],
 '魄':['玄武镇文','龙象力文','盘古气血文','神凰涅槃文'],
 '骨':['玄龟甲文','不动金刚文','山河镇岳文','不周山文'],
 '罡':['聚灵真文','周天星文','吞天气文','太虚灵气文'],
 '遁':['惊鸿遁文','缩地成寸文','无影流光文','踏云追风文'],
 '神':['清心明经文','斩念慧剑文','太上忘情文','太初道文']};
function zwStat(p,stat){
 let s=0;
 const arr=p.zhenwen||[],sl=p.zwSlot||{};
 ZW_PARTS.forEach(pt=>{const idx=sl[pt.id];if(idx!=null&&arr[idx]&&pt.stat===stat)s+=ZW_BASE[stat][arr[idx].q]*(1+arr[idx].lv*0.25);});
 return Math.floor(s);
}
function zwEquipped(p){
 const arr=p.zhenwen||[],sl=p.zwSlot||{},out=[];
 ZW_PARTS.forEach(pt=>{const idx=sl[pt.id];if(idx!=null&&arr[idx])out.push(arr[idx]);});
 return out;
}
function zwHpPct(w){return ZW_HP_PCT[w.q]*(1+w.lv*0.25);}
function zwCosts(p,w){return {s:Math.round((w.lv+1)*(w.q+1)*150*Math.pow(1.9,Math.max(0,p.rIdx-1))),c:Math.round((w.lv+1)*200*Math.pow(2.5,p.rIdx))};}
/* ===================== 真文阵纹 · 道藏集藏 · 五行道基（参考《龙族卡塞尔之门》龙纹套装/作战装备/元素命轮） ===================== */
const ZW_ZN=['杀伐','护道','益生'];
const ZW_ZN_C={杀伐:'red',护道:'blue',益生:'jade'};
function zwNormalize(w){if(!w.zn)w.zn=ZW_ZN[RI(3)];return w;}
/* 阵纹套装：装备同阵真文凑 2/4/6 件分档解锁；仙纹(仙品)≥3 强化6件效果 */
function zwSetInfo(p){
 const eq=zwEquipped(p).map(zwNormalize);
 const cnt={杀伐:0,护道:0,益生:0};let xian=0;
 eq.forEach(w=>{cnt[w.zn]++;if(w.q===4)xian++;});
 return {cnt:cnt,xian:xian};
}
/* 杀阵6件：暴击追加真实伤害（战力15%，仙纹≥3翻倍） */
function zwShaReal(p,c){
 try{
  const si=zwSetInfo(p);
  if(si.cnt.杀伐>=6){
   const rd=Math.floor(power(p)*0.15*(si.xian>=3?2:1));
   c.e.hp-=rd;
   cbl('<span style="color:#C49A5C">【杀阵·真伤】杀阵真文轰然共振，'+fmtN(rd)+'点真实伤害穿透护体！</span>');
  }
 }catch(e){}
}
/* 综合常驻加成：真文阵纹 + 道藏集藏 + 五行道基 */
function metaBonus(p,kind){
 if(!p)return 0;
 let v=0;
 /* 真文阵纹 */
 try{
  const si=zwSetInfo(p);
  if(kind==='pow'&&si.cnt.杀伐>=2)v+=8;
  if(kind==='crit'&&si.cnt.杀伐>=4)v+=10;
  if(kind==='guard'&&si.cnt.护道>=2)v+=12;
  if(kind==='dmgCut'&&si.cnt.护道>=6)v+=(si.xian>=3?12:8);
  if(kind==='cult'&&si.cnt.益生>=2)v+=8;
 }catch(e){}
 /* 道藏集藏：图鉴收录即得常驻加持 */
 try{
  const d=DEX();
  const got=k=>DEX_CATS[k].filter(x=>(d[k]||{})[x.n]).length;
  if(kind==='pow')v+=Math.min(20,Math.floor(got('beast')/3)*2);
  if(kind==='guard')v+=Math.min(10,got('eq')*2);
  if(kind==='cult')v+=Math.min(12,got('realm')*2);
  if(kind==='dan')v+=Math.min(15,got('pill')*3);
  if(kind==='npc')v+=Math.min(12,got('npc')*4);
  if(kind==='money')v+=Math.min(9,got('end')*3);
 }catch(e){}
 /* 五行道基：主元灵根收益翻倍（一拐N） */
 try{
  const dj=p.daoji||{};
  let tot=0;
  for(const el in (dj.lv||{})){tot+=(dj.lv[el]||0)*20*((p.eles||[]).indexOf(el)>=0?2:1);}
  if(kind==='pow')v+=Math.min(20,tot*0.1);
  if(kind==='dmgCut')v+=Math.min(12,tot*0.06);
 }catch(e){}
 return Math.round(v*10)/10;
}

/* ===================== 镇魔渊 · 高难无尽（词缀+领主+血脉觉醒） ===================== */

 const lord=layer%5===0;
 let pw=Math.floor(Math.round(PW[8]*0.55)*Math.pow(1.33,layer-1)*(lord?1.6:1)); /* 首层锚定化神初期55%——入门即热身,第5层领主即检查 */

 const e={n:'深渊·第'+layer+'层'+(lord?'领主':'魔物'),r:realm.r,stg:realm.stg,hp:pw*4,hpM:pw*4,pw:pw,tag:'abyss',layer:layer,canAwk:(lord||layer>=15)};
 if(lord||layer>=10)e.sk=ENEMY_SK[RI(ENEMY_SK.length)];
 if(lord){e.awkMulPreset=1.5;e.boss=1;e.phase=1;}
 const aff=[];
 if(layer>=10){aff.push(ABYSS_AFF[RI(ABYSS_AFF.length)]);if(layer>=25)aff.push(ABYSS_AFF[RI(ABYSS_AFF.length)]);}
 e.aff=aff;

 if(aff.indexOf('厚血')>=0){e.hp=Math.floor(e.hp*1.5);e.hpM=Math.floor(e.hpM*1.5);}
 if(aff.indexOf('坚壁')>=0)e.wall=1.6;
 if(aff.indexOf('嗜血')>=0)e.vamp=0.3;
 if(aff.indexOf('煞暴')>=0)e.critCh=25;
 return e;
}

function dropZhenwen(level,chance){
 const p=G.c;
 if(D100()>Math.floor(chance*100))return null;
 const part=ZW_PARTS[RI(6)].id;
 let q;
 if(level>=8)q=3+RI(2);
 else if(level>=6)q=2+RI(2);
 else if(level>=4)q=1+RI(2);
 else if(level>=2)q=1;
 else q=0;
 q=Math.min(4,q);
 const name=ZW_NAMES[part][RI(ZW_NAMES[part].length)];
 const w={n:name,part:part,q:q,lv:0,zn:ZW_ZN[RI(3)]};
 p.zhenwen=p.zhenwen||[];
 p.zhenwen.push(w);
 return w;
}

/* ===================== 法器启灵 + 同阶共鸣（参考《龙族》炼金武器/启灵/作战装备） ===================== */
const AFFIX_POOL=[
 {k:'power',n:'锋锐',d:'战力+%',rn:()=>3+RI(6)},
 {k:'guard',n:'磐石',d:'守御+',rn:()=>4+RI(6)},
 {k:'hp',n:'蕴灵',d:'气血上限+%',rn:()=>3+RI(4)},
 {k:'cult',n:'聚灵',d:'修炼+%',rn:()=>3+RI(5)},
 {k:'powerPct',n:'淬体',d:'战力系数+%',rn:()=>2+RI(4)},
 {k:'crit',n:'致命',d:'暴击率+%',rn:()=>2+RI(5)},
 {k:'critDmg',n:'爆裂',d:'暴击伤害+%',rn:()=>10+RI(25)}];
function affixSum(p,slot,k){
 const it=p.equip&&p.equip[slot];if(!it||!it.affix)return 0;
 return it.affix.reduce((a,x)=>x.k===k?a+x.v:a,0);
}
function affixSumAll(p,k){return affixSum(p,'w',k)+affixSum(p,'a',k);}
function setBonus(p){
 const w=p.equip&&p.equip.w,a=p.equip&&p.equip.a;
 if(!w||!a||w.dur<=0||a.dur<=0)return null;
 if(w.g===a.g)return {g:w.g,atk:1.05,def:1.10};
 return null;
}
function qiLing(slot){
 const p=G.c,it=p.equip&&p.equip[slot];if(!it||it.dur<=0){toast('该槽位无可用法器');render();return;}
 it.affix=it.affix||[];
 const qdCap=p.wuT[5]>=6?4:3;
 if(it.affix.length>=qdCap){toast('灵蕴已满，至多'+qdCap+'道词条');render();return;}
 const cost=Math.floor(SC([300,900,2700,8100][it.affix.length])*(p.wuT[5]>=10?0.5:1));
 if(p.stones<cost){toast('灵石不足（需'+cost+'）');render();return;}
 p.stones-=cost;
 const aff=AFFIX_POOL[RI(AFFIX_POOL.length)];
 const v=aff.rn();
 it.affix.push({k:aff.k,v:v,n:aff.n});
 if(aff.k==='hp'){p.hpM=Math.max(20,Math.round(p.hpM*(1+v/100)));p.hp=Math.min(Math.round(p.hp*(1+v/100)),p.hpM);}
 say('<b class="lg-g">【法器启灵】你以心火淬炼【'+it.n+'】，一缕灵机入驻器身——获「'+aff.n+'」'+(aff.k==='power'||aff.k==='powerPct'||aff.k==='cult'||aff.k==='hp'?'+'+v+'%':'+'+v)+'！（-'+cost+'石）</b>','g');
 afterAction();
}

 if(p.hunt&&p.hunt.y&&p.y-p.hunt.y<30&&!p.hunt.killed)return;

 const realm=realmOfPower(base);
 p.hunt={n:HUNT_NAMES[RI(HUNT_NAMES.length)],y:p.y,tier:tier,r:realm.r,stg:realm.stg,pw:Math.floor(base),killed:false};
}

const AUCTION_POOL=[
 {n:'天材地宝',p:700,ty:'item'},
 {n:'五行灵珠',p:2300,ty:'item'},
 {n:'玄阶功法残卷',p:750,ty:'gf'},

 {n:'诛仙剑符',p:140,ty:'item'},
 {n:'定魂丹',p:800,ty:'item'},
 {n:'元婴丹',p:2200,ty:'item'},
 {n:'化神丹',p:5500,ty:'item'}];
function auctionRefresh(p){
 p.auction=p.auction||{items:[],next:p.y+5};
 if(p.auction.items&&p.auction.items.length&&p.y<p.auction.next)return;
 const items=[];
 const pool=AUCTION_POOL.slice();
 for(let i=0;i<4&&pool.length;i++){
  const j=RI(pool.length);
  items.push(pool.splice(j,1)[0]);
 }
 p.auction={items:items,next:p.y+5};
}
function auctionBuy(i){
 const p=G.c;auctionRefresh(p);
 const it=p.auction.items[i];if(!it)return;
 const price=Math.ceil(SC(it.p)*bondShopMul(p));
 if(p.stones<price){toast('灵石不足');render();return;}
 p.stones-=price;
 if(it.ty==='gf'){const m=MK.find(x=>x.n===it.n);if(m&&m.to&&GF[m.to.g].c>GF[p.gongfa.g].c){p.gongfa=m.to;say('拍得《'+m.to.n+'》，当场参详，功法更替！','g');}else{say('拍得功法残卷【'+it.n+'】——你已有更高功法，留作珍藏。','y');}}
 else if(it.ty==='bp'){
  if(!p.blueprints.includes(it.n)){p.blueprints.push(it.n);if(!p.knownBlueprints.includes(it.n))p.knownBlueprints.push(it.n);say('拍得【'+it.n+'】图纸，收入怀中。','g');}
  else say('拍得【'+it.n+'】图纸（已拥有）。','y');
 }
 else{addItem(it.n,1);say('拍得【'+it.n+'】×1。','g');}
 p.auction.items.splice(i,1);
 render();
}
function auctionHTML(){

/* ===================== 离线挂机收益（参考《一念逍遥》·《疯狂水世界》放置玩法） ===================== */
function applyOffline(p){
 try{
  const last=p.lastActive||0;
  if(!last)return;
  const hrs=(Date.now()-last)/3600000;
  if(hrs<0.5)return;
  /* 收益封顶12小时：超出部分灵气驳杂，十不存一 */
  const effHrs=Math.min(hrs,12);
  let mo=Math.min(24,Math.floor(effHrs/2));
  if(hrs>12&&mo<24){
   const extra=Math.floor(Math.min(24-mo,(hrs-12)/2*0.1));
   mo+=extra;
  }
  if(mo<=0)return;
  let g=0;for(let i=0;i<mo;i++)g+=cultGain(p,true);
  const cg=Math.floor(g);
  if(!isFinite(cg)||cg<0)return;
  addCult(p,cg);
  const stones=Math.floor(mo*10*Math.pow(1.9,p.rIdx));
  p.stones+=stones;
  G.log.push('<span class="lg-s">【挂机收益】离山 '+Math.round(hrs)+' 小时，闭关苦修折算 '+mo+' 个月——修为 +'+fmtN(cg)+' · 灵石 +'+fmtN(stones)+'。</span>');
  /* 因果簿：挂机也有牵挂 */
  if(p.legacyW){const pe=(p.legacyW.people||[]).find(x=>!x.dead);
   if(pe)G.log.push('<span class="lg-p">【因果簿】离山多载——'+pe.n+'（前世的'+pe.role+'）又老了几岁，余约'+Math.max(0,pe.life)+'年。有些重逢，经不起等。</span>');}
  /* 离线报告：回档首屏弹出 */
  window.__offlineRpt={hrs:Math.round(hrs),mo:mo,cg:cg,stones:stones,decay:hrs>12};
 }catch(e){console.warn('离线收益异常:',e);}
}

/* ===================== 数值公式 ===================== */
function mindCoef(p){const req=Math.min(4+Math.floor(p.rIdx*0.7),14);return p.att[4]>=req+4?1.35:(p.att[4]>=req?1.15:1.0);}
function qiCoef(p){return [1,1.35,1.6,1.9][Math.min(3,p.cave.lv)];}
function cultGain(p,closed){
  let v=RL[p.rIdx].base*(1+p.att[0]*0.025)*p.rootC*GF[p.gongfa.g].c*qiCoef(p)*mindCoef(p);
  if(p.con==='先天道体')v*=1.25;
  if((p.awaken||[]).some(a=>a.startsWith('聚灵')))v*=1.15;
  if(p.sect){
   const sect=SECTS.find(s=>s.id===p.sectId);
   if(sect)v*=sect.bonus.cult;
  }
  if(p.master){
   const masterInfo={长老:1.15,峰主:1.3,太上长老:1.45,宗门门主:1.6}[p.master];
   if(masterInfo && p.masterGood)v*=masterInfo;
  }
  if(closed){v*=1.5*(p.cave.jingShi?1.1:1);try{if(zwSetInfo(p).cnt.益生>=4)v*=1.08;}catch(e){}}
  if(p.abn.includes('心魔缠身'))v*=0.5;
  if(p.abn.includes('内伤'))v*=0.5;
  if(p.tideOn)v*=1.25;
  if(weOn('tianBian'))v*=1.15; /* R12 天道异变：修速+15% */
  if(p.m===1)v*=1.25;
  if(p.m===12)v*=1.15;
  // debuff惩罚（追妻火葬场等）
  if(p.debuffs&&p.debuffs.length){
   p.debuffs.forEach(d=>{if(d.cult)v*=(1-d.cult);});
  }
  v*=(1+affixSumAll(p,'cult')/100);
  v*=(1+zwStat(p,'cult')/100);
  v*=(1+bondSum(p,'cult')/100);
  v*=(1+metaBonus(p,'cult')/100);
  v*=(1+Math.min(10,p.js||0)*0.02)*(1+famCult(p)/100)*(1+gfcCult(p)/100);
  if(p.spouse&&(p.spouseBond||0)>=30)v*=(p.spouseBond>=70?1.03:1.02); /* R18 道侣誓约：同心/道合之益 */
  v*=(p.daoSpd||1)*(p.buildPath==='fa'?1.25:1); /* 道果：独立乘区（转世首轮40-50%，逐轮递增至60%） */
  return v;}
function needOf(p){return RL[p.rIdx].need;}
function addCult(p,v){if(p)p.cult=CL(p.cult+v,0,Math.max(9999,needOf(p)*1.5));}
function heal(p,k,v){const mul=danMul(p)*Math.max(1,PW[p.rIdx]/26)*((G&&G.cb&&G.cb.healCut)?0.5:1); /* 禁疗词缀：回复减半 */if(k==='hp')p.hp=CL(p.hp+v*mul,0,p.hpM);else p.mp=CL(p.mp+v*mul,0,p.mpM);}
function danMul(p){const wood=p.eles.includes('木')?1.1:1;return (1+p.wuT[1]*0.08+((p.awaken||[]).some(a=>a.startsWith('丹药'))?0.3:0)+(wood-1)+(p.wuT[1]>=6?0.25:0))*(p.buildPath==='dan'?1.5:p.buildPath==='sword'?0.8:1)*(1+metaBonus(p,'dan')/100);}
function sprB(it){const s=it&&it.spr;return s?(SPR_B[s.lv]+(s.pact?0.15:0)):0;}
function equipB(p,slot){const it=p.equip&&p.equip[slot];if(!it||it.dur<=0)return 0;return it.b*(1+(p.wuT[5]||0)*0.04)*(1+sprB(it))*(1+(it.rf||0)*0.03);} /* R3 精炼：每级器效+3% */
function power(p){return PW[p.rIdx]*(0.92+p.stg*0.09)*(1+p.wuT[0]*0.03)*((p.awaken||[]).some(a=>a.startsWith('剑心'))?1.2:1)*(p.con==='剑灵体'?1.3:1)*(1+equipB(p,'w'))*(1+affixSumAll(p,'power')/100)*(1+affixSumAll(p,'powerPct')/100)*(1+zwStat(p,'atk')/100)*(zwEquipped(p).length>=6?1.15:1)*(setBonus(p)?setBonus(p).atk:1)*(BODY_REALMS[bodyLv(p)]?BODY_REALMS[bodyLv(p)].pw:1)*(1+bondSum(p,'pow')/100)*(1+metaBonus(p,'pow')/100)*(bodyLv(p)>=6?1.06:1)*(p.buildPath==='sword'?1.15:p.buildPath==='dan'?0.95:1)*(1+(p.flags&&p.flags.qj||0))*(1+gfcPow(p))*(1+famPow(p))*(p.spouse&&(p.spouseBond||0)>=70?1.03:1);}
/* 自创功法实装：最高一脉化作常驻战力/修炼（威力50~80 → 战力+10~16% 修炼+5~8%） */
function gfcBest(p){return (p.gfCustom&&p.gfCustom.length)?p.gfCustom.reduce((a,g)=>Math.max(a,g.power||0),0):0;}
function gfcPow(p){return gfcBest(p)*0.002;}
function gfcCult(p){return gfcBest(p)*0.001;}
/* 子嗣荫庇：成年子嗣各+4%战力/+2%修炼（战力计2人为限，修炼计3人为限） */
function famPow(p){return Math.min(2,(p.children||[]).filter(c=>(c.age||0)>=18).length)*0.04;}
function famCult(p){return Math.min(3,(p.children||[]).filter(c=>(c.age||0)>=18).length)*0.02;}

function guardVal(p){const earth=p.eles.includes('土')?1.1:1;return Math.round((p.rIdx*8+p.stg*3+equipB(p,'a')+zwStat(p,'def')+affixSumAll(p,'guard'))*earth*(setBonus(p)?setBonus(p).def:1)*PW[p.rIdx]/26*(1+bondSum(p,'guard')/100)*(1+metaBonus(p,'guard')/100)*(bodyLv(p)>=1?1.08:1));}
function applyAwakenEffect(p,aw){
 if(aw.startsWith('气运如虹'))p.att[5]=CL(p.att[5]+2,1,20);
 if(aw.startsWith('天眼通'))p.att[2]=CL(p.att[2]+3,1,20);
 if(aw.startsWith('心如磐'))p.att[4]=CL(p.att[4]+3,1,20);
 if(aw.startsWith('万里神行'))p.att[3]=CL(p.att[3]+3,1,20);
 if(aw.startsWith('肉身成圣')){p.hpM=Math.floor(p.hpM*1.25);p.hp=p.hpM;}
 if(aw.startsWith('大道之体'))for(let i=0;i<6;i++)p.att[i]=CL(p.att[i]+1,1,20);
}

function tideHint(){const p=G.c;
 if(!p.tideOn)return p.tideY-p.y<=10?('灵气潮汐将至（'+(p.tideY-p.y)+'年后）'):'潮汐尚远';

function season(){return ['春','夏','秋','冬'][Math.floor((rd().m-1)/3)];}
function npcName(id){const n=NPCS.find(x=>x.id===id);return n?n.n:'故人';}
function questHint(){const p=rd();
 if(p.rIdx===0)return p.sect?('宗门贡献 '+p.contrib+'，'+(p.discipleType===0?'攒够可晋升内门':p.discipleType===1?'攒够可晋升真传':'已是真传')):'宜寻一宗门立足';
 return ({问道飞升:'参悟功法，寻上古遗蜕',逍遥长生:'经营洞府，护住所爱',快意恩仇:'旧怨未了，江湖夜雨',

/* ===================== 新手引导 · 当前目标（参考主线引导） ===================== */
function questGoal(p){
 /* 新手第一步 */
 if(p.rIdx===0&&p.stg===0&&!(p.flags||{}).zuo1)return '点击【打坐修炼】，积攒第一缕修为';
 /* 突破就绪（最高优先） */
 if(p.stg<3&&p.cult>=needOf(p))return '气机圆满——点击【尝试小突破】';
 if(p.stg===3&&p.cult>=needOf(p))return '大境界壁垒已至——择路突破：人道稳、地道厚、天道险';

function autoTurn(){
 if(!G||!G.cb)return;
 if(G.ev||G.pick||G.tb||G.mr)return;
 const c=G.cb,p=G.c;
 const skills=getGfSkills(p);
 const cd=i=>(c.skillCd&&c.skillCd[i])||0;
 const usable=i=>p.mp>=Math.floor(skills[i].mp*((c&&c.mpX2)?2:1))&&cd(i)<=0;
 /* 低血治疗优先 */
 let hi=-1,hp2=0;
 skills.forEach((s2,i)=>{if(s2.type==='heal'&&usable(i)&&s2.healPct>hp2){hi=i;hp2=s2.healPct;}});
 if(hi>=0&&p.hp<p.hpM*0.45){useGfSkill(hi);return;}
 if(p.hp<p.hpM*0.18){cbFight('def');return;}
 if((c.dy||0)>=100){cbFight('dao');return;} /* 道韵满百：优先爆发 */
 {const ps=pactSpr(p);if(ps&&!(c.heCd>0)&&p.mp>=25&&c.e.hp>c.e.hpM*0.25){cbFight('hespr');return;}} /* 器灵合击 */ /* 最优倍率攻击技能 */
 let bi=-1,bm=0;
 skills.forEach((s2,i)=>{if((s2.type==='atk'||s2.type==='aoe')&&usable(i)){const eff=(s2.mul||1)*(s2.hits||1);if(eff>bm){bm=eff;bi=i;}}});
 if(bi>=0){useGfSkill(bi);return;}
 if(p.mp>=35&&(c.charge||0)<2){cbFight('chg');return;} /* 蓄势10+绝技25：不够放绝技就不白烧灵力 */
 cbFight('atk');
}

function alchRate(p){return Math.round(CL(52+p.wuT[1]*4+((p.awaken||[]).some(a=>a.startsWith('丹药'))?15:0)+p.att[2]*0.5+(p.wuT[1]>=3?10:0),25,95));}

function useHerb(n,k){const p=rd();for(let i=0;i<k;i++){const idx=p.herbs.findIndex(h=>h.n===n);if(idx<0)return false;p.herbs.splice(idx,1);}return true;}

function craftPill(i){
  const p=G.c,r=ALCH[i];if(!r)return;
  if(!Object.keys(r.need).every(k=>cntHerb(k)>=r.need[k])){toast('药材不足');render();return;}
  Object.keys(r.need).forEach(k=>useHerb(k,r.need[k]));
  if(!monthAct())return;
  if(D100()<=alchRate(p)){
   const yn=1+(D100()<8?1:0);
   addItem(r.n,yn);
   if(!p.knownRecipes.includes(r.n)){p.knownRecipes.push(r.n);say('你炼制【'+r.n+'】成功，彻悟了其中丹方奥义！','g');}
   say('<b class="lg-g">丹成！炉盖掀开，异香扑鼻——得【'+r.n+'】×'+yn+(yn>1?'（天成双丹！）':'')+'。</b>','g');
  }else{
   const dmg=Math.max(3,Math.floor(p.hpM*0.08));
   p.hp=Math.max(1,p.hp-dmg);
   /* 炸炉减痛：药力未散，大半材料退回 */
   let back=[];
   Object.keys(r.need).forEach(k=>{const backN=Math.ceil(r.need[k]/2);for(let n2=0;n2<backN;n2++)p.herbs.push({n:k,v:({'百草露':15,'赤芝':40,'百年野参':120,'雪魄莲':260,'千载空青':520,'九叶还魂草':900})[k]||50});back.push(k+'×'+backN);});
   if(p.wuT[1]>=10){Object.keys(r.need).forEach(k=>{for(let n2=0;n2<r.need[k];n2++)p.herbs.push({n:k,v:({'百草露':15,'赤芝':40,'百年野参':120,'雪魄莲':260,'千载空青':520,'九叶还魂草':900})[k]||50});});say('<b class="lg-r">炸炉！</b>火光冲天——但丹道通神，<b>药材竟丝毫无损</b>（气血-'+dmg+'）。','r');}
   else say('<b class="lg-r">炸炉！</b>火光冲天，你被气浪掀翻在地（气血-'+dmg+'）。所幸药力未散，收回'+back.join('、')+'。','r');
  }
  checkAuto();
}

/* 三连炉：丹道三重解锁——一月三炉，各炉独立判定 */
function craft3(i){
  const p=G.c,r=ALCH[i];if(!r)return;
  if(p.wuT[1]<3){toast('需丹道三重方可连炉');render();return;}
  let made=0,burst=0;
  for(let n=0;n<3;n++){
   if(!Object.keys(r.need).every(k=>cntHerb(k)>=r.need[k]))break;
   Object.keys(r.need).forEach(k=>useHerb(k,r.need[k]));
   if(D100()<=alchRate(p)){
    const yn=1+(D100()<8?1:0);
    addItem(r.n,yn);made+=yn;
    if(!p.knownRecipes.includes(r.n))p.knownRecipes.push(r.n);
   }else{
    burst++;
    const dmg=Math.max(3,Math.floor(p.hpM*0.08));
    p.hp=Math.max(1,p.hp-dmg);
    if(p.wuT[1]>=10)Object.keys(r.need).forEach(k=>{for(let n2=0;n2<r.need[k];n2++)p.herbs.push({n:k,v:({'百草露':15,'赤芝':40,'百年野参':120,'雪魄莲':260,'千载空青':520,'九叶还魂草':900})[k]||50});});
   }
  }
  if(!monthAct()){render();return;}
  say(made?('三炉连开，丹香满室——得【'+r.n+'】×'+made+(burst?'（炸炉'+burst+'次）':'')+'。'):('三炉俱炸，满屋焦糊。你顶着黑脸收拾残局（气血有损）。'),'g');
  checkAuto();
}

   if(old.spr){
    const os=old.spr;
    G.ev={theme:'bam',title:'旧器之灵 · '+os.n,
     body:'新器已成，旧器【'+old.n+'】灵光渐黯。器灵「'+os.n+'」浮出器身，静静望着你与新器——'+(os.lv>=3?'已化人形的'+(r.slot==='w'?'她':'他')+'眉目沉静':'那缕灵光微微颤动，似在等候')+'。何去何从？',
     opts:[
      {t:'引灵入新',d:'「'+os.n+'」迁入【'+it.n+'】 · 道行保留',fx:()=>{it.spr=os;os.pact=os.pact||0;
       say('你以本命真火引灵——「'+os.n+'」绕新器三匝，光华敛入其身。旧友重逢新器，此器自此有灵。','g');checkAuto();}},
      {t:'送别归山',d:'功德+3 · 器灵化光而去',fx:()=>{p.merit+=3;
       say('你朝旧器深深一揖：「同修多年，就此别过。」「'+os.n+'」化作一道流光，没入山岚深处——善缘一场，不虚此行（功德+3）。','g');checkAuto();}}]};
    render();return;
   }
  }
 }else{
  const dmg=Math.max(3,Math.floor(p.hpM*0.08));
  p.hp=Math.max(1,p.hp-dmg);
  /* 锻器减痛：矿料退回一半 */
  let back=[];
  Object.keys(r.need).forEach(k=>{const backN=Math.ceil(r.need[k]/2);for(let n2=0;n2<backN;n2++)addOre({n:k,v:({'玄铁':16,'赤铜':12,'精铁':35,'火云砂':42,'寒玉髓':95,'星辰砂':110,'天蚕丝':210,'雷罡铁':240,'太阴精':480,'天外陨金':520})[k]||50});back.push(k+'×'+backN);});
  say('<b class="lg-r">锻炉炸裂！</b>器胚在最后一淬时崩碎，烈焰燎伤了你的眉发（气血-'+dmg+'）。所幸矿料未毁大半，收回'+back.join('、')+'。','r');
 }
 checkAuto();

function refineEq(slot){

 const rf=it.rf||0;
 if(rf>=10){toast('已臻十转圆满');render();return;}
 const cost=SC(200)*(rf+1);
 if(p.stones<cost||p.ores.length<2){toast('需矿料×2与'+cost+'灵石');render();return;}
 if(!monthAct())return;
 p.ores.splice(0,2);p.stones-=cost;

 else{it.rf=Math.max(0,rf-1);say('<b class="lg-r">【精炼受挫】灵机冲撞器纹，【'+it.n+'】精炼跌回+'+it.rf+'。炉心清明者，再试便是。</b>','r');}

}

function sellOre(nm,all){

 for(let i=p.ores.length-1;i>=0;i--){
  if(p.ores[i].n!==nm)continue;
  sold++;sum+=Math.ceil(p.ores[i].v*Math.pow(1.9,p.rIdx)*mktMul(p));p.ores.splice(i,1);
  if(!all)break;

function wearEq(p,slot,n){

function mkEnemy(base,scale,boss){

   MOOKS[tier][RI(MOOKS[tier].length)];

  const rr=boss?CL(base+RI(3)-1,0,19):CL(base+(RI(10)<1?1:(RI(10)<3?-1:0)),0,19);
  const stg=RI(4);
  /* 阶段折算进战力：显示圆满就是圆满的实力 */
  const pw=PW[rr]*(0.92+stg*0.09)*(0.9+RI(2)*0.1)*scale*(1+REGIONS[G.c.region].e*0.06);
  const e={n:nm,r:rr,stg:stg,hp:pw*4,hpM:pw*4,pw:pw};
  if(boss){e.canAwk=true;e.boss=1;e.phase=1;if(D100()<55)e.sk=ENEMY_SK[RI(ENEMY_SK.length)];}
  return e;
}

const WUXING_KE={金:'木',木:'土',土:'水',水:'火',火:'金'};
/* 战场天象（R4）：随战斗随机生成，让九州地理真正参与每一战 */
const FIELDS=[
 {n:'雷泽',fx:'thunder',d:'紫雷低伏，雷系神通威能+25%'},
 {n:'烈焰谷',fx:'burn',d:'地火熏蒸，每回合双方气血-2%'},
 {n:'玄冰原',fx:'ice',d:'寒气砭骨，冰系首回合三成冻敌 · 遁走-15'},
 {n:'灵潮涌动',fx:'mana',d:'灵气充沛，技能耗灵-30%'},
 {n:'罡风隘口',fx:'wind',d:'罡风割面，双方攻击-10%'},
 {n:'厚土原',fx:'regen',d:'地气厚实，回复效果+30%'},
 {n:'镜面湖',fx:'crit',d:'灵光反射，暴击伤害+30%'},
 {n:'寻常山道',fx:null,d:'并无异象'}];
function wuxingKeMul(attackerEles,defenderEles){
  if(!attackerEles||!attackerEles.length||!defenderEles||!defenderEles.length)return 1;
  let ke=0,bei=0;
  attackerEles.forEach(a=>{
    const keTarget=WUXING_KE[a];
    if(keTarget&&defenderEles.includes(keTarget))ke++;
  });
  defenderEles.forEach(d=>{
    const keTarget=WUXING_KE[d];
    if(keTarget&&attackerEles.includes(keTarget))bei++;
  });
  if(ke>bei)return 1+0.2*(ke-bei);
  if(bei>ke)return 1-0.15*(bei-ke);
  return 1;
}
function startCombat(e){
  if(!e.eles){
    const allEles=['金','木','水','火','土','雷','风','冰'];
    const cnt=1+RI(3);
    e.eles=[];
    for(let i=0;i<cnt;i++){const el=allEles[RI(allEles.length)];if(!e.eles.includes(el))e.eles.push(el);}
  }
  G.cb={e:e,charge:0,guard:false,shield:false,calm:false,turn:0,eChg:0,dy:0,edy:0,log:['【遭遇】'+e.n+' 挡路！（'+RL[e.r].n+' '+STG[e.stg]+' · 灵根：'+(e.eles.join('')||'未知')+'）']};
  /* 战场天象：地理入战，八种地象各有利弊（R4） */
  const FD=FIELDS[RI(FIELDS.length)];
  G.cb.field=FD;
  if(FD.fx)G.cb.log.push('【战场】'+FD.n+'——'+FD.d+'。');
  /* 自动战斗默认开：强敌与剧情战随时可以亲手接管 */
  if(G.autoAll===undefined)G.autoAll=true;
  /* 境界碾压演算：战力两倍半于敌（约高一小境）的野生杂兵不再拖回合——袖袍一拂，尘埃落定 */

function resolveStrike(mode){
  const p=G.c,t=G.tb;let dmg=Math.round(40+PW[p.rIdx]*0.09); /* 雷威随境界水涨船高 */
  if(weOn('tianBian'))dmg=Math.round(dmg*1.25); /* R12 天道异变：雷劫+25% */
  const prep=t.prep||{items:[],helpers:[]};
  let usedItem=false;
  if(mode==='avoid'||mode==='ground'){
   if(prep.items.includes(mode)){
    prep.items=prep.items.filter(x=>x!==mode);
    if(mode==='avoid'){dmg=0;say('<b class="lg-g">避雷针引雷入地，毫发无伤！</b>','g');}
    else{dmg=Math.floor(dmg*0.5);say('<b class="lg-g">接地符发动，化解大半雷威！</b>','g');}
    usedItem=true;
   }
  }
  if(!usedItem){
   if(mode==='take'){say('你咬牙硬抗，紫雷贯体！','r');}
   else if(mode==='dodge'){
    const dodgeRate=CL(30+p.att[3]*3+((p.awaken||[]).some(a=>a.includes('遁'))?20:0),5,90);
    if(D100()<=dodgeRate){dmg=0;say('你身形如电，侧身避过雷峰！（遁速'+dodgeRate+'%）','g');}
    else{dmg=Math.floor(dmg*1.3);say('闪避不及，被雷尾扫中！（遁速'+dodgeRate+'%，失败）','r');}
    p.mp=Math.max(0,p.mp-Math.floor(dmg*0.4));
   }else if(mode==='attack'){
    const atkPower=power(p)*0.5;
    if(atkPower>=dmg){dmg=0;say('你以本命真元迎雷而上，竟将雷峰击碎！','g');}
    else{dmg=dmg-Math.floor(atkPower*0.5);say('你以攻对劫，真元与雷力相撞，余威仍伤及经脉。','r');}
    p.cult=Math.max(0,p.cult-Math.floor(needOf(p)*0.1));
    if(D100()<=30){const bonus=Math.floor(needOf(p)*0.15);p.cult=Math.min(needOf(p),p.cult+bonus);say('<b class="lg-g">反劫入体！雷力化作精纯修为灌入丹田（修为+'+fmtN(bonus)+'）！</b>','g');}
   }else if(mode==='gear'){
    const it=p.equip&&p.equip.a;
    if(it&&it.dur>0){const absorbCap=Math.round(it.b*20*PW[p.rIdx]/26);const absorbed=Math.min(dmg,absorbCap);dmg-=absorbed;it.dur=Math.max(0,it.dur-Math.ceil(absorbed/10));say('护镜清光大盛，替你挡下'+fmtN(absorbed)+'点雷威（耐久-'+Math.ceil(absorbed/10)+'）。','bam');if(it.dur===0)say('<b class="lg-r">护镜灵光溃散，迸作齑粉！</b>','r');}
    else{say('护镜已毁，无可抵挡！','r');}
   }
  }
  if(mode==='merit'&&p.merit>=6){p.merit-=6;dmg=0;say('金光垂落，雷音化作鸣蝉，无声消散。（功德-6）','g');}
  if(prep.items.includes('pill')){p.hp=Math.max(Math.floor(p.hpM*0.1),p.hp);prep.items=prep.items.filter(x=>x!=='pill');say('<b class="lg-g">护心丹炼化，气血底线护住！</b>','g');}
  if(prep.helpers.includes('beast')){dmg=Math.floor(dmg*0.85);say('通灵灵兽嘶吼扑出，替你吞掉一缕雷威（伤害-15%）。','g');}
  if(prep.helpers.includes('disciple')){dmg=Math.floor(dmg*0.9);say('成就徒弟舍身相护，雷威稍减（伤害-10%）。','g');}
  if(prep.helpers.includes('grandd')){dmg=Math.floor(dmg*0.92);say('徒孙率族中弟子布下小周天阵，替你分去一缕雷威（伤害-8%）。','g');}
  if(prep.helpers.includes('spouse')){
   const healAmt=Math.floor(p.hpM*0.1);
   p.hp=CL(p.hp+healAmt,0,p.hpM);
   say('道侣护法，真元回馈（气血+'+fmtN(healAmt)+'）。','g');
  }
  if(mode==='take'&&dmg>0){p.atkBonus=(p.atkBonus||0)+0.02;say('劫力淬炼筋骨，攻击永久+2%！','g');}
  if(dmg>0){p.hp-=dmg;say('紫雷贯体，痛彻骨髓！气血 -'+fmtN(dmg)+'。','r');wdBridge('vibrate',60);}
  t.round++;
  if(p.hp<=0){
   G.tb=null;
   if(t.asc){ascFail('雷劫将你轰落云端。');return;} /* 试炼雷关陨落：走铩羽，不走凡劫三选一 */
   if(p.merit>=12){shiJie();return;}
   if(p.karma>=15){moDuo(0);return;}
   tribFailChoice();return;
  }
  t.hitsLeft--;
  if(t.hitsLeft>0){triRender();save();return;}
  G.tb=null;
  if(t.asc){ /* R20 试炼雷关：不破境，只记评定 */
   const hr=p.hp/p.hpM;
   const bonus=(hr>0.8?15:hr<0.2?5:10)+(t.round<=2?5:0);
   if(G.asc){G.asc.score+=bonus;say('<b class="lg-g">【试炼·雷关】雷威渡毕——评定+'+bonus+'。</b>','g');ascNext();}
   else finishBig(t.bonus,98,t.round);
   return;
  }
  const hpRatio=p.hp/p.hpM;
  if(hpRatio>0.8){
   /* 完美渡劫：天道嘉许，突破必成——表现即成败，不再另掷骰 */
   say('<b class="lg-g">【完美渡劫】气血充盈，雷劫尽淬体魄——天道嘉许，大道水到渠成！</b>','g');
   p.merit+=3;
   finishBig(t.bonus,100,t.round);
   return;
  }else if(hpRatio<0.2){
   say('<b class="lg-r">【狼狈渡劫】气血几近枯竭，雷劫在神魂上烙下劫痕——修炼-10%，攻击+5%。</b>','r');
   p.flags.tribScar=1;
   finishBig(t.bonus,t.base,t.round);
   return;
  }else{
   say('<span class="lg-g">【渡劫功成】雷霆入体，气机圆融——突破把握大增。</span>');
   finishBig(t.bonus,t.base+15,t.round);
   return;
  }
}

function finishBig(path,rate,hits){

   p.hpM=Math.round(p.hpM*mul);p.mpM=Math.round(p.mpM*mul);p.hp=p.hpM;p.mp=p.mpM;
   if(path!=='H')for(let i=0;i<6;i++)p.att[i]=CL(p.att[i]+(path==='T'?2:1),1,20);
   const newLife=RL[p.rIdx].life;

   if(tierOf(p.rIdx)!==wasTier){

   }

   /* 混元之上不再强制飞升——九重试炼由玩家亲启（R20） */
   afterAction();showUnlocks(p);grantAwaken();resetTribPrep();return;
  }
 if(p.karma>=15&&p.merit<10&&D100()<=50){moDuo(1);return;}
 /* 首败护道：生平第一次大突破失利，天道不予苛责 */
 if(!((p.flags||{}).firstFail)){

  p.cult=Math.floor(needOf(p)*0.8);p.hp=Math.max(5,p.hp-15);
  say('<b class="lg-g">【初败护道】大道留一线——生平首次冲关失利，天道不予苛责：修为保留八成，未留暗伤。</b><br><small>（仅护冲关失利——寿元耗尽与渡劫身死，不在护道之列）</small>','g');
  resetTribPrep();afterAction();return;
 }

  if(p.flags.moXiu)W.push({id:'mo',txt:'入魔之名，无人替你洗清'});
  L.wishes=W.slice(0,3);

 }catch(e){return null;}

/* ===================== 无为而治 · 自动修行（爽+轻松的核心：一键挂机，喜事即停） ===================== */
function autoCult(mo){
 const p=G.c,startY=p.y,startM=p.m,sc=p.cult;
 let brk=0,burst=0;
 for(let i=0;i<mo;i++){
  if(G.ev||G.cb||G.mr||G.tb||G.pick)break; /* 天降喜事：停下看你 */
  if(p.cult>=needOf(p)&&p.stg===3){say('<b style="color:#D4A017">无为而治：大境界壁垒已至——人道、地道、天道，这一步须你亲自择路。</b>','y');break;}
  if(p.cult>=needOf(p)&&p.stg<3){ /* 气满自动小突破 */
   const wasStg=p.stg;btSmall();
   if(p.stg>wasStg)brk++;
   if(G.ev||G.cb||!G)break;
   continue;
  }
  let g=cultGain(p,false)*(p.m===6?1.25:1);
  if(D100()<=12){g*=4;burst++;}
  addCult(p,g);
  p.hp=CL(p.hp+4,0,p.hpM);p.mp=CL(p.mp+5,0,p.mpM);
  if(!monthTick(p))return;
  if((p.y*12+p.m)%12===0)p.wu=Math.min(99,p.wu+1);
  if(tryEpiphany(p,0.0015)){say('关中顿悟，破关而出！','g');break;}
  if(D100()<=2){p.att[4]=Math.max(1,p.att[4]-1);say('心魔忽至：旧日懊悔立于识海。你咬牙镇压。（道心-1）','p');break;}
 }
 if(!G){return;}
 say('<span class="lg-s">【无为而治】自行修行 '+((p.y-startY)*12+(p.m-startM))+' 月 · 修为 '+Math.floor(sc)+' → '+Math.floor(p.cult)+'（'+((p.cult-sc)>=0?'+':'')+'本境+'+((p.cult-sc)/Math.max(1,needOf(p))*100).toFixed(0)+'%）'+(brk?' · 自动突破'+brk+'次':'')+(burst?' · 气机鼓荡'+burst+'次':'')+'</span>','s');
 checkAuto();
}

function closedDoorsN(mo,side){
 const p=G.c,startY=p.y,startM=p.m,sc=p.cult;
 side=side||G.closedSide||'纯修';
 for(let i=0;i<mo;i++){
  addCult(p,cultGain(p,true)*(p.m===6?1.25:1)*(side==='纯修'?1.1:0.9)); /* 纯修+10% · 副业分心-10% */
  p.hp=CL(p.hp+4,0,p.hpM);p.mp=CL(p.mp+5,0,p.mpM);
  if(!monthTick(p))return;
  if((p.y*12+p.m)%12===0)p.wu=Math.min(99,p.wu+1); /* 每年悟道 */
  if(i%3===2){ /* 闭关副业：每季一收（3月） */
   try{
    if(side==='炼丹'){if(cntHerb('百草露')>=2&&D100()<=alchRate(p)){useHerb('百草露',2);addItem('聚气丹',1);say('<span class="lg-g">【闭关副业·丹炉】凝气成丹，得【聚气丹】×1。</span>');}}
    else if(side==='研读'){const ids=getGfSkills(p).map(s2=>Object.keys(SKILL_LIB).find(k=>SKILL_LIB[k]===s2)).filter(Boolean);if(ids.length){const sid=ids[RI(ids.length)];addSkillExp(p,sid,25);say('<span class="lg-s">【闭关副业·研读】'+SKILL_LIB[sid].n+'熟练大进。</span>');}}
    else if(side==='采药'){const h2=pickHerb(REGIONS[p.region].e);addHerb(h2);say('<span class="lg-s">【闭关副业·采药】崖畔采得【'+h2.n+'】。</span>');}
   }catch(e){}
  }
  /* R11 关中百态：每半年一掷，闭关有了冷暖 */
  if(i%6===5&&D100()<=14){
   const ev=SECLIFE[RI(SECLIFE.length)];
   const res=ev.fx(p);
   say('<span style="color:#b25984">【关中百态·'+ev.t+'】'+ev.d+'（'+res+'）</span>','p');
  }
  if(tryEpiphany(p,0.0015)){say('关中顿悟，破关而出！','g');break;} // 闭关顿悟概率0.15%/月
  if(D100()<=2){p.att[4]=Math.max(1,p.att[4]-1);say('心魔忽至：旧日懊悔立于识海。你咬牙镇压，一夜无眠。（道心-1）','p');break;}
  if(p.cult>=needOf(p)){say('水到渠成——关中自查，气息已圆满。适时破关而出！','y');break;}
 }
 say('<span class="lg-s">闭关 '+((p.y-startY)*12+(p.m-startM))+' 月 · 修为 '+Math.floor(sc)+' → '+Math.floor(p.cult)+'</span>','s');
 checkAuto();
}

function qiyuEvent(){
 const p=G.c;
 const tier=Math.min(3,tierOf(p.rIdx));
 let pool=QIYU[tier];
 /* 轮回回响：转世≥1者，历练有几率撞见前世残影 */
 if(LEGACY()>=1&&D100()<=18){
  const ng=QIYU_NG[RI(QIYU_NG.length)];
  const res=ng.f(p);
  say('<b style="color:#8B6FA8">【轮回回响·'+ng.t+'】</b>'+ng.d+'（'+res+'）','p');
  markDeed('轮回回响·'+ng.t);
  afterAction();return;
 }
 /* 链式优先：前世机缘的回响（40%优先判定） */
 let chain=null;
 if(D100()<=40)chain=QIYU_CHAIN.find(c=>((p.flags||{})[c.need]===1)&&!(p.flags||{})[c.need+'D']&&c.tier===tier);
 let ev,res;
 if(chain){
  p.flags=p.flags||{};p.flags[chain.need+'D']=1;
  res=chain.f(p);
  say('<b style="color:#D4A017">【奇遇·'+chain.t+'】</b>'+chain.d+'（'+res+'）','g');
  markDeed('链式奇遇·'+chain.t);
 }else{
  ev=pool[RI(pool.length)];
  res=ev.f(p);
  if(ev.mark){p.flags=p.flags||{};p.flags[ev.mark]=1;}
  say('<b style="color:#D4A017">【奇遇·'+ev.t+'】</b>'+ev.d+'（'+res+'）','g');
  markDeed('奇遇·'+ev.t);
 }
 afterAction();
}

function quitiN(mo){
 const p=G.c;
 const stExp=Math.floor(p.bodyExp||0),stLv=bodyLv(p);
 let brk=0;
 for(let i=0;i<mo;i++){
  p.bodyExp=(p.bodyExp||0)+Math.floor(bodyGain(p));
  if(bodyLv(p)===7&&(p.bodyExp||0)>=2000&&(p.bodyJin||0)<30){
   p.bodyExp-=2000;p.bodyJin=(p.bodyJin||0)+1;p.hpM=Math.round(p.hpM*1.03);p.hp=p.hpM;
   say('<b class="lg-g">【金身淬炼·第'+p.bodyJin+'层】不灭金身愈凝愈坚——气血×1.03 · 最终减伤+0.5%。</b>','g');
  }
  while(bodyLv(p)+1<BODY_REALMS.length&&(p.bodyExp||0)>=BODY_REALMS[bodyLv(p)+1].need){
   p.bodyExp-=BODY_REALMS[bodyLv(p)+1].need;p.bodyLv++;
   const R=BODY_REALMS[p.bodyLv];
   p.hpM=Math.round(p.hpM*BODY_HP_MUL[p.bodyLv]);p.hp=p.hpM;
   if(p.bodyLv===2){p.hpM=Math.round(p.hpM*1.05);p.hp=p.hpM;}
   say('<b class="lg-g">【炼体突破】皮开肉绽中血肉新生，你踏入「'+R.n+'」！气血上限×'+BODY_HP_MUL[p.bodyLv]+' · 战力×'+R.pw.toFixed(2)+(BODY_PASSIVE[p.bodyLv]?' · <b>'+BODY_PASSIVE[p.bodyLv]+'</b>':'')+'（'+R.d+'）</b>','g');
   markDeed('炼体突破·'+R.n);p.merit+=1;brk++;
  }
  if(!monthTick(p))return;
 }
 say('<span class="lg-s">淬体 '+mo+' 月 · 突破'+brk+'次 · 体魄 '+stExp+' → '+Math.floor(p.bodyExp||0)+'</span>','s');
 checkAuto();
}

function feedBeast(){
 const p=G.c;if(!p||!p.beast){render();return;}
 let used;
 const fc=SC(50);
 if(p.herbs.length){let mi=0;for(let i=1;i<p.herbs.length;i++){if(p.herbs[i].v<p.herbs[mi].v)mi=i;}const h=p.herbs.splice(mi,1)[0];used='灵草【'+h.n+'】';}
 else if(p.stones>=fc){p.stones-=fc;used=fc+' 灵石';}
 else{toast('灵草灵石皆无，拿什么喂它？');render();return;}
 const gain=2+((p.awaken||[]).some(a=>a.startsWith('灵兽'))?1:0); /* 喂养收益×2：24次打卡改为12次有质量的陪伴 */
 p.beast.exp+=gain;
 say(p.beast.n+'埋头吃得香甜（'+used+'）。亲密度 +'+gain+'。','g');
 if(p.beast.lv<3&&p.beast.exp>=(p.beast.lv+1)*4){
  p.beast.exp=0;p.beast.lv++;
  p.hpM=Math.floor(p.hpM*1.05);p.hp=p.hpM;
  say('<b class="lg-g">'+p.beast.n+'蜕形而长——如今已是'+['','成长','成年','通灵'][p.beast.lv]+'之姿！（协战之力更胜 · 气血上限+5%）</b>','g');
 }
 if(p.beast.lv>=3)p.beast.exp=Math.min(p.beast.exp,99);
 afterAction();
}

   body:'谢无咎灌了一口烈酒，袖上的血迹还没干：「血魔宗——外人说是魔窟。可你知道吗，这宗门初创时，是为庇护那些被正道不容的人。」',
   opts:[{t:'倾听',d:'悟道点+1',fx:p=>{p.wu++;say('谢无咎讲了很多，关于旧主的理想、宗门的兴衰。你听到了一个与传说不同的血魔宗。','p');afterAction();}},
    {t:'「往事是往事」',d:'道心+1',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);say('谢无咎沉默半晌，点头：「你说得对。人不能活在旧日影子里。」','p');afterAction();}}]},
  {th:40,flag:'npc_swj_2',title:'正邪之辩',theme:'red',
   body:'谢无咎忽然拔剑指着你：「你觉得我是好人还是坏人？——说真话。」',
   opts:[{t:'「亦正亦邪」',d:'业力+2 · 好感+5',fx:p=>{p.karma+=2;affAdd('swj',5);say('谢无咎收剑大笑：「哈！总算有个不装模作样的。」他拍你肩膀，力道大得像在打架。','g');afterAction();}},
    {t:'「正邪在心」',d:'功德+2 · 道心+1',fx:p=>{p.merit+=2;p.att[4]=CL(p.att[4]+1,1,20);say('谢无咎怔住，半晌才低声道：「你这说法……我在血魔宗从没听人讲过。」','p');afterAction();}}]},
  {th:60,flag:'npc_swj_3',title:'暗夜同行',theme:'red',
   body:'谢无咎在夜色中拦住你的去路：「前面那座废墟里有我要找的东西——你陪我走一趟？」',
   opts:[{t:'并肩而入',d:'遭遇战 · 好感+3',fx:p=>{affAdd('swj',3);say('你们并肩踏入废墟。空气中有血腥味——不是新的。','p');const e=mkEnemy(p.rIdx,1.1,false);e.n='废墟守灵';startCombat(e);return;}},
    {t:'独行更自在',d:'修为+少量',fx:p=>{addCult(p,needOf(p)*0.08);say('你摇头。谢无咎也不勉强，独自没入黑暗——走了两步回头：「改天请你喝酒。」','p');afterAction();}}]},
  {th:80,flag:'npc_swj_4',title:'魔道亦有道',theme:'red',
   body:'谢无咎将一枚漆黑的玉简递来，上面血气隐隐：「血魔宗秘传——凝结了一代代宗主的心血。我不勉强你，但如果你愿意……」',
   opts:[{t:'参悟秘传',d:'50%觉醒「血魔灌体」',fx:p=>{if(D100()<50){const aw='血魔灌体';p.awaken.push(aw);applyAwakenEffect(p,aw);say('<b style="color:#7a5fa8">【逆天改命·血魔灌体】血脉深处有东西苏醒——你的气血、灵力上限各增两成。</b>','g');p.hpM=Math.floor(p.hpM*1.2);p.mpM=Math.floor(p.mpM*1.2);p.hp=p.hpM;p.mp=p.mpM;}else{say('你参悟了半夜，终究与此法无缘。谢无咎耸肩：「也罢，命里有时终须有。」','s');}afterAction();}},
    {t:'婉拒·「我有我的道」',d:'道心+3 · 功德+3',fx:p=>{p.att[4]=CL(p.att[4]+3,1,20);p.merit+=3;say('谢无咎收好玉简，嘴上说着「无妨」，但眼中有难得的敬重。','g');afterAction();}}]}],
 bns:[
  {th:20,flag:'npc_bns_1',title:'雪族礼仪',theme:'vio',
   body:'白凝霜在雪地里画了一个纹样：「这是雪族的迎宾印——你既然来了北原，当知此地规矩。」',
   opts:[{t:'认真学习',d:'悟道点+1',fx:p=>{p.wu++;say('雪族礼仪繁复而庄重。白凝霜一板一眼地教，你一板一眼地学。末了她微微颔首：「还算端正。」','p');afterAction();}},
    {t:'礼尚往来',d:'好感+3',fx:p=>{affAdd('bns',3);say('你回以宗门礼仪。白凝霜眼中闪过一丝意外——随即别过脸去，但耳尖微红。','p');afterAction();}}]},
  {th:40,flag:'npc_bns_2',title:'冰心玉骨',theme:'vio',
   body:'白凝霜带你至冰窟深处：「雪族秘传——冰心诀。修至深处，万邪不侵。你若有心……我可以教你入门。」',
   opts:[{t:'参悟冰心诀',d:'资质+1 · 灵力上限+30',fx:p=>{p.att[0]=CL(p.att[0]+1,1,20);p.mpM+=30;p.mp=p.mpM;say('冰窟中寒气刺骨，你静坐三日，灵台渐如冰湖。白凝霜的目光难得柔和了几分。','g');afterAction();}},
    {t:'「寒意太重」',d:'道心+1 · 好感+2',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);affAdd('bns',2);say('白凝霜收回手，淡淡道：「也罢——不是所有人适合走这条路。」但她没有不高兴。','p');afterAction();}}]},
  {th:60,flag:'npc_bns_3',title:'北原风雪',theme:'vio',
   body:'一场突如其来的暴风雪封了归路。白凝霜立在风雪中，衣袂翻飞如白蝶：「不必慌——跟我走。」',
   opts:[{t:'追随她穿过风雪',d:'声望+5 · 好感+5',fx:p=>{p.rep+=5;affAdd('bns',5);say('她在风雪中的身姿从容如行过庭院。你咬牙跟上，终于抵达一处雪洞。她生火，你添柴——那一夜很安静。','g');afterAction();}},
    {t:'反过来护住她',d:'功德+3 · 好感+3',fx:p=>{p.merit+=3;affAdd('bns',3);say('你挡在她身前，以灵力撑开风雪。白凝霜沉默半晌，轻声道：「……你倒是头一个。」','g');afterAction();}}]},
  {th:80,flag:'npc_bns_4',title:'冰消雪融',theme:'vio',
   body:'白凝霜罕见地卸下冷淡，递来一枚冰蓝色的玉佩：「这是雪族圣女的信物。你若收下——就别想走了。」',
   opts:[{t:'「我哪里也不去」',d:'道心+2 · 好感+5',fx:p=>{p.att[4]=CL(p.att[4]+2,1,20);affAdd('bns',5);say('白凝霜怔了片刻——然后，你第一次看到她笑了。不是社交的笑，是冰消雪融的那种。','g');afterAction();}},
    {t:'「此玉太重」',d:'功德+5 · 好感+2',fx:p=>{p.merit+=5;affAdd('bns',2);say('白凝霜收回玉佩，目光微垂：「……我明白。」她转身入雪，但那背影——你看得出来，她在等。','p');afterAction();}}]}],
 mc:[
  {th:20,flag:'npc_mc_1',title:'妖山来使',theme:'bam',
   body:'墨尘从怀里掏出一封画满兽纹的信：「老家来人了——说妖山有变。你……要不要听？」',
   opts:[{t:'好奇倾听',d:'悟道点+1',fx:p=>{p.wu++;say('墨尘讲起妖山的格局——三族并立、妖王轮替。你听得入神，对妖族的理解又深了一层。','p');afterAction();}},
    {t:'「与你何干」',d:'道心+1',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);say('墨尘撇嘴：「也对——我现在又不是妖王。」但他的尾巴（不可见的）似乎耷拉了一点。','p');afterAction();}}]},
  {th:40,flag:'npc_mc_2',title:'半妖之困',theme:'bam',
   body:'墨尘忽然没头没脑地问了一句：「你有没有那种……哪边都不算自己人的感觉？」',
   opts:[{t:'「我懂」',d:'好感+5 · 道心+1',fx:p=>{affAdd('mc',5);p.att[4]=CL(p.att[4]+1,1,20);say('墨尘看着你，眼底罕见地没了傲娇的壳。半晌他别过脸去：「……算了，不说了。」但他明显松了口气。','g');afterAction();}},
    {t:'「你就是你」',d:'好感+3 · 资质+1',fx:p=>{affAdd('mc',3);p.att[0]=CL(p.att[0]+1,1,20);say('墨尘愣了一下——随即噗嗤笑出声：「你这人——比我想的靠谱。」','g');afterAction();}}]},
  {th:60,flag:'npc_mc_3',title:'化形之秘',theme:'bam',
   body:'墨尘在你面前展示了妖族化形的完整过程——从兽形到人形，骨肉重组，灵气化为皮囊。',
   opts:[{t:'观摩参悟',d:'气血上限+10%',fx:p=>{p.hpM=Math.floor(p.hpM*1.1);p.hp=p.hpM;say('化形之术涉及肉身本源。你参悟了一番，气血上限竟有所增长。墨尘得意地叉腰：「怎样？妖族的东西不差吧？」','g');afterAction();}},
    {t:'「不必了」',d:'功德+2 · 好感+2',fx:p=>{p.merit+=2;affAdd('mc',2);say('墨尘收了术法，嘴上不在乎，但第二天送了三枚灵果到你洞府。','g');afterAction();}}]},
  {th:80,flag:'npc_mc_4',title:'妖王遗物',theme:'bam',
   body:'墨尘双手捧着一枚散发着蛮荒气息的珠子：「这是老妖王留下的——我留它没用。给你。」',
   opts:[{t:'收下',d:'天材地宝×1 · 好感+3',fx:p=>{addItem('天材地宝',1);affAdd('mc',3);say('珠子入手沉甸甸的，内有磅礴妖气。墨尘一脸「你赚了」的表情。','g');afterAction();}},
    {t:'「这是你的根基」',d:'功德+5 · 好感+5',fx:p=>{p.merit+=5;affAdd('mc',5);say('墨尘睁大眼看你——半晌，把珠子收回怀里，声音发颤：「……行。那就还我收着——但你也别忘了我。」','g');afterAction();}}]}],
 lqq:[
  {th:20,flag:'npc_lqq_1',title:'合欢旧事',theme:'pink',
   body:'洛浅浅抱着蜜饯罐子，讲起合欢宗的旧事——门派的勾心斗角、师姐们的争风吃醋，被她说得活灵活现。',
   opts:[{t:'捧场大笑',d:'好感+3',fx:p=>{affAdd('lqq',3);say('你笑得前仰后合，洛浅浅也跟着笑——她说着说着自己都忘了讲到哪了。','g');afterAction();}},
    {t:'淡然处之',d:'道心+1',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);say('洛浅浅看你没什么反应，悻悻道：「你这个人——闷死了。」但还是坐在你旁边不肯走。','p');afterAction();}}]},
  {th:40,flag:'npc_lqq_2',title:'花灯之约',theme:'pink',
   body:'洛浅浅不知从哪弄了两盏花灯：「今夜坊中有花灯会——就咱俩，去不去？」',
   opts:[{t:'同去',d:'好感+5 · 声望+3',fx:p=>{affAdd('lqq',5);p.rep+=3;say('花灯映在洛浅浅眼里，碎成一片星河。她笑着拽你穿过人群——那一夜，连空气都是甜的。','g');afterAction();}},
    {t:'推辞',d:'好感-2',fx:p=>{affAdd('lqq',-2);say('洛浅浅扁嘴：「好吧好吧——你忙你的。」她提着花灯独自去了，影子拖得很长。','p');afterAction();}}]},
  {th:60,flag:'npc_lqq_3',title:'心事渐露',theme:'pink',
   body:'夜深了。洛浅浅忽然安静下来，抱膝望着月亮：「我其实……怕一个人待着。怕得厉害。」',
   opts:[{t:'安静地陪她',d:'功德+2 · 好感+5',fx:p=>{p.merit+=2;affAdd('lqq',5);say('你什么都没说，只是在她身边坐下。过了很久，她靠过来，额头抵着你的肩膀。「……谢谢。」声音轻得像风。','g');afterAction();}},
    {t:'「修炼可解孤独」',d:'悟道点+1',fx:p=>{p.wu++;say('洛浅浅愣了一下——随即笑了，有点苦：「你说的对。但知道和做到之间，隔着一整个寂寞。」','p');afterAction();}}]},
{th:80,flag:'npc_lqq_4',title:'以心相托',theme:'pink',
    body:'洛浅浅递来一卷泛着淡淡绯光的经文：「合欢宗秘传——双修心法。如果……如果你愿意的话。」她难得地脸红了。',
    opts:[{t:'郑重接过',d:'50%觉醒「合欢双修」',fx:p=>{if(D100()<50){const aw='合欢双修';p.awaken.push(aw);p.charmBonus=Math.max(p.charmBonus,1.3);say('<b style="color:#7a5fa8">【逆天改命·合欢双修】好感收益+30%。洛浅浅的眼里满是欢喜。</b>','g');}else{say('你参悟了心法，但终究未能觉醒。洛浅浅安慰道：「不急——来日方长。」','s');}afterAction();}},
     {t:'「心意我领了」',d:'功德+3 · 好感+3',fx:p=>{p.merit+=3;affAdd('lqq',3);say('洛浅浅收好心法，嘴上说着「无妨」，但眼眶红了一圈——不是伤心，是另一种。','g');afterAction();}}]}],
 hy:[
  {th:20,flag:'npc_hy_1',title:'凤翎之试',theme:'bam',
   body:'红玉斜倚在万妖山的赤枫树上打量你：「人族里胆敢直视本姑娘的，不多。接我三根凤翎不烧着衣角，便有话说。」',
   opts:[{t:'坦然受试',d:'好感+4',fx:p=>{affAdd('hy',4);say('凤翎擦着衣袂燎出焦痕，你连眼都没眨。红玉收起团扇：「有点意思。」（好感+4）','g');afterAction();}},
    {t:'借火势卸力',d:'好感+3 · 悟道点+1',fx:p=>{affAdd('hy',3);p.wu++;say('你借她的火势卷起一阵旋风，凤翎尽偏。红玉挑眉：「倒会偷师。」（好感+3 · 悟道点+1）','g');afterAction();}}]},
  {th:40,flag:'npc_hy_2',title:'妖王寿宴',theme:'bam',
   body:'红玉丢来一枚请柬：「父王寿宴，缺个会讲人间故事的说客。讲得好，赏；讲得无聊——扔下去喂雕。」',
   opts:[{t:'登台说书',d:'好感+5 · 灵石',fx:p=>{affAdd('hy',5);moneyGet(p,300);say('你把人间烟火讲成了大妖也懂的道理，满堂妖修举杯。红玉笑弯了眼：「赏你的，别嫌少。」（好感+5 · 灵石+300）','g');afterAction();}},
    {t:'婉言推辞',d:'道心+1',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);say('「妖王座前，不敢卖弄。」红玉耸耸肩，自己替你把场子圆了。（道心+1）','p');afterAction();}}]},
  {th:60,flag:'npc_hy_3',title:'凤火焚林',theme:'bam',
   body:'南疆山火连绵。红玉立在火线前，声音罕见地低：「这片林子，是母亲化凤前亲手栽的。人族的水法，压得住吗？」',
   opts:[{t:'与她并肩救林',d:'好感+6 · 功德+3',fx:p=>{affAdd('hy',6);p.merit+=3;say('你引水诀开渠，她以凤羽拨火——天明时林子保住了七成。她望着焦土轻声说：「……谢了。」（好感+6 · 功德+3）','g');afterAction();}},
    {t:'直言水法难压',d:'功德+2 · 好感+2',fx:p=>{p.merit+=2;affAdd('hy',2);say('「压不住，但能救一半。」她沉默良久：「……你这人，倒是不会说谎。」（功德+2 · 好感+2）','p');afterAction();}}]},
  {th:80,flag:'npc_hy_4',title:'凤翎认主',theme:'bam',
   body:'红玉将一根流转着赤金火焰的翎羽放进你手里：「本姑娘的凤翎，认主不认理。往后你若有难，烧了它——我就当不知道什么叫人妖殊途。」',
   opts:[{t:'郑重收下',d:'天材地宝×1 · 好感+4',fx:p=>{addItem('天材地宝',1);affAdd('hy',4);say('翎羽入怀，暖如心跳。你初次明白：妖的看重，比人族的盟书更重。（好感+4 · 天材地宝×1）','g');afterAction();}},
    {t:'「太贵重了」',d:'功德+3 · 好感+3',fx:p=>{p.merit+=3;affAdd('hy',3);say('她把翎羽硬塞回你手里，叉腰瞪眼：「本姑娘给的东西，没有收回的道理！」（功德+3 · 好感+3）','g');afterAction();}}]}],
 qy:[
  {th:20,flag:'npc_qy_1',title:'剑阁问剑',theme:'blue',
   body:'青衣负手立于断剑碑林之前，眼皮都未抬：「剑阁一脉，只看剑，不看人。一剑。」',
   opts:[{t:'全力一剑',d:'好感+4',fx:p=>{affAdd('qy',4);say('你倾尽所学的这一剑，让他的目光第一次落在你身上，停了三息。「……尚可。」（好感+4）','g');afterAction();}},
    {t:'收剑不出',d:'道心+2',fx:p=>{p.att[4]=CL(p.att[4]+2,1,20);say('「晚辈剑心未定，不敢在碑林前污了剑。」青衣的眸光动了一下：「知道「未定」，便还有救。」（道心+2）','p');afterAction();}}]},
  {th:40,flag:'npc_qy_2',title:'断剑之谜',theme:'blue',
   body:'青衣递给你半截锈剑：「百年前有位剑仙在此败亡，剑断人亡。你看看——他败在哪一式？」',
   opts:[{t:'细参断口',d:'悟道点+2',fx:p=>{p.wu+=2;say('断口斜三分，是自乱剑序。你说了见解，他久久不语，末了道：「百年了，你是第二个看出来的。」（悟道点+2）','g');afterAction();}},
    {t:'「胜败皆常」',d:'道心+1 · 好感+2',fx:p=>{p.att[4]=CL(p.att[4]+1,1,20);affAdd('qy',2);say('「剑仙亦人，何胜何败。」他难得地颔首：「看得开，也是剑。」（道心+1 · 好感+2）','p');afterAction();}}]},
  {th:60,flag:'npc_qy_3',title:'雪夜论剑',theme:'blue',
   body:'大雪封山。青衣忽然拔剑，剑光如雪线横江：「陪我走完这一路。败了，就留在雪里；赢了——我有一物相授。」',
   opts:[{t:'拔剑应战',d:'好感+5 · 修为大进',fx:p=>{affAdd('qy',5);addCult(p,needOf(p)*0.15);say('雪落了一夜，剑走了三百合。你败了半招——却摸到了剑仙一脉的门槛。他收剑：「留你性命，也留你道。」（好感+5 · 修为大进）','g');afterAction();}},
    {t:'请他先出三剑',d:'悟道点+1 · 好感+3',fx:p=>{p.wu++;affAdd('qy',3);say('你不接招，只拆招。三剑过后他收剑入鞘：「以静制动……有点意思。」（悟道点+1 · 好感+3）','p');afterAction();}}]},
  {th:80,flag:'npc_qy_4',title:'剑阁之心',theme:'blue',
   body:'青衣掌中托着一枚古旧的剑形令牌：「剑阁千载，从不外授令牌。拿着它——往后你便是剑阁的客卿，诛仙剑引，也可来参详。」',
   opts:[{t:'双手接过',d:'好感+5 · 声望+10',fx:p=>{affAdd('qy',5);p.rep=(p.rep||0)+10;say('令牌入手沉如山岳。自此九州剑修见了你，都要唤一声「客卿」。（好感+5 · 声望+10）','g');afterAction();}},

function tryNpcEvent(){
 const p=G.c;if(!G||G.cb||G.ev||G.tb||G.pick)return false;
 for(const id in NPC_CHAINS){
  const af=p.rel[id]||0;
  for(const ch of NPC_CHAINS[id]){
   if(af>=ch.th&&!p.flags[ch.flag]){
    p.flags[ch.flag]=1;
    const n=NPCS.find(x=>x.id===id);
    G.ev={theme:ch.theme,title:ch.title+' · '+n.n,
     body:ch.body,opts:ch.opts.map(o=>({t:o.t,d:o.d,fx:()=>{o.fx(p);}}))};
    render();return true;
   }
  }
 }
 return false;
}

function btSmall(){
  const p=G.c;if(p.cult<needOf(p))return;
  const rate=CL(62+p.att[4]*2.4+(p.m===10?8:0),50,95);
  if(!monthAct())return;
  if(D100()<=rate){
   p.stg++;p.cult=0;p.hpM=Math.round(p.hpM*1.02);p.mpM=Math.round(p.mpM*1.02);p.hp=p.hpM;p.mp=p.mpM;
   const lifeAdd=2+p.stg;
   p.lifeBonus=(p.lifeBonus||0)+lifeAdd;
   say('<b class="lg-g">瓶颈应声而碎！晋升 '+RL[p.rIdx].n+' · '+STG[p.stg]+'，气血灵力上限微增（×1.02），寿元增 '+lifeAdd+' 年。</b>','g');
   if(D100()<=30){p.wu++;say('破境之际灵台清明，悟道点+1。','g');}
  }else{
   p.cult=Math.floor(needOf(p)*0.85);p.hp=Math.max(5,p.hp-15);
   say('气机一滞，逆转反噬，喉头一甜。<b>冲击失败</b>——所幸道基稳固，修为仅跌回八成半。','r');
  }
  checkAuto();
}

function joinSect(id){
  const p=G.c;if(!monthAct())return;
  if(id==='rebuilt'){toast('复兴之路，唯宗门覆灭者可行');render();return;}
  const sect=SECTS.find(s=>s.id===id);
  if(!sect){render();return;}
  const req=sect.req;
  const canJoin=p.rIdx>=req.rIdx && (p.att[0]+p.att[1])>=req.att;
  if(!canJoin || D100()>70){
   say('执事长老验过根骨，摇首：「根基未稳，再磨砺几年再来。」','r');
   render();return;
  }
  p.sect=sect.n;p.sectId=sect.id;p.discipleType=0;p.contrib=0;p.master=null;p.masterTier=0;
  markDeed('拜入'+sect.n+'·外门');
  say('<b class="lg-g">执事长老验过根骨，颔首：「入外门吧。」自此腰间多了一枚'+sect.n+'玉牌。</b>','g');
  if(sect.tier===1 && p.gongfa.g==='黄'){p.gongfa={n:sect.n+'心法',g:'玄'};say('外门亦授玄阶心法一卷：《'+p.gongfa.n+'》！','g');}
  render();
}
function doJob(ti){
  const p=G.c;
  if(!p.sect){render();return;}
  const sect=SECTS.find(s=>s.id===p.sectId);
  if(!sect){render();return;}
  if(p.discipleType===0){
   const jobs=[{n:'巡逻',pay:sect.bonus.stones*0.5,risk:0},{n:'采药',pay:sect.bonus.stones*0.4,risk:1,herb:1},{n:'猎妖',pay:sect.bonus.stones*1.2,risk:2},{n:'护送',pay:sect.bonus.stones*1.5,risk:2}];
   const j=jobs[ti];
   if(j.risk&&D100()<=15+j.risk*10){say('办差途中杀出个不讲武德的——');startCombat(mkEnemy(p.rIdx,0.95,j.n==='猎妖'));return;}
   const pay=Math.floor(j.pay);
   moneyGet(p,pay);p.contrib+=Math.floor((10+Math.floor(pay*0.2))*(weOn('moRise')?1.2:1));
   if(j.herb){const h=pickHerb(REGIONS[p.region].e);addHerb(h);say('顺手采得【'+h.n+'】。','g');}
   const needInner=sect.tier===1?200:sect.tier===2?120:80;
   if(p.contrib>=needInner){
    say('贡献已满，可申请晋升内门。','y');
   }
  }else{
   const jobs=[{n:'宗门大比',pay:sect.bonus.stones*2,risk:2},{n:'秘境探索',pay:sect.bonus.stones*2.5,risk:3,herb:1},{n:'护法护道',pay:sect.bonus.stones*3,risk:2},{n:'传道授业',pay:sect.bonus.stones*2,risk:1}];
   const j=jobs[ti];
   if(j.risk&&D100()<=10+j.risk*10){say('任务途中遇险——');startCombat(mkEnemy(p.rIdx,1.1,j.n==='秘境探索'));return;}
   const pay=Math.floor(j.pay);
   moneyGet(p,pay);p.contrib+=Math.floor((20+Math.floor(pay*0.3))*(weOn('moRise')?1.2:1));
   if(j.herb){const h=pickHerb(REGIONS[p.region].e);addHerb(h);say('秘境中采得【'+h.n+'】。','g');}
   if(p.discipleType===1 && p.contrib>=300){
    say('贡献卓著，可申请晋升真传。','y');
   }
  }
  afterAction();
}

function bountyRefresh(p){
 if(!p.bounty)p.bounty={list:[],next:p.y};
 if(p.y<p.bounty.next)return;
 const list=[];const mook=MOOKS[tierOf(p.rIdx)];
 const kinds=[
  ()=>({ty:'hunt',n:'猎杀·'+mook[RI(mook.length)],d:'除一凶物，还地方清净',r:{stones:400,contrib:40,rep:4}}),
  ()=>({ty:'herb',n:'采贡·宗门丹房',d:'为丹房采办两株灵药（产地愈优愈好）',r:{stones:200,contrib:30,rep:2}}),
  ()=>({ty:'escort',n:'护送·灵材车队',d:'护送车队穿行险道，遇袭则战',r:{stones:350,contrib:35,rep:3}}),
  ()=>({ty:'exorc',n:'除邪·祟乱之地',d:'邪祟扰民，宗门除之（凶险）',r:{stones:450,contrib:45,rep:6}}),
  ()=>({ty:'map',n:'寻遗·残图线索',d:'为宗门寻一份器图残卷',r:{stones:300,contrib:40,rep:3}})];
 for(let i=0;i<3;i++){const k=kinds[RI(kinds.length)]();k.rewardTxt='酬'+SC(k.r.stones)+'石·贡献'+k.r.contrib+'·声望'+k.r.rep;list.push(k);}
 p.bounty={list:list,next:p.y+3};
}
function bountyHTML(){
 const p=G.c;if(!p.sect)return '';
 bountyRefresh(p);
 const rows=p.bounty.list.map((b,i)=>'<div class="row" style="justify-content:space-between"><span><b>'+b.n+'</b> <small>'+b.d+' · '+b.rewardTxt+'</small></span>'+btn('bountyGo','接取（1月）','blue','','',i)+'</div>').join('');
 return '<div style="font-weight:bold;margin-top:4px">悬赏榜 <small>（三年一换，接取耗一月）</small></div>'+(rows||'<div style="color:var(--sub)">本期悬赏已被领空——静候下一榜。</div>');
}
function bountyGo(i){
 const p=G.c;if(!p.sect)return;
 bountyRefresh(p);
 const b=p.bounty.list[i];if(!b)return;
 if(!monthAct())return;
 p.bounty.list.splice(i,1);
 if(b.ty==='hunt'||b.ty==='exorc'){
  const e=mkEnemy(p.rIdx,1.1,b.ty==='exorc');
  e.n=b.n.split('·')[1];e.tag='bounty';e.bname=b.n;e.breward=b.r;e.canAwk=b.ty==='exorc';
  say('你揭下榜文【'+b.n+'】，循迹而出——');
  startCombat(e);return;
 }
 if(b.ty==='herb'){
  addHerb(pickHerb(CL(REGIONS[p.region].e+1,0,4)));addHerb(pickHerb(REGIONS[p.region].e));
  say('你入山两日，采得两株灵药，径送丹房。','g');
  bountyDone(p,b);return;
 }
 if(b.ty==='escort'){
  if(D100()<50+p.att[1]*2+p.att[3]){say('车队一路无事，平安抵达。','g');bountyDone(p,b);}
  else{say('车队半路遇袭——');const e=mkEnemy(p.rIdx,1.0,false);e.tag='bounty';e.bname=b.n;e.breward=b.r;startCombat(e);}
  return;
 }
 if(b.ty==='map'){
  const bps=['流云飞剑图纸','星纹护身镜图纸','赤霄长剑图纸','九天玄镜图纸'];
  const bp=bps[RI(bps.length)];
  if(!p.blueprints.includes(bp)){p.blueprints.push(bp);say('寻得残卷——【'+bp+'】！','y');}
  if(!p.knownBlueprints.includes(bp)){p.knownBlueprints.push(bp);say('你研习【'+bp+'】，领悟了其中锻造奥义！','g');}
  bountyDone(p,b);
 }
}
function bountyDone(p,b){
 moneyGet(p,SC(b.r.stones));p.contrib+=b.r.contrib;p.rep+=b.r.rep;
 say('<b class="lg-g">【悬赏完结】'+b.n+'——'+b.rewardTxt+'。</b>','g');
 markDeed('悬赏·'+b.n);
 checkAuto();
}

const BOARD_NAMES=['云无涯','白鹭洲','陆吾非','姜尘','洛惊鸿','商九歌','闻人夜'];
function boardEnsure(p){
 if(p.board&&p.board.foes)return;
 p.board=p.board||{me:0,title:'',lastY:387};
 p.board.foes=BOARD_NAMES.map(n=>({n:n,r:CL(p.rIdx+RI(5)-2,0,19),score:0}));
 p.board.foes.forEach(f=>{f.score=f.r*45+RI(70);});
}
function boardMe(p,n){boardEnsure(p);p.board.me=(p.board.me||0)+n;}
function boardYear(p){
 boardEnsure(p);
 p.board.foes.forEach(f=>{f.score+=RI(9)+Math.floor(f.r*0.5);if(D100()<12)f.r=CL(f.r+1,0,19);});
 if(p.y%10===0&&p.y>p.board.lastY){
  p.board.lastY=p.y;
  const rank=1+p.board.foes.filter(f=>f.score>(p.board.me||0)).length;
  if(rank<=3){
   const rep=(4-rank)*10;moneyGet(p,SC(800));p.rep+=rep;
   if(rank===1){p.board.title='天骄之首';markDeed('天骄榜·魁首');}
   say('<b style="color:#D4A017">【天骄榜·十年一评】你位列第'+rank+'——声望+'+rep+'，各宗贺仪齐至。</b>','y');
  }else say('<span class="lg-s">【天骄榜·十年一评】你位列第'+rank+'。前路犹长。</span>');
 }
}

const DISCIPLE_NAMES_MALE=['青松','白鹤','青峰','明月','清风','子期','子衿','子安','子默','子渊'];
const DISCIPLE_NAMES_FEMALE=['青萝','白露','青鸢','明珠','清漪','兰心','蕙质','若兰','幽兰','紫菱'];
const DISCIPLE_ROOTS=['天灵根','地灵根','真灵根','伪灵根'];
const DISCIPLE_PERSONALITIES=['勤奋','聪慧','顽劣','忠诚','野心','胆小','正义','懒散','执着','随性'];

function genDisciple(){
  const p=G.c;
  const isMale=D100()<50;
  const name=(isMale?DISCIPLE_NAMES_MALE:DISCIPLE_NAMES_FEMALE)[RI(isMale?DISCIPLE_NAMES_MALE.length:DISCIPLE_NAMES_FEMALE.length)];
  const root=DISCIPLE_ROOTS[RI(DISCIPLE_ROOTS.length)];
  const personality=DISCIPLE_PERSONALITIES[RI(DISCIPLE_PERSONALITIES.length)];
  const loyalty=50+RI(20)-10;
  return {
   name:name,
   sex:isMale?'男':'女',
   age:14+RI(4),
   root:root,
   personality:personality,
   loyalty:loyalty,
   cult:0,
   months:0,
   learned:[],
   events:0
  };
}

function acceptDisciple(){
  const p=G.c;
  if(p.rIdx<6){toast('需金丹期方可收徒');render();return;}
  const maxDisciples=1+Math.floor(p.rIdx/2);
  if(p.disciples.length>=maxDisciples){toast('徒弟已满（上限'+maxDisciples+'）');render();return;}
  if(p.stones<SC(200)){toast('需'+SC(200)+'灵石办理拜师礼');render();return;}
  p.stones-=SC(200);
  const d=genDisciple();
  p.disciples.push(d);
  say('<b class="lg-g">你收'+d.name+'为徒，赐名'+d.name+'，根骨'+d.root+'，性格'+d.personality+'。（忠诚度'+d.loyalty+'）</b>','g');
  markDeed('收徒·'+d.name);
  render();
}

function discipleAction(dIdx,act){
  const p=G.c;
  const d=p.disciples[dIdx];
  if(!d)return;
  if(!monthAct())return;
  if(act==='teach'){
   if(p.stones<SC(50)){toast('需'+SC(50)+'灵石置办教材');render();return;}
   p.stones-=SC(50);
   const gain=10+p.wuT[0]*2+p.wuT[1]*2;
   d.cult+=gain;
   d.learned.push('师尊亲授心法');
   d.loyalty=CL(d.loyalty+5,0,100);
   say('你为'+d.name+'讲解道法，获益良多（修为+'+gain+' · 忠诚+5）。','g');
  }else if(act==='resource'){
   if(p.stones<SC(100)){toast('需'+SC(100)+'灵石购置资源');render();return;}
   p.stones-=SC(100);
   d.cult+=20;
   d.loyalty=CL(d.loyalty+3,0,100);
   say('你为'+d.name+'购置灵丹妙药，修为精进（修为+20 · 忠诚+3）。','g');
  }else if(act==='cultivate'){
   const gain=5+p.rIdx;
   d.cult+=gain;
   say(d.name+'闭关修炼（修为+'+gain+'）。','s');
  }else if(act==='mission'){
   if(d.cult<100){toast('修为不足，无法外出历练');render();return;}
   const danger=D100()<20;
   if(danger){
    d.loyalty=CL(d.loyalty-10,0,100);
    say('<b class="lg-r">'+d.name+'历练遇险，虽脱身却心生怨念（忠诚-10）。</b>','r');
   }else{
    const reward=50+RI(50);
    moneyGet(p,reward);
    d.cult+=15;
    d.loyalty=CL(d.loyalty+5,0,100);
    say(d.name+'历练归来，献上灵石'+reward+'（修为+15 · 忠诚+5）。','g');
   }
  }else if(act==='expel'){
   if(!confirm('确定逐走'+d.name+'？此举将令其怨恨入骨。'))return;
   p.karma+=5;
   p.disciples.splice(dIdx,1);
   say('你挥袖令'+d.name+'滚出师门。他跪地磕头，眼中满是恨意（业力+5）。','r');
  }
  checkAuto();
}

function btBig(path){
  const p=G.c;if(p.cult<needOf(p)||p.stg<3)return;
  if(path==='H'){
   if(cntBag('人道破境丹')<1){
    if(confirm('手中无人道破境丹。以 '+fmtN(RDprice())+' 灵石向坊市急购一枚？')){
     if(p.stones<RDprice()){say('灵石不够，掌柜摇头。','r');render();return;}
     p.stones-=RDprice();addItem('人道破境丹',1);
    }else return;
   }
   removeItem('人道破境丹',1);
  }else if(path==='D'){
   if(cntBag('天材地宝')<2){say('需天材地宝两枚，尚缺 '+(2-cntBag('天材地宝'))+' 枚。','r');render();return;}
   removeItem('天材地宝',2);
  }else{
   if(cntBag('天材地宝')<1||cntBag('五行灵珠')<1){say('天道之路：须天材地宝 + 五行灵珠齐备。','r');render();return;}
   removeItem('天材地宝',1);removeItem('五行灵珠',1);
  }
  if(!monthAct())return;
  let base=path==='H'?88:path==='D'?72:52;
  base-=p.rIdx*2.5;base+=Math.floor((p.att[4]-10)*1.5);
  if(p.abn.includes('心魔缠身'))base-=25;
  base=CL(base,15,95);
  if(path==='T'||(path==='D'&&D100()<50)){
   let hits=2+Math.min(2,Math.floor(p.rIdx/6));
   const prep=p.tribPrep||{items:[],helpers:[]};
   if(prep.items.includes('array')){hits=Math.max(2,hits-2);say('<b class="lg-g">护山大阵启动，天雷减两道！</b>','g');}
   if(prep.items.includes('spirit')){hits=Math.max(2,hits-1);say('<b class="lg-g">器灵护佑，天雷减一道！</b>','g');}
   if(prep.helpers.includes('master')){hits=Math.max(2,hits-1);say('<b class="lg-g">师尊护法，天雷减一道！</b>','g');}
   if(p.karma>=10){hits++;say('<span class="lg-r">业力沸腾，苍穹色变——这一劫比寻常更狠。</span>');}
   if(p.merit>=10){hits--;say('<span class="lg-g">微光垂落，功德护你一线（减一道雷）。</span>');}
   hits=Math.max(2,hits);
   if(!p.flags.hdDone&&(p.abn.includes('心魔缠身')||D100()<45)){
    p.flags.hdDone=1;
    G.hdPend={bonus:path,base:base,hits:hits,prep:prep};
    heartDemonTrial();
    return;
   }
   G.tb={bonus:path,base:base,hitsLeft:hits,round:0,prep:prep};
   triRender();return;
  }
  finishBig(path,base,2);
}

function affAdd(id,v){
  const p=G.c;
  const ziMul={'凡姿':1,'清秀':1.03,'出众':1.06,'超凡':1.1}[p.zi]||1; /* 仙姿实装：颜值即正义，好感收益随仙姿水涨 */
  v=Math.round(Math.round(v*(p.charmBonus||1)*ziMul)*(1+(p.wuT[4]?p.wuT[4]*0.1:0)));
  if(p.m===3)v=Math.ceil(v*1.5);
  if((p.rel[id]||0)===0&&p.wuT[4]>=3)v+=3; /* 有情道三重·一见如故 */
  if(p.wuT[4]>=6)v=Math.round(v*1.25); /* 有情道六重·情场得意 */
  v=Math.round(v*(1+metaBonus(p,'npc')/100));
  if(p.rel[id]===undefined)dexRec('npc',npcName(id));
  p.rel[id]=CL((p.rel[id]||0)+v,0,100);
  return v;
}

function socTalk(id){
  const p=G.c,n=NPCS.find(x=>x.id===id);
  if(!p.met[id]){toast('尚未结识，无法叙话');render();return;}
  const af=p.rel[id]||0;
  const hit=D100()<30+p.att[5]*1.5;
  /* 久别重逢：两年未见者，此番叙话好感翻倍——鼓励四处走动，而非原地连点 */
  if(!p.lastTalk)p.lastTalk={};
  const gap=p.y-(p.lastTalk[id]||0);
  p.lastTalk[id]=p.y;
  const reunion=gap>=2;
  let base=2+(hit?2:0)+(p.path==='守护所爱'&&D100()<15?1:0);
  if(reunion)base*=2;
  if(p.spouse===id)p.spouseBond=CL((p.spouseBond||0)+1,0,100); /* R18 */
  const dv=affAdd(id,base);
  let txt='';
  if(af>=80){
   txt=hit?('与'+n.n+'并肩看云，她说起幼时趣事，眼底笑意温柔——这般时光，千金不换。'):('与'+n.n+'对坐无言，却并不尴尬——有些默契，不必说出口。');
  }else if(af>=60){
   txt=hit?('与'+n.n+'相谈甚欢，临别时她眼底有光一闪。'):('与'+n.n+'寒暄几句，尚隔一层。');
  }else if(af>=40){
   txt=hit?('与'+n.n+'聊得投机，话题从山水转到修行。'):('与'+n.n+'客气地聊了几句天气。');
  }else{
   txt=hit?('与'+n.n+'初次深谈，发现对方颇有见地。'):('与'+n.n+'寒暄几句，还算客气。');
  }
  say(txt+'（好感+'+dv+(reunion?' · 久别重逢×2':'')+'）','p');
  afterAction();
}
function socGift(id){
  const p=G.c;

  const cost=SC(30);

  p.stones-=cost;
  const n=NPCS.find(x=>x.id===id);
  if(!p.lastTalk)p.lastTalk={};
  const gap=p.y-(p.lastTalk[id]||0);
  p.lastTalk[id]=p.y;
  const reunion=gap>=2;
  /* 投其所好：礼单明示各人所好，送对了好感翻倍——赠礼从盲赌变小事决策 */
  const prefer=n.like&&n.like.length?n.like[RI(n.like.length)]:null;
  const matched=prefer&&D100()<55;
  let base=matched?6:3;
  if(reunion)base*=2;

   const MAP=[0,3,4,6,8,9,10,11,13,14]; /* 旧境→新境：保证寿元不倒退 */
   const o=CL(d.c.rIdx|0,0,9), n=MAP[o];
   const par=100*Math.pow(2.512,n), oldPar=385*Math.pow(2.55,o);
   const fac=CL((d.c.hpM||100)/oldPar,1,6);
   d.c.rIdx=n; d.c.cult=0;
   d.c.hpM=Math.round(par*fac); d.c.mpM=Math.round(par*fac);
   d.c.hp=d.c.hpM; d.c.mp=d.c.mpM;
   d.c.lifeBonus=Math.max(0,OLD_LIFE[o]-RL[n].life);

   if(Array.isArray(d.c.bag))d.c.bag.forEach(x=>{if(x.n==='筑基丹')x.n='筑台丹';});

/* ---------- 导出 / 导入（跨设备转移） ---------- */
function exportSave(){
 try{
  const keys=['wdcs_save','wdcs_backup','wdcs_dex','wdcs_chronicle','wdcs_legacy','wdcs_lastlife','wdcs_daoguo'];
  for(let i=0;i<SLOT_MAX;i++)keys.push(slotKey(i));
  const data={};let n=0;
  keys.forEach(k=>{const v=sGet(k);if(v!==null&&v!==undefined){data[k]=v;n++;}});
  if(!n){alert('尚无任何可导出的进度。');return;}
  const txt=JSON.stringify({game:'问道长生',ver:1,exportedAt:new Date().toISOString(),data:data},null,2);
  if(window.WenDao&&typeof window.WenDao.exportSave==='function'){window.WenDao.exportSave(txt);return;}
  const blob=new Blob([txt],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='问道长生存档_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},3000);
  toast('存档已导出（'+n+' 条数据）');
 }catch(e){alert('导出失败：'+e.message);}
}
function importSave(file){
 if(!file)return;
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.game!=='问道长生'||!d.data)throw new Error('这不是有效的问道长生存档文件');
   let n=0;
   Object.keys(d.data).forEach(k=>{if(/^wdcs_/.test(k)){sSet(k,d.data[k]);n++;}});
   if(!n)throw new Error('文件中没有存档数据');
   alert('导入成功（'+n+' 条数据）——'+(G?'当前游玩进度不受影响，可随时在「档卷」读取新档':'回到卷首即可续缘'));
   if(!G)render();
  }catch(e){alert('导入失败：'+e.message);}
 };
 fr.readAsText(file,'utf-8');
}
function pickImport(){
 const inp=document.createElement('input');
 inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>{if(inp.files&&inp.files[0])importSave(inp.files[0]);};
 inp.click();
}

function chanStart(){
 const p=G.c;
 if(p.rIdx<1){toast('炼气以上方可入禅关');render();return;}
 if(!monthAct())return;
 for(let i=0;i<12;i++){addCult(p,cultGain(p,false)*0.8);if(!monthTick(p))return;}
 const tier=p.rIdx>=10?1:0;
 /* 两层题池合并洗牌取三问——避免重复抽到同一问 */
 const qs=CHAN_POOL[tier].concat(CHAN_POOL[1-tier]).sort(()=>Math.random()-0.5).slice(0,3);
 p.chanStreak=0;
 say('你在禅室中枯坐一年。出关那日，你问了自己三个问题。');

}

  say('<span class="lg-s">【禅关】三问已毕。答得寻常，却也真实。</span>');
  checkAuto();return;
 }

 G.ev={theme:'vio',title:'禅关 · 第'+(i+1)+'问',body:q.q,
  opts:q.opts.map(o=>({t:o.t,d:o.d,fx:()=>{

   chanAsk(p2,qs,i+1);
  }}))};

}

function sectCrisisAct(idx){
  const p=G.c;const c=p.sectCrisis;if(!c)return;
  const crisis=SECT_CRISIS.find(x=>x.id===c.id);
  const r=crisis.resolve[idx];
  if(c.resolved.includes(idx))return;
  if(r.cost){if(r.cost.stones)p.stones-=r.cost.stones;}
  if(r.req){
    if(r.req.pills){let need=r.req.pills;for(let i=p.bag.length-1;i>=0&&need>0;i--){const m=MK.find(x=>x.n===p.bag[i].n);if(m&&m.ty==='pill'){const take=Math.min(need,p.bag[i].k);p.bag[i].k-=take;need-=take;if(p.bag[i].k<=0)p.bag.splice(i,1);}}}
  }
  if(r.combat){
    const enemyPower=crisis.winRate*500+RI(200);
    if(power(p)>=enemyPower){say('<b class="lg-g">你亲自出战，力挽狂澜！战力碾压，危机缓解。</b>','g');}
    else{const dmg=Math.floor(p.hpM*0.3);p.hp=Math.max(1,p.hp-dmg);say('<b class="lg-r">你亲自出战，虽奋力抵抗但力有不逮，受创'+dmg+'。危机仍在。</b>','r');c.progress=Math.max(0,c.progress-10);afterAction();return;}
  }
  if(r.explore){
    if(D100()<=60){say('<b class="lg-g">你深入秘境，寻得所需宝物！危机缓解。</b>','g');}
    else{say('<b class="lg-r">你探索秘境无果，还险些遇险。危机仍在。</b>','r');c.progress=Math.max(0,c.progress-5);afterAction();return;}
  }
  c.resolved.push(idx);
  c.progress=CL(c.progress+r.prog,0,100);
  say('采取行动「'+r.t+'」，危机进度+'+r.prog+'%（当前'+c.progress+'%）。','y');

 {id:'beast',n:'妖兽闯入',d:'一只妖兽嗅到灵气，闯入了你的洞府！',winRate:0.6,loot:{stones:100,herb:1}},
 {id:'evil',n:'邪修寻宝',d:'一个邪修听闻你洞府有宝，破门而入！',winRate:0.4,loot:{stones:300,item:1}},
 {id:'rival',n:'仇家寻仇',d:'你的仇家寻上门来，要血债血偿！',winRate:0.3,loot:{stones:200}},
 {id:'thief',n:'窃贼光顾',d:'一个窃贼趁你不备，摸进了你的洞府！',winRate:0.7,loot:{stones:50}}
];
function tryInvasion(p){
  if(p.caveInvade)return;
  // 入侵概率：基础1% + 洞府价值 + 恶缘 + 地区危险度
  const caveValue=p.stones*0.0001+(p.field?p.field.lv*0.005:0);
  const evilBonus=Math.max(0,karmaNet(p))*-0.0005;
  const dangerBonus=REGIONS[p.region].e*0.002;
  const rate=0.01+caveValue+evilBonus+dangerBonus;
  if(D100()>rate*100)return;
  const inv=INVASION_TYPES[RI(INVASION_TYPES.length)];
  p.caveInvade={id:inv.id,n:inv.n,d:inv.d};
  G.ev={theme:'red',title:'洞府遇袭！',
   body:inv.d+'<br>你可以：<br><b>迎战</b>——亲自战斗，胜则夺其财物，败则受伤失财；<br><b>布防</b>——消耗灵石布置临时禁制，不战而屈人之兵；<br><b>弃府</b>——暂时逃离，损失部分财物但保全性命。',
   opts:[
    {t:'迎战',d:'亲自战斗',fx:()=>{
      startCombat(mkEnemy(p.rIdx+(inv.id==='rival'?1:0),1.0+inv.winRate*0.3,false));
    }},
    {t:'布防（耗'+SC(500)+'石）',d:'布置禁制驱敌',fx:()=>{
      if(p.stones<SC(500)){say('灵石不足，无法布防！','r');render();return;}
      p.stones-=SC(500);
      if(D100()<=70){say('<b class="lg-g">禁制生效！</b>入侵者被禁制击退，仓皇逃窜。（耗500石）','g');}
      else{const loss=Math.min(p.stones,Math.floor(p.stones*0.1));p.stones-=loss;say('禁制被攻破！入侵者抢走了'+loss+'灵石。','r');}
      p.caveInvade=null;afterAction();
    }},
    {t:'弃府逃离',d:'损失10%财物',fx:()=>{
      const loss=Math.min(p.stones,Math.floor(p.stones*0.1));p.stones-=loss;
      say('你当机立断，弃府而逃。损失了'+loss+'灵石，但保全了性命。','s');
      p.caveInvade=null;afterAction();
    }}
   ]};
  render();
}

function tryWorldEvent(p){
  if(p.worldEvent)return;
  // 大事件每50-100年触发一次
  if(p.y<450)return;
  if(D100()>0.5)return; // 每年0.5%概率
  const ev=WORLD_EVENTS[RI(WORLD_EVENTS.length)];
  p.worldEvent={id:ev.id,n:ev.n,d:ev.d,time:ev.duration,maxTime:ev.duration};
  ev.effect(p);
  p.wchron=p.wchron||[];p.wchron.push({y:p.y,n:ev.n}); /* 载入编年史 */
  markDeed('亲历·'+ev.n);
  render();
}
function worldEventTick(p){
  if(!p.worldEvent)return;
  p.worldEvent.time--;
  if(p.worldEvent.time<=0){
   say('<b class="lg-s">【大事件结束】'+p.worldEvent.n+'终于平息，九州恢复了平静。</b>','s');
   p.worldEvent=null;
  }
}

/* ===================== 狗血剧情：道侣是魔头卧底 ===================== */
function tryLuoQianqianEvent(p){
  // 触发条件：与洛浅浅结为道侣 + 金丹期 + 已结侣3年以上 + 未触发过 + 每年3%概率
  if(p.lqqEvent)return;
  if(p.spouse!=='lqq')return;
  if(p.rIdx<6)return; // 金丹期
  if((p.rel['lqq']||0)<80)return; // 好感度足够
  if(D100()>((p.rel['lqq']||0)>=95?10:3))return; // 好感95+者每年10%，其余3%——情越深，劫越近
  triggerLqqEvent();
}

   body:'你深夜归来，却撞见洛浅浅正与一个血魔宗装束的人密会。她手中握着的，是正道宗门的布防图。<br><br>看到你，她手中的图纸飘然落地，脸色惨白：「你……都看见了？」<br><br>「我是血魔宗安插在合欢宗的卧底。接近你，一开始是为了窃取正道情报。可是……」她低下头，声音颤抖，「可是我真的爱上你了。我一直在犹豫要不要告诉你。」<br><br>「现在，你知道了。你想怎么做？」',
   opts:[
    {t:'跟她一起堕落成魔修',d:'放弃正道身份，加入血魔宗，与她一起',fx:()=>{
      p.lqqEvent.choice='fall';

      addKarma(p,'evil',30,'与魔修道侣同流合污');

      p.flags.moXiu=1;
      say('<b class="lg-r">【堕入魔道】</b>你握住洛浅浅的手：「正道容不下你，那我便陪你入魔。」<br>她泪流满面，紧紧抱住你。<br>从此，正道多了两个叛徒，魔道多了一对神仙眷侣。（业力+50 · 声望-50 · 退出宗门 · 成为魔修）','r');
      markDeed('堕入魔道·与洛浅浅同修');
      p.lqqEvent.stage='fallen';

      say('你拔剑指向她：「浅浅，你我正邪殊途。今日，不是你死，就是我亡。」<br>她凄然一笑：「好。能死在你手里，也算是我的归宿。」','r');
      // 进入特殊战斗：洛浅浅放水版

    }}
   ]};

}
function startLqqFight(){
  const p=G.c;
  const enemy={
    n:'洛浅浅',
    r:Math.max(p.rIdx-1,3),
    stg:2,
    pw:power(p)*0.85, // 她比玩家弱一点（放水）
    hp:Math.floor(p.hpM*1.2),
    hpM:Math.floor(p.hpM*1.2),
    eles:['水','木'],
    tag:'lqq',
    mercy:true // 标记：她会在玩家快输时放水
  };
  G.cb={e:enemy,charge:0,guard:false,shield:false,calm:false,turn:0,log:['【遭遇】你与洛浅浅拔剑相向。她眼中含泪，却没有退缩。']};
  render();
}
function lqqFightCheck(){
  // 检查玩家是否快输了（血量<20%），如果是，洛浅浅放水
  const c=G.cb,p=G.c;
  if(!c||c.e.tag!=='lqq'||!c.e.mercy)return false;
  if(p.hp<=p.hpM*0.2){
    // 洛浅浅放水：故意露出破绽，让玩家杀死她
    c.e.mercy=false; // 只放水一次
    cbl('<span style="color:#D88FA5">洛浅浅看着你遍体鳞伤的样子，眼中闪过一丝决绝。她故意放慢了剑势，露出一个致命的破绽——「来啊。杀了我。这样，你就不用再痛苦了。」</span>');
    // 玩家下一次攻击必定命中且暴击
    c.lqqMercy=true;
    return true;
  }
  return false;
}
function lqqDeath(mercyKill){
  const p=G.c;
  G.cb=null;
  // 追妻火葬场debuff
  const debuffName=mercyKill?'心魔·情殇':'心魔·杀妻';
  const debuffDesc=mercyKill?'她放水让你杀了她，这份愧疚将折磨你很久。修炼速度-30%，持续20年。':'你亲手杀了她，这份心魔将伴随你很久。修炼速度-20%，持续10年。';
  const cultPenalty=mercyKill?0.3:0.2;
  const duration=mercyKill?240:120; // 月
  if(!p.debuffs)p.debuffs=[];
  p.debuffs.push({name:debuffName,desc:debuffDesc,cult:cultPenalty,duration:duration,maxDuration:duration});
  // 遗物
  addItem('合欢玉佩',1);
  say('<b class="lg-r">【杀妻之痛】</b>洛浅浅倒在你怀里，气若游丝：「我不后悔遇见你……若有来生，我想做个好人……好好爱你……」<br>她的手垂落，脸上还带着一丝微笑。<br>你抱着她渐渐冰冷的身体，站了很久很久。<br>（获得【合欢玉佩】· 获得心魔【'+debuffName+'】· '+debuffDesc+'）','r');
  markDeed('杀妻·洛浅浅');
  // 道侣死亡
  p.spouse=null;
  p.rel['lqq']=0;
  // 目击者：谢无咎正好赶来
  setTimeout(()=>{xieWujiuWitness(mercyKill);},500);
  afterAction();
}

const NPC_RELATIONS={
 gqx:[{id:'qy',rel:'剑道同源'}],qy:[{id:'gqx',rel:'剑道同源'}],
 swj:[{id:'lqq',rel:'青梅竹马'}],lqq:[{id:'swj',rel:'青梅竹马'}],

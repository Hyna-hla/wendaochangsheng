function npcDeathCheck(p,name){
  /* 传入名或id皆可，统一换算后再查关系网 */
  const byId=NPCS.find(x=>x.id===name),byNm=NPCS.find(x=>x.n===name);
  const npcId=byId?byId.id:(byNm?byNm.id:null);
  if(!npcId)return;
  const rels=NPC_RELATIONS[npcId]||[];
  rels.forEach(r=>{
   p.rel[r.id]=Math.max(0,(p.rel[r.id]||0)-30);
   const rn=npcName(r.id);
   say('<b class="lg-r">【关系网】</b>'+rn+'得知'+npcName(npcId)+'的死讯，对你的态度大幅下降！','r');
   if(D100()<=30&&!p.rival){
    p.rival={n:rn,r:p.rIdx,stg:0,wins:0,rel:-50};
    say('<b class="lg-r">【宿敌诞生】</b>'+rn+'立誓要为'+npcName(npcId)+'报仇，成为你的宿敌！','r');
    markDeed('宿敌·'+rn);
   }
  });
}
function npcRelationTick(p){
  /* 九人关系网的江湖闲话——只说真人，不说鬼话 */
  if(D100()>1)return;
  const npcs=Object.keys(NPC_RELATIONS).filter(id=>NPC_RELATIONS[id].length);
  const npc=npcs[RI(npcs.length)];
  const rels=NPC_RELATIONS[npc];
  const r=rels[RI(rels.length)];
  const a=npcName(npc),b=npcName(r.id);
  if(D100()<=50){
   say('<span class="lg-s">【江湖传闻】</span>'+a+'与'+b+'近来走得很近——「'+r.rel+'」之说，愈发坐实了。','s');
  }else{
   say('<span class="lg-s">【江湖传闻】</span>'+a+'与'+b+'似乎生了嫌隙，「'+r.rel+'」之情蒙上了影。','s');
  }
}
function addKarma(p,type,amount,reason){
  if(type==='good'){
   p.karmaGood=(p.karmaGood||0)+amount;
   if(reason)say('<span style="color:#6BA38E">【善缘】'+reason+'（善缘+'+amount+'）</span>','g');
  }else{
   p.karmaEvil=(p.karmaEvil||0)+amount;
   if(reason)say('<span style="color:#8E8578">【恶缘】'+reason+'（恶缘+'+amount+'）</span>','r');
  }
}
function karmaNet(p){
  return (p.karmaGood||0)-(p.karmaEvil||0);
}
function karmaLevel(p){
  const net=karmaNet(p);
  if(net>=100)return {n:'大善之人',c:'#6BA38E',desc:'积善成德，天道庇佑'};
  if(net>=50)return {n:'善人',c:'#8FB89E',desc:'心地善良，多有贵人相助'};
  if(net>=10)return {n:'心善',c:'#A8C4B0',desc:'偶有善行，天道微佑'};
  if(net>=-10)return {n:'凡人',c:'#A8A8A8',desc:'善恶参半，天道不偏不倚'};
  if(net>=-50)return {n:'心恶',c:'#B8A090',desc:'偶有恶行，需当心报应'};
  if(net>=-100)return {n:'恶人',c:'#A88878',desc:'恶行累累，仇家渐多'};
  return {n:'万恶之魔',c:'#8E6858',desc:'恶贯满盈，天劫加重，人人得而诛之'};
}
// 善报事件：高善缘触发
function tryGoodKarmaEvent(p){
  const net=karmaNet(p);
  if(net<30)return false;
  const rate=Math.min(0.02,net*0.0002); // 善缘30时0.6%，善缘100时2%
  if(D100()>rate*100)return false;
  const events=[
   {n:'贵人相助',d:'路遇一位隐世高人，见你心善，赠你一部功法残卷！',fx:()=>{p.stones+=500;return '灵石+500';}},
   {n:'奇遇',d:'你在山中偶遇一处前人遗藏，竟是一位善人的埋骨之所！',fx:()=>{addItem('天材地宝',1);return '天材地宝+1';}},
   {n:'仙人指点',d:'一位云游仙人见你根骨清奇，指点了你几句修行要诀！',fx:()=>{addCult(p,needOf(p)*0.1);return '修为+10%';}},
   {n:'善有善报',d:'你多年前救过的一个人，如今发迹，特来报恩！',fx:()=>{p.rep=(p.rep||0)+10;p.stones+=300;return '声望+10 · 灵石+300';}}
  ];
  const ev=events[RI(events.length)];
  const result=ev.fx();
  say('<b class="lg-g">【善报】'+ev.n+'！'+ev.d+'（'+result+'）</b>','g');
  markDeed('善报·'+ev.n);
  return true;
}
// 恶报事件：高恶缘触发
function tryEvilKarmaEvent(p){
  const net=karmaNet(p);
  if(net>-30)return false;
  const rate=Math.min(0.03,Math.abs(net)*0.0003); // 恶缘30时0.9%，恶缘100时3%
  if(D100()>rate*100)return false;

function fieldHTML(){
  const p=G.c;
  if(!p.field)p.field={lv:0,slots:[]};
  const fl=FIELD_LV[p.field.lv];
  let rows='<div><b>'+fl.n+'</b> · '+fl.slots+'块灵田 · 产量×'+fl.bonus+'<br><small>'+fl.desc+'</small></div>';
  if(p.field.lv<FIELD_LV.length-1){
   const next=FIELD_LV[p.field.lv+1];
   rows+='<div class="hr"></div><div>升级为「'+next.n+'」：'+next.slots+'块灵田 · 产量×'+next.bonus+' · 需'+SC(next.cost)+'灵石</div>';
   rows+='<div class="row" style="margin-top:4px">'+btn('fieldUp','升级药园','gold','',p.stones<SC(next.cost))+'</div>';
  }
  const emptyCnt=p.field.slots.filter(s=>!s).length;
  const readyCnt=p.field.slots.filter(s=>s&&s.months>=(HERB_SEEDS.find(h=>h.id===s.id)||{grow:999}).grow).length;
  rows+='<div class="hr"></div><div class="row" style="justify-content:space-between"><span style="font-weight:bold">灵田种植（共'+fl.slots+'块）</span><span>'+
   (readyCnt?btn('harvestAll','一键收获（1月）','green','',''):'')+
   (emptyCnt?btn('plantAll','空田尽种百草露（1月）','green','',p.stones<SC(10)):'')+'</span></div>';
  for(let i=0;i<fl.slots;i++){
   const slot=p.field.slots[i];
   if(!slot){
    rows+='<div class="opt"><b>第'+(i+1)+'块灵田</b> · 空置<br><div class="row" style="margin-top:4px">';
    HERB_SEEDS.forEach((h,hi)=>{
      if(h.lv<=p.field.lv+1){
       rows+='<span>'+btn('plantSeed','种'+h.n,'green','',p.stones<10,hi+'_'+i)+'</span>';
      }
    });
    rows+='</div></div>';
   }else{
    const seed=HERB_SEEDS.find(h=>h.id===slot.id);
    const progress=Math.min(100,Math.floor(slot.months/seed.grow*100));
    const ready=slot.months>=seed.grow;
    rows+='<div class="opt"><b>第'+(i+1)+'块灵田</b> · '+seed.n+' · '+slot.months+'/'+seed.grow+'月'+(ready?' <span style="color:#6A9C72">已成熟！</span>':'')+'<br>'+
      pb(progress,100,'#6A9C72')+
      (ready?'<div class="row" style="margin-top:4px">'+btn('harvest','收获','green','',false,i)+'</div>':'')+
      '</div>';
   }
  }
  return panel('green','洞府药园',rows);
}
function plantSeed(hi,slotIdx){
  const p=G.c;
  if(!p.field)p.field={lv:0,slots:[]};
  const fl=FIELD_LV[p.field.lv];
  if(slotIdx>=fl.slots)return;
  if(p.field.slots[slotIdx]){say('这块灵田已经种了东西。','r');return;}
  if(p.stones<10){say('灵石不足，购买种子需10灵石。','r');return;}
  p.stones-=10;
  const seed=HERB_SEEDS[hi];
  p.field.slots[slotIdx]={id:seed.id,months:0};
  say('你花10灵石买下'+seed.n+'的种子，种入第'+(slotIdx+1)+'块灵田。预计'+seed.grow+'月后成熟。','g');
  afterAction();
}
function harvest(slotIdx){
  const p=G.c;
  if(!p.field||!p.field.slots[slotIdx])return;
  const slot=p.field.slots[slotIdx];
  const seed=HERB_SEEDS.find(h=>h.id===slot.id);
  if(slot.months<seed.grow){say('还没成熟呢。','r');return;}
  const fl=FIELD_LV[p.field.lv];
  const cnt=Math.floor((seed.yield[0]+RI(seed.yield[1]-seed.yield[0]+1))*fl.bonus);
  for(let k=0;k<Math.max(1,cnt);k++)addHerb({n:seed.n,v:seed.yield[1]*50}); /* 修复：原先只入袋一株 */
  say('<b class="lg-g">收获！</b>第'+(slotIdx+1)+'块灵田的'+seed.n+'成熟了，收获'+cnt+'株。','g');
  /* R8 灵植异变：相邻同种双熟，两股灵机相引可凝异变株 */
  const adj=p.field.slots[slotIdx+1]||p.field.slots[slotIdx-1];
  const hIdx=HERB_SEEDS.indexOf(seed);
  if(adj&&adj.id===seed.id&&adj.months>=seed.grow&&hIdx<HERB_SEEDS.length-1&&D100()<=15){
   const up=HERB_SEEDS[hIdx+1];
   addHerb({n:up.n,v:up.yield[1]*50});
   say('<b style="color:#9a7420">【灵植异变】相邻两株'+seed.n+'灵机相引，竟凝出一株「'+up.n+'」变异株！</b>','y');
   markDeed('灵植异变·'+up.n);
  }
  p.field.slots[slotIdx]=null;
  afterAction();
}
function plantAll(){
  const p=G.c;
  if(!p.field)p.field={lv:0,slots:[]};
  const fl=FIELD_LV[p.field.lv];
  const seed=HERB_SEEDS[0]; /* 一键播种选百草露：最快成熟、保底不亏 */
  let n=0,cost=0;
  for(let i=0;i<fl.slots;i++){if(!p.field.slots[i]&&seed.lv<=p.field.lv+1){cost+=SC(10);n++;}}
  if(!n){toast('没有空田');render();return;}
  if(p.stones<cost){toast('需'+cost+'灵石');render();return;}
  p.stones-=cost;
  for(let i=0;i<fl.slots;i++)if(!p.field.slots[i]&&seed.lv<=p.field.lv+1)p.field.slots[i]={id:seed.id,months:0};
  say('你一次买齐种子，把'+n+'块空田尽数种下百草露（-'+cost+'石）。','g');
  afterAction();
}
function harvestAll(){
  const p=G.c;
  if(!p.field)return;
  const fl=FIELD_LV[p.field.lv];
  let n=0;
  p.field.slots.forEach((s,i)=>{
   if(!s)return;
   const seed=HERB_SEEDS.find(h=>h.id===s.id);
   if(s.months>=seed.grow){
    const cnt=Math.floor((seed.yield[0]+RI(seed.yield[1]-seed.yield[0]+1))*fl.bonus);
    for(let k=0;k<Math.max(1,cnt);k++)addHerb({n:seed.n,v:seed.yield[1]*50});
    const hIdx=HERB_SEEDS.indexOf(seed);
    if(D100()<=8&&hIdx<HERB_SEEDS.length-1){const up=HERB_SEEDS[hIdx+1];addHerb({n:up.n,v:up.yield[1]*50});say('<b style="color:#9a7420">【灵植异变】垄间灵机相引，凝出一株「'+up.n+'」变异株！</b>','y');}
    p.field.slots[i]=null;n++;
   }
  });
  if(!n){toast('尚无成熟灵田');render();return;}
  say('<b class="lg-g">你提篮走遍田垄，收获了'+n+'块成熟灵田。</b>','g');
  afterAction();
}
function fieldUp(){
  const p=G.c;
  if(!p.field)p.field={lv:0,slots:[]};
  if(p.field.lv>=FIELD_LV.length-1){say('药园已达最高等级。','r');return;}
  const next=FIELD_LV[p.field.lv+1];
  const nextCost=SC(next.cost);
  if(p.stones<nextCost){say('灵石不足，升级需'+nextCost+'灵石。','r');return;}
  p.stones-=nextCost;
  p.field.lv++;
  say('<b class="lg-g">药园升级！</b>你的药园升级为「'+next.n+'」——'+next.slots+'块灵田，产量×'+next.bonus+'。','g');
  afterAction();
}
function fieldTick(){
  const p=G.c;
  if(!p.field||!p.field.slots)return;
  let harvested=false;
  p.field.slots.forEach((slot,i)=>{
   if(slot){
    slot.months++;
    const seed=HERB_SEEDS.find(h=>h.id===slot.id);
    if(slot.months===seed.grow){
     say('【药园】第'+(i+1)+'块灵田的'+seed.n+'成熟了，可以收获。','g');
     harvested=true;
    }
   }
  });
}

function tryEpiphany(p,baseRate){
  // 顿悟概率极低：基础概率 × 境界衰减（高境界更难顿悟）· baseRate 缺省 0.002
  const realmPenalty=p.rIdx>=10?0.5:p.rIdx>=6?0.7:1.0;
  const daoBonus=1+p.att[4]*0.02; // 道心略微提升概率
  const rate=(baseRate||0.002)*realmPenalty*daoBonus;
  if(D100()>rate*100)return false;
  // 触发顿悟
  const ep=EPIPHANY_TYPES[RI(EPIPHANY_TYPES.length)];
  const result=ep.fx(p);
  say('<b class="lg-g">【顿悟】'+ep.n+'！'+ep.d+'（'+result+'）</b>','g');
  markDeed('顿悟·'+ep.n);
  return true;
}

function addSkillExp(p,skillId,exp){

  const sp=p.skillProf[skillId];
  const sk=SKILL_LIB[skillId];

   sp.lv++;sp.exp-=needExp;
   say('<b class="lg-g">【技能精进】'+sk.n+'提升至 Lv.'+sp.lv+'！效果增强。</b>','g');

/* 自由输入框：回车提交（无表单，绝不触发页面导航） */
document.addEventListener('keydown',function(e){
 const t=e.target;
 if(t&&t.id==='fcmd'&&e.key==='Enter'){
  e.preventDefault();
  const val=t.value;t.value='';
  freeInput(val);
 }
});
function toast(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#3F3A34;color:#FBF8F1;padding:6px 16px;border-radius:6px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}

 G.log.push(
